name: Build Star Quest app
# Manual only: the tablets use the web version now, which updates by itself.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp kids/index.html android/app/src/main/assets/index.html
      - name: Build the app
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk star-quest.apk
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Star Quest app (latest)
          body: Download star-quest.apk on the Fire tablet and tap it to install. Each new version installs over the old one and keeps progress.
          files: star-quest.apk
          make_latest: true
