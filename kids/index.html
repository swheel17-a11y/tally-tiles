<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f8cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Star Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: big-tile home screen for a 7-8 year old on a Fire tablet; each game fills the screen under a slim header with Home and the star count. One bright daytime look on purpose. */
:root{
  --sky:#dff1ff;      /* page */
  --sky-2:#c4e4ff;    /* soft panels */
  --ink:#1d2b4f;      /* text */
  --card:#ffffff;
  --sun:#ffc93c;      /* stars, primary */
  --sun-ink:#4a3200;
  --grass:#3fbf7f;    /* correct */
  --coral:#ff6f61;    /* try again */
  --berry:#7c5cff;
  --ocean:#2f8cff;
  --muted:#5d6b8a;
  --f-display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:17px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
.top{display:flex;align-items:center;gap:12px;min-height:52px}
.top h1{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;text-wrap:balance}
.top h1 small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.back{height:52px;padding:0 18px;border-radius:16px;background:var(--card);font-family:var(--f-display);font-weight:600;font-size:20px;box-shadow:0 4px 0 var(--sky-2)}
.starbox{display:flex;align-items:center;gap:6px;height:52px;padding:0 16px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--sky-2);font-family:var(--f-display);font-size:24px;font-weight:700}
.starbox .s{font-size:26px;line-height:1}
.starbox.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
#view{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto}

/* home */
.hello{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{position:relative;min-height:150px;border-radius:26px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 6px 0 rgba(29,43,79,.18);transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(29,43,79,.18)}
.tile .em{font-size:52px;line-height:1;height:60px;display:block}
.tile b{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1}
.tile>span:last-child{margin-top:10px}
.tile small{font-size:15px;opacity:.92}
.tile .lv{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.28);border-radius:999px;padding:3px 10px;font-size:14px}
.home-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.grownup{position:relative;overflow:hidden;font-size:14px;color:var(--muted);padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.5)}
.grownup i{position:absolute;left:0;bottom:0;height:3px;background:var(--berry);width:0}
.grownup.holding i{width:100%;transition:width 2s linear}

/* shared game bits */
.board{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:8px 0}
.panel{background:var(--card);border-radius:28px;padding:22px 26px;box-shadow:0 6px 0 var(--sky-2);text-align:center;max-width:100%}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,9vw,84px);line-height:1.1;font-variant-numeric:tabular-nums}
.prompt{font-family:var(--f-display);font-weight:600;font-size:24px;color:var(--muted);text-align:center;margin:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(640px,100%)}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice{min-height:92px;border-radius:24px;background:var(--card);font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5.5vw,46px);box-shadow:0 6px 0 var(--sky-2);font-variant-numeric:tabular-nums}
.choice:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sky-2)}
.choice.ok{background:var(--grass);color:#fff;box-shadow:0 6px 0 #2b9462}
.choice.no{background:#ffe1dd;color:#b4372b;animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.progress{display:flex;gap:8px;justify-content:center}
.progress i{width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--sky-2)}
.progress i.on{background:var(--sun);box-shadow:inset 0 0 0 3px #e6a917}
.speak{width:58px;height:58px;border-radius:50%;background:var(--ocean);color:#fff;font-size:26px;box-shadow:0 4px 0 #1f64bd;flex:none}
.row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}

/* math rockets */
.sky{position:relative;width:min(640px,100%);height:120px;border-radius:24px;background:linear-gradient(#22306b,#3b4fa0);overflow:hidden}
.sky .rk{position:absolute;left:50%;font-size:46px;transition:bottom .5s cubic-bezier(.3,1.4,.6,1);transform:translateX(-50%) rotate(-45deg)}
.sky .tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7}
.sky.launch .rk{bottom:140px!important;transition:bottom .9s ease-in}

/* clock */
.clock svg{width:min(300px,58vw);height:auto;display:block}

/* words */
.pic{font-size:clamp(80px,16vw,130px);line-height:1}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{width:62px;height:72px;border-radius:16px;background:var(--card);box-shadow:inset 0 -5px 0 var(--sky-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:40px;text-transform:uppercase}
.slot.fill{background:var(--sun);color:var(--sun-ink);box-shadow:inset 0 -5px 0 #e6a917}
.letters{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:640px}
.letter{width:70px;height:76px;border-radius:18px;background:var(--berry);color:#fff;font-family:var(--f-display);font-weight:700;font-size:40px;text-transform:uppercase;box-shadow:0 6px 0 #5a3fd1}
.letter.gone{visibility:hidden}
.letter.no{background:var(--coral);box-shadow:0 6px 0 #c94a3f;animation:shake .35s}

/* memory */
.mgrid{display:grid;gap:12px;width:min(760px,100%)}
.card{position:relative;height:0;padding:0 0 133% 0;max-width:100%;border-radius:18px;perspective:600px}
.card .in{position:absolute;top:0;left:0;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{background:repeating-linear-gradient(45deg,var(--ocean) 0 10px,#4a9dff 10px 20px);box-shadow:0 5px 0 #1f64bd}
.card .b{background:var(--card);transform:rotateY(180deg);font-size:clamp(34px,7vw,58px);box-shadow:0 5px 0 var(--sky-2)}
.card.done .b{background:#d9f7e8;box-shadow:0 5px 0 #9fe0bf}

/* pattern */
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.seq span{min-width:64px;height:76px;padding:0 8px;border-radius:18px;background:var(--card);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:40px;box-shadow:0 5px 0 var(--sky-2);font-variant-numeric:tabular-nums}
.seq span.q{background:var(--sun);color:var(--sun-ink);box-shadow:0 5px 0 #e6a917}

/* doodle */
.dwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.dcanvas{flex:1;min-height:0;position:relative;border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--sky-2);overflow:hidden;touch-action:none}
.dcanvas canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.dtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.sw{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.tool{height:46px;padding:0 14px;border-radius:14px;background:var(--card);font-family:var(--f-display);font-weight:600;font-size:18px;box-shadow:0 4px 0 var(--sky-2)}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0b1430}
.tool.warn{background:var(--coral);color:#fff;box-shadow:0 4px 0 #c94a3f}


/* fruit pop */
.fwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
.fstats{display:flex;gap:12px;align-items:stretch;width:min(640px,100%)}
.fbox{background:var(--card);border-radius:20px;padding:6px 18px;text-align:center;box-shadow:0 5px 0 var(--sky-2);display:flex;flex-direction:column;justify-content:center}
.fbox small{font-size:14px;color:var(--muted)}
.fbox b{font-family:var(--f-display);font-size:36px;line-height:1}
.fgoal{flex:1;min-width:0;background:var(--card);border-radius:20px;padding:10px 16px;box-shadow:0 5px 0 var(--sky-2);display:flex;flex-direction:column;justify-content:center;gap:8px}
.fglabel{display:flex;justify-content:space-between;gap:8px;font-size:16px;color:var(--muted);flex-wrap:wrap}
.fglabel b{font-family:var(--f-display);color:var(--ink);font-size:20px}
.fbarw{height:16px;border-radius:999px;background:var(--sky);overflow:hidden}
.fbarw i{display:block;height:100%;width:0;background:var(--sun);border-radius:999px;transition:width .4s}
.fbarw i.done{background:var(--grass)}
.fboard{position:relative;max-width:100%;border-radius:24px;background:#ffd6e6;box-shadow:0 6px 0 #f3a9c6;overflow:hidden;touch-action:none;padding:0}
.flayer{position:absolute;top:2%;right:2%;bottom:2%;left:2%}
.ft{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:grid;place-items:center;will-change:transform}
.ft span{width:88%;height:88%;border-radius:22%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:clamp(22px,5.2vmin,46px);line-height:1;transition:transform .26s cubic-bezier(.3,1.6,.5,1),opacity .3s,box-shadow .26s,background .26s}
.ft.sel span{background:#fff;box-shadow:0 0 0 4px var(--berry);transform:scale(1.08)}
.ft.match span{transform:scale(1.22);background:#fff;box-shadow:0 0 0 3px #fff,0 0 22px 6px rgba(255,210,63,.95)}
.ft.burst span{transform:scale(0) rotate(35deg);opacity:0;transition:transform .3s cubic-bezier(.6,-0.4,.7,.6),opacity .3s ease-in}
.ft.born span{animation:born .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes born{0%{transform:scale(.2) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.ft.nope span{animation:shake .35s}
.ft.sp-h span{background:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 18%,rgba(124,92,255,.4) 18% 26%)}
.ft.sp-v span{background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 18%,rgba(124,92,255,.4) 18% 26%)}
.ft.sp-b span{background:radial-gradient(circle,#fff 45%,#ffc93c 46%,#ff9f1c 100%);animation:glowb 1.4s ease-in-out infinite}
.ft.sp-r span{background:conic-gradient(#ff4d4d,#ffd23f,#3fbf7f,#2f8cff,#7c5cff,#ff4d4d);animation:spinr 3s linear infinite}
@keyframes glowb{50%{box-shadow:0 0 18px 4px rgba(255,159,28,.9)}}
@keyframes spinr{to{filter:hue-rotate(360deg)}}
.ft.hint span{animation:wig .7s ease-in-out 3}
@keyframes wig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
.ffx{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.fboard.shake{animation:bshake .3s}
.fboard.shake2{animation:bshake2 .45s}
@keyframes bshake{25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes bshake2{15%{transform:translate(-8px,4px) rotate(-.6deg)}35%{transform:translate(7px,-5px) rotate(.5deg)}55%{transform:translate(-5px,3px)}75%{transform:translate(4px,-2px)}}


/* canvas games */
.cgame{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.chud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chud>span{background:var(--card);border-radius:14px;padding:6px 14px;box-shadow:0 4px 0 var(--sky-2);font-size:17px}
.chud b{font-family:var(--f-display);font-size:22px}
.cbox{flex:1;min-height:320px;position:relative;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--sky-2);touch-action:none;background:#e9f4ff}
.cbox canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none}


/* little kids: pink theme */
:root.little{--sky:#ffe8f3;--sky-2:#ffc9e2;--ink:#5a2050;--muted:#9a5f8c;--sun:#ff8ac4;--sun-ink:#4a0f3a;--berry:#c25bff;--ocean:#ff5fa2}
.ltiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ltiles .tile{min-height:170px}
.ltiles .tile .em{font-size:68px;height:76px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:min(760px,100%);margin:0 auto}
.whob{border-radius:28px;padding:24px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.whob span{font-size:90px;line-height:1}.whob b{font-family:var(--f-display);font-size:32px}.whob small{font-size:16px;opacity:.95}
/* butterfly garden */
.garden{position:relative;flex:1;min-height:420px;border-radius:28px;overflow:hidden;background:linear-gradient(#ffe3f1,#fff3fa 60%,#c9f1d6 60%,#9fe3b5);box-shadow:0 6px 0 var(--sky-2);touch-action:none}
.goal{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94%;z-index:3}
.goal i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 4px #ffb3d6;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.goal i.on{background:#fff;transform:scale(1.12)}
.goal i svg{width:52px}
.gnum{position:absolute;left:18px;top:12px;font-family:var(--f-display);font-weight:700;font-size:64px;color:#ff5fa2;text-shadow:0 3px 0 #fff;z-index:3}
.flowers{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-around;font-size:46px;pointer-events:none}
.bf{position:absolute;width:110px;height:90px;padding:0;transform:translate(-50%,-50%);z-index:2;transition:left .6s ease-in-out,top .6s ease-in-out,opacity .6s}
.bf.caught{width:60px;height:50px;transition:left .55s cubic-bezier(.5,0,.4,1),top .55s cubic-bezier(.5,-0.5,.4,1),width .55s,height .55s;z-index:4}
.bf.away{opacity:0}
.bfs{width:100%;height:100%;display:block}
.bfs .wing{transform-box:view-box;transform-origin:50px 44px;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.6)}}
/* dress-up */
.dress{flex:1;display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;min-height:0}
.stagep{position:relative;flex:1 1 300px;min-height:380px;border-radius:28px;background:radial-gradient(circle at 50% 30%,#fff,#ffe0f0 70%);box-shadow:0 6px 0 var(--sky-2);display:grid;place-items:center;overflow:hidden}
.pwrap{height:min(100%,62vh);width:min(100%,38.75vh);max-width:100%;display:grid;place-items:center}
.pwrap .psvg{width:100%;height:100%}
.pwrap.twirl{animation:twirl .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes twirl{0%{transform:scale(.92) rotate(-4deg)}100%{transform:none}}
.snap{position:absolute;right:14px;bottom:14px;width:76px;height:76px;border-radius:50%;background:#fff;font-size:38px;box-shadow:0 5px 0 var(--sky-2)}
.pside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px}
.pcats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pcat{height:70px;border-radius:20px;background:var(--card);font-size:36px;box-shadow:0 5px 0 var(--sky-2)}
.pcat[aria-pressed="true"]{background:#ff8ac4;box-shadow:0 5px 0 #e0609f;transform:translateY(2px)}
.popts{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;background:rgba(255,255,255,.6);padding:12px;border-radius:22px}
.popt{height:84px;max-width:100%;border-radius:20px;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 0 var(--sky-2);font-size:40px;overflow:hidden}
.popt[aria-pressed="true"]{outline:5px solid #ff5fa2;outline-offset:-1px}
.popt i{width:70%;height:70%;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.popt .psvg{width:100%;height:100%}
.album{display:flex;gap:8px;overflow-x:auto;padding:4px}
.ph{flex:none;width:64px;height:100px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--sky-2);padding:2px}
.ph .psvg{width:100%;height:100%}
.flash{position:fixed;top:0;right:0;bottom:0;left:0;background:#fff;z-index:80;animation:flashout .5s forwards;pointer-events:none}
@keyframes flashout{to{opacity:0}}
.twinkle{position:fixed;z-index:70;font-size:30px;pointer-events:none;animation:twk 1s ease-out forwards}
@keyframes twk{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.3) rotate(90deg)}100%{transform:scale(0) translateY(-30px) rotate(180deg);opacity:0}}
/* coloring */
.cbook{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.cpage{flex:1;min-height:300px;border-radius:28px;background:#fff;box-shadow:0 6px 0 var(--sky-2);display:grid;place-items:center;padding:12px}
.cpage svg{width:100%;height:100%;max-height:62vh}
.rg{cursor:pointer;transition:fill .25s}
.rg.splash{animation:splash .35s}
@keyframes splash{50%{opacity:.6}}
.cpal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cdot{width:60px;height:60px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 4px 0 var(--sky-2)}
.cdot[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:3px;transform:scale(1.08)}
.cpages{display:flex;gap:10px;justify-content:center}
.cpg{width:70px;height:62px;border-radius:18px;background:var(--card);font-size:34px;box-shadow:0 4px 0 var(--sky-2)}
.cpg[aria-pressed="true"]{background:#ff8ac4}
/* color sort */
.sortz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;min-height:420px;padding:10px 0}
.sitem{width:min(200px,40vw);height:min(200px,40vw);touch-action:none;transition:transform .55s cubic-bezier(.5,0,.4,1);filter:drop-shadow(0 6px 0 rgba(90,32,80,.15));cursor:grab}
.sitem.drag{transition:none}
.sitem.in{animation:popin .4s cubic-bezier(.3,1.5,.6,1)}
.sitem.wig{animation:shake .4s}
.sitem svg{width:100%;height:100%}
.sdots{display:flex;gap:8px}.sdots i{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--sky-2)}.sdots i.on{background:#ff8ac4}
.baskets{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%}
.basket{width:min(190px,22vw);min-width:120px;border-radius:22px;background:rgba(255,255,255,.6);display:grid;place-items:center;padding:8px}
.basket svg{width:100%}
.basket.got{animation:bump .4s}
/* tracing */
.trace{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.tbox{flex:1;min-height:360px;position:relative;border-radius:28px;background:#fff;box-shadow:0 6px 0 var(--sky-2);overflow:hidden;touch-action:none}
.tbox canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none}
.tword{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:12px;pointer-events:none;font-family:var(--f-display);font-size:34px;color:var(--ink)}
.tword span{font-size:56px}


/* star gate */
.timechip{display:flex;align-items:center;gap:6px;height:52px;padding:0 14px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--sky-2);font-family:var(--f-display);font-size:22px}
.timechip.low{background:#ffe1dd;color:#b4372b}
.timechip.bump{animation:bump .4s 3}
.spend{max-width:620px}
.spend .em{font-size:72px;line-height:1.1}
.spend h2{margin:4px 0 6px;font-family:var(--f-display);font-size:30px}
.spend p{margin:0 0 14px;color:var(--muted);font-size:18px}
.spend p b{color:var(--ink)}
.spendb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.spendb .choice{min-height:84px;font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.spendb .choice small{font-family:var(--f-body);font-size:15px;color:var(--muted)}
@media (max-width:560px){.spendb{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* story time */
.story{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.scene{position:relative;flex:1;min-height:330px;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--sky-2)}
.sit{position:absolute;transform:translate(-50%,-50%);line-height:1;padding:0;transition:font-size .4s}
.sit.tapme{animation:tapme 1.2s ease-in-out infinite}
@keyframes tapme{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 14px rgba(255,255,255,1)) drop-shadow(0 0 6px #ffd23f)}}
.sit.boing{animation:boing .6s cubic-bezier(.3,1.6,.5,1)}
.sit.spin{animation:spin .7s ease-in-out}
@keyframes boing{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-62%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sparkdot{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.stext{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 var(--sky-2)}
.stext p{margin:0;font-family:var(--f-display);font-size:clamp(20px,3.4vw,30px);line-height:1.3}
.snext{background:var(--sun)!important;color:var(--sun-ink)}
/* sticker playground */
.pground{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.pscene{position:relative;flex:1;min-height:330px;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--sky-2);touch-action:none}
.pdeco,.pst{position:absolute;transform:translate(-50%,-50%);line-height:1;user-select:none}
.pdeco{pointer-events:none;opacity:.95}
.pst{cursor:grab;touch-action:none;transition:font-size .25s cubic-bezier(.3,1.6,.5,1)}
.pst.lift{filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));z-index:5}
.ptrash{position:absolute;right:10px;bottom:10px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:32px}
.ptrash.hot{background:#ffd0d0;transform:scale(1.15)}
.ptray{display:flex;gap:8px;overflow-x:auto;padding:6px;background:rgba(255,255,255,.6);border-radius:20px}
.ptile{flex:none;width:68px;height:68px;border-radius:18px;background:var(--card);font-size:40px;box-shadow:0 4px 0 var(--sky-2);touch-action:none}
.pghost{position:fixed;z-index:90;font-size:64px;transform:translate(-50%,-50%);pointer-events:none}
/* puzzles */
.pz{flex:1;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center;min-height:0}
.pzboard{position:relative;border-radius:16px;background:#fff;box-shadow:0 6px 0 var(--sky-2);flex:none}
.pzghost{position:absolute;top:0;right:0;bottom:0;left:0;background-size:100% 100%;opacity:.16;border-radius:16px}
.pzslot{position:absolute;box-shadow:inset 0 0 0 1.5px rgba(90,32,80,.25)}
.pzboard.solved{animation:bump .6s;box-shadow:0 0 0 6px var(--sun),0 6px 0 var(--sky-2)}
.pztray{flex:1 1 260px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;justify-content:center;min-height:120px;padding:10px;background:rgba(255,255,255,.55);border-radius:20px}
.pzp{position:relative;border-radius:6px;box-shadow:0 3px 8px rgba(90,32,80,.3);touch-action:none;cursor:grab;flex:none}
.pzp.drag{position:fixed;z-index:90;transform:scale(1.06);box-shadow:0 10px 18px rgba(90,32,80,.4)}
.pzp.done{position:absolute;box-shadow:none;border-radius:0;cursor:default}
/* piano */
.piano{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative}
.pmodes{display:flex;gap:10px;justify-content:center}
.pfloat{position:relative;flex:1;min-height:90px}
.pnote{position:absolute;bottom:0;font-size:44px;transform:translateX(-50%);animation:pfloat 1.2s ease-out forwards;pointer-events:none}
@keyframes pfloat{to{transform:translate(-50%,-160px) scale(1.4);opacity:0}}
.keys{display:flex;gap:8px;height:min(46vh,360px)}
.key{flex:1;min-width:0;border-radius:0 0 22px 22px;background:linear-gradient(#fff 0%,#fff 55%,var(--kc) 100%);box-shadow:0 8px 0 var(--kc),inset 0 0 0 3px var(--kc);display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;font-size:clamp(26px,5vw,44px);touch-action:none}
.key.hit{animation:keyhit .25s}
@keyframes keyhit{50%{transform:translateY(6px);box-shadow:0 2px 0 var(--kc),inset 0 0 0 3px var(--kc)}}
.key.glow{animation:keyglow .9s ease-in-out infinite;background:linear-gradient(#fffbe0,#ffe58a 55%,var(--kc))}
@keyframes keyglow{50%{box-shadow:0 8px 0 var(--kc),0 0 24px 6px #ffd23f}}
/* robot */
.robot{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.rgrid{position:relative;display:grid;gap:4px;width:min(440px,90vw,52vh);background:#c9d6ff;padding:6px;border-radius:18px}
.rcell{position:relative;height:0;padding-bottom:100%;background:#fff;border-radius:8px;font-size:clamp(18px,4.5vw,34px);line-height:1}
.rcell b{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:400}
.rcell.wall{background:#8a96c9}
.rbot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5vw,38px);transition:left .3s,top .3s;padding:6px;pointer-events:none}
.rbot.bump{animation:shake .4s}
.rbot.win{animation:bump .5s 2}
.rprog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rprog span{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 2px var(--sky-2);display:grid;place-items:center;font-size:28px;font-weight:800}
.rprog span.full{background:#fff}
.rprog span.on{background:var(--sun)}
.rkeys{display:flex;gap:10px}
.rkey{width:70px;height:70px;border-radius:18px;background:#5b6ee1;color:#fff;font-size:38px;font-weight:800;box-shadow:0 5px 0 #3e4fb3}
.rkey.del{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--sky-2)}
.pbtn.go{background:var(--grass);color:#fff;box-shadow:0 4px 0 #2b9462}
/* boss */
.boss{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.arena{position:relative;display:flex;justify-content:space-between;align-items:flex-end;width:min(640px,100%);height:200px;padding:10px 20px;border-radius:24px;background:linear-gradient(#2a2d5c,#5a3f8f);overflow:hidden}
.hero{font-size:72px;line-height:1;text-align:center}
.hearts{font-size:20px}
.foe{text-align:center}
.bossem{font-size:110px;line-height:1;animation:hover 2s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.bossem.hit{animation:bhit .4s}
@keyframes bhit{30%{filter:brightness(2) drop-shadow(0 0 12px #fff);transform:translateX(10px)}}
.bossem.lunge{animation:lunge .5s}
@keyframes lunge{40%{transform:translateX(-120px) scale(1.15)}}
.bossem.ko{animation:ko .9s forwards}
@keyframes ko{to{transform:rotate(90deg) translateY(40px);opacity:0}}
.hpbar{width:140px;height:14px;border-radius:999px;background:rgba(255,255,255,.25);margin:0 auto 6px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ffd23f);transition:width .4s}
.zap{position:absolute;left:90px;bottom:60px;font-size:48px;opacity:0}
.zap.fire{animation:zap .4s ease-in}
@keyframes zap{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(min(420px,60vw)) scale(1.4)}}
/* daily */
.week{display:flex;gap:8px;justify-content:center;margin:6px 0}
.week span{width:46px;border-radius:12px;background:rgba(255,255,255,.7);padding:4px 0;text-align:center;font-size:20px;display:flex;flex-direction:column}
.week span small{font-size:12px;color:var(--muted)}
.week span.on{background:#d9f7e8}

/* brick builder */
.bb{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.bbstage{position:relative;flex:1;min-height:300px;border-radius:24px;overflow:hidden;background:#cfe8ff;box-shadow:0 6px 0 var(--sky-2)}
.bbcv{position:absolute;top:0;left:0;display:block}
.bbload{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--f-display);font-size:22px;color:var(--muted)}
.bbhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(29,43,79,.78);color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.bbhint.gone{opacity:0}
.bbbar{display:flex;flex-direction:column;gap:8px}
.bbtools,.bbsizes,.bbcols{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bbt{min-width:66px;height:60px;border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--sky-2);font-size:24px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 8px}
.bbt small{font-size:12px;font-family:var(--f-body)}
.bbt[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0d1630}
.bbs{height:56px;min-width:56px;padding:0 8px;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--sky-2);display:flex;align-items:center;justify-content:center}
.bbs[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:-2px}
.bbc{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 0 var(--sky-2)}
.bbc[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:3px}
.bbidea{align-self:center;background:#fff6d6;color:var(--sun-ink);border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:18px;box-shadow:0 3px 0 #f0dc9c}
.bbgal{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(223,241,255,.97);padding:16px;overflow-y:auto;z-index:2}
.bbgh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.bbgh b{font-family:var(--f-display);font-size:26px}
.bbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bbcard{position:relative;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--sky-2);overflow:hidden}
.bbcard.on{outline:4px solid var(--ocean)}
.bbcard.new,.bbopen{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;min-height:150px}
.bbcard.new span,.bbopen span{font-size:46px}
.bbopen img{width:100%;border-radius:12px;display:block}
.bbdel{position:absolute;top:6px;right:6px;height:36px;min-width:36px;border-radius:12px;background:rgba(255,255,255,.9);font-size:18px;padding:0 6px}
.bbdel.arm{background:var(--coral);color:#fff;font-size:15px}
@media (orientation:landscape) and (min-width:900px){
  .bb{flex-direction:row}
  .bbbar{width:300px;flex:none;overflow-y:auto;justify-content:flex-start}
  .bbtools{display:grid;grid-template-columns:repeat(3,1fr)}
  .bbt{min-width:0}
  .bbsizes{justify-content:flex-start}
}
/* magic adventure */
.advpick .tile .em{font-size:76px;height:84px}
.pickbounce{animation:bump .5s}
.adv{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.ascene{position:relative;flex:1;min-height:340px;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--sky-2)}
.adeco{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;opacity:.9}
.apr{position:absolute;left:2%;bottom:2%;width:30%;height:62%;padding:0}
.apr svg{width:100%;height:100%;display:block}
.afr{position:absolute;left:30%;bottom:5%;font-size:min(17vmin,130px);line-height:1;padding:0}
.abow{position:absolute;left:58%;top:-14%;width:52%;display:block;pointer-events:none}
.abow svg{width:100%;display:block}
.apr.boing,.afr.boing{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-14%) scale(1.08)}}
.ait{position:absolute;transform:translate(-50%,-50%);font-size:min(12vmin,96px);line-height:1;padding:6px}
.ait.float{animation:afl 2.4s ease-in-out infinite}
@keyframes afl{50%{transform:translate(-50%,-62%)}}
.ait.gone{animation:apop .35s forwards!important;pointer-events:none}
@keyframes apop{to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.ait.wig{animation:wig .45s}
@keyframes wig{20%{transform:translate(-60%,-50%) rotate(-10deg)}60%{transform:translate(-40%,-50%) rotate(10deg)}}
.ait.picked{animation:none;transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 14px #fff)}
.achoice{font-size:min(16vmin,130px);background:rgba(255,255,255,.55);border-radius:50%;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.aswatch{width:min(13vmin,96px);height:min(13vmin,96px);border-radius:50%;padding:0;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.aswatch.picked{transform:translate(-50%,-50%) scale(1.2);border-color:var(--sun)}
.abub{width:min(14vmin,110px);height:min(14vmin,110px);border-radius:50%;border:3px solid rgba(255,255,255,.9);background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.25) 22%,rgba(170,225,255,.35) 70%,rgba(255,170,240,.45))}
.afall{transition:none}
.ameter{position:absolute;top:10px;right:12px;display:flex;gap:4px;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;font-size:min(5vmin,34px)}
.ameter i{font-style:normal;opacity:.25;filter:grayscale(1)}
.ameter i.on{opacity:1;filter:none}
.abell{width:min(12vmin,92px);height:min(12vmin,92px);border-radius:50%;font-size:min(7vmin,52px);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.abell.ring{animation:ring .5s}
@keyframes ring{25%{transform:translate(-50%,-50%) rotate(-18deg) scale(1.12)}75%{transform:translate(-50%,-50%) rotate(18deg) scale(1.12)}}
.anote{position:absolute;font-size:min(6vmin,44px);pointer-events:none;animation:note 1.2s ease-out forwards}
@keyframes note{to{transform:translate(-30%,-200%);opacity:0}}
.agrow{transition:font-size .4s cubic-bezier(.3,1.6,.5,1)}
.agrow.bloom{animation:spinin .8s}
@keyframes spinin{from{transform:translate(-50%,-50%) rotate(-200deg) scale(.3)}}
.awant{position:absolute;top:10px;right:12px;background:#fff;border-radius:22px;padding:6px 14px;font-size:min(9vmin,64px);line-height:1;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.awant small{font-size:18px;font-family:var(--f-display);color:var(--muted)}
.ahide{font-size:min(14vmin,110px)}
.ahide.peek{transform:translate(-50%,-20%) rotate(12deg);transition:transform .4s}
.afound{font-size:min(11vmin,84px);animation:found .7s cubic-bezier(.3,1.6,.5,1);z-index:1}
@keyframes found{from{transform:translate(-50%,10%) scale(.2)}}
.afood.fly{animation:none;transition:left .6s ease-in,top .6s ease-in,transform .6s ease-in;transform:translate(-50%,-50%) scale(.4)}
.anext{font-size:28px;min-width:72px;animation:tapme2 1.2s ease-in-out infinite}
@keyframes tapme2{50%{transform:scale(1.12)}}
.stext .anext{margin-left:auto;flex:none}
.aend{position:absolute;left:66%;top:42%;transform:translate(-50%,-50%);font-size:min(26vmin,200px);animation:spinin 1s}
.ascene.night .stext p{color:inherit}
@media (orientation:portrait){.apr{width:36%;height:48%}.afr{left:34%}}
/* fishing trip */
.fspot{height:44px;font-size:16px;padding:0 12px}
.fspot[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0d1630}
.fbook{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(223,241,255,.97);padding:16px;overflow-y:auto;z-index:3;touch-action:pan-y}
.fbook h3{font-family:var(--f-display);font-size:22px;margin:14px 0 8px}
.fbook h3 small{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fcard{background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:0 4px 0 var(--sky-2);display:flex;flex-direction:column;gap:2px}
.fcard span{font-size:44px;line-height:1.1}
.fcard b{font-family:var(--f-display);font-size:18px}
.fcard small{font-size:13px;color:var(--muted)}
.fcard.unk span{filter:brightness(0);opacity:.25}
/* movies & shows */
.tvhome{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.tvh{font-family:var(--f-display);font-size:24px;margin:8px 0 0}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tvgrid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tvrow{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;touch-action:pan-x}
.tvrow .tve{flex:none;width:250px}
.tvp,.tve{display:flex;flex-direction:column;gap:6px;text-align:left}
.tvp b,.tve b{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tvimg{position:relative;display:block;width:100%;padding-bottom:150%;border-radius:16px;overflow:hidden;background:#1d2b4f;box-shadow:0 5px 0 var(--sky-2)}
.tvimg.wide{padding-bottom:56.25%}
.tvimg img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.tvimg i{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-style:normal}
.tvimg u{position:absolute;left:0;bottom:0;height:6px;background:var(--sun)}
.tvimg em{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--grass);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:17px}
.tvp:active .tvimg,.tve:active .tvimg{transform:translateY(3px)}
.tvs[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0d1630}
.tvplay{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.tvvwrap{position:relative;flex:1;min-height:240px;background:#000;border-radius:20px;overflow:hidden}
.tvvwrap video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
.tvover{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff;text-align:center;padding:20px;font-family:var(--f-display);font-size:22px}
.tvover[hidden]{display:none}
.tvover button{pointer-events:auto}
.tvbig{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--ink);font-size:46px}
.tvmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-family:var(--f-display);font-size:20px}
.tvspin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(127,140,170,.3);border-top-color:var(--ocean);animation:tvspin 1s linear infinite}
@keyframes tvspin{to{transform:rotate(360deg)}}
.gin{font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid var(--sky-2);width:13em;max-width:100%;user-select:text;-webkit-user-select:text}
html.little .tvgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
html.little .tvp b,html.little .tve b{font-size:20px}
/* stickers + grown-ups */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.sticker{height:100px;border-radius:22px;background:var(--card);display:grid;place-items:center;font-size:52px;box-shadow:0 5px 0 var(--sky-2)}
.sticker.locked{background:rgba(255,255,255,.45);color:var(--muted);font-family:var(--f-display);font-size:30px;box-shadow:none}
.note{color:var(--muted);font-size:16px;margin:0;max-width:62ch}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px 10px 16px;box-shadow:0 4px 0 var(--sky-2)}
.prow .ctl{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px}
.pm{width:48px;height:48px;border-radius:14px;background:var(--sky);font-family:var(--f-display);font-size:26px}
.pbtn{height:52px;padding:0 20px;border-radius:16px;background:var(--card);font-family:var(--f-display);font-weight:600;font-size:19px;box-shadow:0 4px 0 var(--sky-2)}
.pbtn.warn{background:var(--coral);color:#fff;box-shadow:0 4px 0 #c94a3f}

/* popups */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(29,43,79,.45);display:grid;place-items:center;z-index:50;padding:20px}
.pop{background:var(--card);border-radius:30px;padding:26px 30px;text-align:center;max-width:420px;width:100%;box-shadow:0 10px 0 var(--sky-2);animation:popin .35s cubic-bezier(.3,1.5,.6,1)}
.pop .em{font-size:96px;line-height:1.1}
.pop h2{margin:6px 0 4px;font-family:var(--f-display);font-weight:700;font-size:32px}
.pop p{margin:0 0 16px;color:var(--muted)}
.pop .go{height:60px;padding:0 30px;border-radius:20px;background:var(--sun);color:var(--sun-ink);font-family:var(--f-display);font-weight:700;font-size:24px;box-shadow:0 5px 0 #e6a917}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.fly{position:fixed;z-index:60;font-size:34px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s}
@media (max-width:560px){.tile{min-height:128px}.tile .em{font-size:44px}.choice{min-height:80px}.letter{width:58px;height:66px;font-size:34px}.slot{width:52px;height:62px;font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <button class="back" id="homeBtn" hidden>← Home</button>
    <h1 id="title">Star Quest</h1>
    <div class="timechip" id="timeChip" hidden aria-label="Play time left">⏱ <b id="timeLeft">0:00</b></div>
    <div class="starbox" id="starbox" aria-label="Stars"><span class="s">⭐</span><span id="starCount">0</span></div>
  </header>
  <main id="view"></main>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const view=$('#view');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- saved progress (stays on this tablet) ---------- */
const KEY='star-quest-v1';
const GAMES=[
  {id:'math',name:'Math Rockets',em:'🚀',sub:'Add, subtract, times',color:'#ff6f61',max:11},
  {id:'clock',name:'Clock Time',em:'🕒',sub:'Tell the time',color:'#2f8cff',max:5},
  {id:'words',name:'Word Builder',em:'🔤',sub:'Spell the picture',color:'#7c5cff',max:4},
  {id:'rhyme',name:'Rhyme Time',em:'🎵',sub:'Find the rhyme',color:'#e0569b',max:3},
  {id:'memory',name:'Memory Match',em:'🃏',sub:'Find the pairs',color:'#16a3a3',max:4,both:true},
  {id:'pattern',name:'What Comes Next',em:'🔷',sub:'Finish the pattern',color:'#3fbf7f',max:5},
  {id:'fruit',name:'Fruit Pop',em:'🍓',sub:'Match 3 in a row',color:'#ff4f8b',max:999,play:true},
  {id:'bubble',name:'Bubble Pop',em:'🎯',sub:'Aim, bounce, pop!',color:'#13a5d6',max:999,play:true},
  {id:'runner',name:'Dino Dash',em:'🦖',sub:'Run, jump, grab stars',color:'#4fae3c',max:0,play:true},
  {id:'tower',name:'Tower Builder',em:'🏗️',sub:'Stack it sky high',color:'#8a5cf6',max:0,play:true},
  {id:'tv',name:'Movies & Shows',em:'🍿',sub:'Watch your shows',color:'#3b3f8f',max:0,play:true,both:true},
  {id:'slice',name:'Fruit Slice',em:'🔪',sub:'Swipe, slice, splat!',color:'#e8443a',max:0,play:true},
  {id:'fish',name:'Fishing Trip',em:'🎣',sub:'Catch them all',color:'#1a8fb5',max:0,play:true},
  {id:'brick',name:'Brick Builder',em:'🧱',sub:'Build anything in 3D',color:'#d9262b',max:0,play:true},
  {id:'doodle',name:'Doodle Pad',em:'🎨',sub:'Draw anything',color:'#f59a23',max:0,play:true,both:true},
  {id:'adventure',name:'Magic Adventure',em:'🦄',sub:'You pick what happens',color:'#9b6bff',max:0,little:true},
  {id:'butterfly',name:'Butterfly Garden',em:'🦋',sub:'Catch and count',color:'#ff7eb6',max:4,little:true},
  {id:'dressup',name:'Princess Dress-Up',em:'👸',sub:'Dresses and crowns',color:'#b57bff',max:0,little:true},
  {id:'color',name:'Coloring Book',em:'🖍️',sub:'Color the pictures',color:'#ff9f6b',max:0,little:true},
  {id:'sort',name:'Color Sort',em:'🧺',sub:'Match the colors',color:'#3fbf7f',max:3,little:true},
  {id:'trace',name:'Trace Letters',em:'✏️',sub:'Your name and ABCs',color:'#5aa9ff',max:0,little:true},
  {id:'story',name:'Story Time',em:'📖',sub:'Stories about you',color:'#e85d9c',max:0,little:true},
  {id:'playground',name:'Sticker Playground',em:'🏰',sub:'Place your stickers',color:'#8d6be8',max:0,little:true},
  {id:'puzzle',name:'Picture Puzzles',em:'🧩',sub:'Put the pieces together',color:'#22a7a0',max:4,little:true},
  {id:'piano',name:'Pink Piano',em:'🎹',sub:'Play music and songs',color:'#ff8ac4',max:0,little:true},
  {id:'robot',name:'Robot Path',em:'🤖',sub:'Program the robot',color:'#5b6ee1',max:8},
  {id:'boss',name:'Boss Battle',em:'👾',sub:'Times tables',color:'#d9435b',max:6},
  {id:'daily',name:'Daily Challenge',em:'📅',sub:'5 puzzles a day',color:'#f08a12',max:0}
];
const STICKERS='🐶🐱🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🦉🦄🐝🦋🐢🐙🦈🐬🐳🦖🦕🚒🚜🏎️🚂✈️🛸🌈⭐🌟🍕🍩🎈🏆👑'.match(/\p{Extended_Pictographic}️?/gu);
const blank=()=>({stars:0,sound:true,lv:Object.fromEntries(GAMES.map(g=>[g.id,1])),got:Object.fromEntries(GAMES.map(g=>[g.id,0]))});
let K=blank();
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)K=Object.assign(blank(),d,{lv:Object.assign(blank().lv,d.lv||{}),got:Object.assign(blank().got,d.got||{})})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(K))}catch(e){}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
const stickerSet=()=>K.mode==='little'?LITTLE_STICKERS:STICKERS;
const stickersEarned=()=>Math.min(stickerSet().length,Math.floor(K.stars/10));

/* ---------- sound (gentle beeps, made on the tablet) ---------- */
let ac=null;
function tone(notes,type='sine',vol=0.12){
  if(!K.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime;
    notes.forEach(([f,at,len])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(vol,t0+at+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+at+len);
      o.connect(g).connect(ac.destination);o.start(t0+at);o.stop(t0+at+len+0.05)})}catch(e){}
}
const sfx={yes:()=>tone([[660,0,.15],[880,.1,.25]]),no:()=>tone([[220,0,.22]],'triangle',0.1),
  up:()=>tone([[523,0,.15],[659,.12,.15],[784,.24,.15],[1047,.36,.35]]),tap:()=>tone([[520,0,.06]],'sine',0.05)};
const canSpeak=!!window.SQAndroid||'speechSynthesis' in window;
function say(text,force){if(canSpeak)speakNow(text,force)}

/* ---------- stars, levels, stickers ---------- */
/* ---------- star gate: Learn games fill a wallet, Fun games spend it as play time ---------- */
const GATED=['fruit','bubble','runner','tower','brick','fish','tv','slice'];
const gateOn=()=>K.mode!=='little'&&K.gate!==false;
const isGated=id=>gateOn()&&GATED.includes(id);
const minsPerStar=()=>K.minsPerStar||2;
if(K.wallet===undefined){K.wallet=Math.min(K.stars||0,5);K.playSec=0}
const fmtSec=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function updateStars(){$('#starCount').textContent=gateOn()?K.wallet:K.stars;$('#starbox').setAttribute('aria-label',gateOn()?'Stars to spend':'Stars')}
function spendScreen(id,start){
  const g=GAMES.find(x=>x.id===id),m=minsPerStar();setHeader(g.name,'Uses play time');
  view.innerHTML=`<div class="board"><div class="panel spend"><div class="em">${g.em}</div>
      <h2>Spend stars to play</h2>
      <p>You have <b>${K.wallet}</b> star${K.wallet===1?'':'s'}. Each star is <b>${m} minute${m>1?'s':''}</b> of play time.</p>
      <div class="spendb">${[1,3,5,10].map(k=>`<button class="choice" data-k="${k}" ${K.wallet<k?'disabled':''}><b>⭐ ${k}</b><small>${k*m} min</small></button>`).join('')}</div>
      ${K.wallet<1?'<p class="note" style="margin:10px auto 0">Play the Learn games to earn stars!</p>':''}
      <button class="pbtn" id="earn" style="margin-top:14px">Earn more stars</button></div></div>`;
  view.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(K.wallet<k)return;K.wallet-=k;K.playSec=(K.playSec||0)+k*m*60;save();updateStars();sfx.up();
    speakNow(`${k*m} minutes of play time!`);showTimer(id);start()});
  $('#earn').onclick=()=>go('home');
}
function showTimer(id){const c=$('#timeChip');c.hidden=!isGated(id);$('#timeLeft').textContent=fmtSec(K.playSec||0);c.classList.toggle('low',(K.playSec||0)<=60)}
function gated(id,start){return()=>{if(!isGated(id)){$('#timeChip').hidden=true;return start()}if((K.playSec||0)>0){showTimer(id);return start()}spendScreen(id,start)}}
let gateTick=0;
setInterval(()=>{const r=location.hash.slice(1);if(!isGated(r)||document.hidden||!$('#overlay').hidden||!(K.playSec>0)||$('.spend'))return;
  K.playSec--;showTimer(r);if(++gateTick%10===0)save();
  if(K.playSec===60){speakNow('One minute of play time left!');const c=$('#timeChip');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
  if(K.playSec<=0){K.playSec=0;save();loopToken++;sfx.no();speakNow('Play time is up!');
    popup('⏰','Play time is up!',K.wallet>0?`You have ${K.wallet} stars to spend, or earn more in the Learn games.`:'Earn more stars in the Learn games to play again!','OK',()=>go('home'))}},1000);
function flyStar(fromEl){
  const r=fromEl?fromEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const t=$('#starbox').getBoundingClientRect();
  const s=document.createElement('span');s.className='fly';s.textContent='⭐';
  s.style.left=(r.left+r.width/2-17)+'px';s.style.top=(r.top+r.height/2-17)+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>{s.style.transform=`translate(${t.left+t.width/2-(r.left+r.width/2)}px,${t.top+t.height/2-(r.top+r.height/2)}px) scale(.7)`;s.style.opacity='.4'});
  setTimeout(()=>{s.remove();const b=$('#starbox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')},700);
}
// returns true if a popup will show
function addStars(n,fromEl,game){
  const before=stickersEarned();
  K.stars+=n;if(!GATED.includes(game))K.wallet=(K.wallet||0)+n;save();
  for(let i=0;i<n;i++)setTimeout(()=>flyStar(fromEl),i*120);
  setTimeout(updateStars,700);
  if(stickersEarned()>before){setTimeout(()=>{sfx.up();speakNow('You got a new sticker!');popup(stickerSet()[stickersEarned()-1],'New sticker!','It’s in your sticker book.','Yay!')},900);return true}
  return false;
}
const PER_LEVEL=6;
// a correct answer in a game; returns true when the level goes up
function correct(id){const g=GAMES.find(x=>x.id===id);K.got[id]=(K.got[id]||0)+1;
  if(K.got[id]>=PER_LEVEL&&K.lv[id]<g.max){K.lv[id]++;K.got[id]=0;save();return true}
  if(K.lv[id]>=g.max)K.got[id]=Math.min(K.got[id],PER_LEVEL-1);save();return false}
const popQ=[];
function popup(em,title,text,btn,then){
  const o=$('#overlay');if(!o.hidden){popQ.push([em,title,text,btn,then]);return}
  o.hidden=false;
  o.innerHTML=`<div class="pop" role="dialog" aria-label="${title}"><div class="em">${em}</div><h2>${title}</h2><p>${text}</p><button class="go" id="popGo">${btn}</button></div>`;
  $('#popGo').onclick=()=>{o.hidden=true;then&&then();if(popQ.length)popup(...popQ.shift())};
}
function levelUp(id,then){sfx.up();popup('🏅','Level up!',`${GAMES.find(g=>g.id===id).name} is now level ${K.lv[id]}.`,'Keep going',then)}
function progressDots(id){const g=GAMES.find(x=>x.id===id);const n=K.lv[id]>=g.max?0:K.got[id];
  return `<div class="progress" aria-label="${n} of ${PER_LEVEL} to the next level">${[...Array(PER_LEVEL)].map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`}
function setHeader(title,sub){$('#title').innerHTML=sub?`${title}<small>${sub}</small>`:title;$('#homeBtn').hidden=title==='Star Quest'}

/* ---------- multiple-choice helper ---------- */
function choices(opts,answer,onRight,cls){
  const box=document.createElement('div');box.className='choices'+(cls?' '+cls:'');
  let done=false;
  opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.innerHTML=o.html??o;
    b.onclick=()=>{if(done)return;const v=o.val??o;
      if(v===answer){done=true;b.classList.add('ok');sfx.yes();onRight(b)}
      else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.no()}};
    box.appendChild(b)});
  return box;
}
function nearOptions(ans,count,spread,min=0){const s=new Set([ans]);let guard=0;
  while(s.size<count&&guard++<200){const d=rnd(1,spread)*(Math.random()<.5?-1:1);const v=ans+d;if(v>=min)s.add(v)}
  let k=1;while(s.size<count)s.add(ans+spread+k++);return shuffle([...s])}

/* =========================================================
   MATH ROCKETS
   ========================================================= */
function mathQ(lv){
  let a,b,op;
  const L=lv>10?pick([6,7,9,10]):lv;
  switch(L){
    case 1:a=rnd(1,9);b=rnd(1,10-a);op='+';break;
    case 2:a=rnd(3,10);b=rnd(1,a);op='−';break;
    case 3:a=rnd(5,14);b=rnd(2,20-a);op='+';break;
    case 4:a=rnd(10,20);b=rnd(2,a-1);op='−';break;
    case 5:{const a1=rnd(1,7),a0=rnd(0,8),b1=rnd(1,8-a1),b0=rnd(0,9-a0);a=a1*10+a0;b=b1*10+b0;op='+';break}
    case 6:do{a=rnd(15,79);b=rnd(6,99-a)}while(a%10+b%10<10);op='+';break;
    case 7:a=rnd(30,99);b=rnd(6,a-10);op='−';break;
    case 8:a=pick([2,5,10]);b=rnd(1,10);op='×';break;
    case 9:a=rnd(2,5);b=rnd(1,10);op='×';break;
    default:a=rnd(2,9);b=rnd(2,9);op='×';
  }
  if(op==='×'&&Math.random()<.5)[a,b]=[b,a];
  const ans=op==='+'?a+b:op==='−'?a-b:a*b;
  return{text:`${a} ${op} ${b}`,ans,spread:ans<10?3:ans<30?5:10};
}
let rocketH=0;
function playMath(){
  if(location.hash!=='#math')return; // a late timer from a game you already left
  const lv=K.lv.math;setHeader('Math Rockets',`Level ${lv}`);
  const q=mathQ(lv);
  view.innerHTML=`<div class="board">
    <div class="sky" id="sky">${[...Array(18)].map(()=>`<i class="tw" style="left:${rnd(2,98)}%;top:${rnd(5,90)}%"></i>`).join('')}<span class="rk" id="rk" style="bottom:${8+K.got.math*16}px">🚀</span></div>
    <div class="panel"><div class="big">${q.text} = ?</div></div>
    <div id="ch"></div>${progressDots('math')}</div>`;
  $('#ch').replaceWith(choices(nearOptions(q.ans,4,q.spread),q.ans,btn=>{
    addStars(1,btn,'math');const up=correct('math');
    $('#rk').style.bottom=(8+Math.min(K.got.math||6,6)*16)+'px';
    if(up){$('#sky').classList.add('launch');setTimeout(()=>levelUp('math',playMath),900)}
    else setTimeout(playMath,800);
  }));
}

/* =========================================================
   CLOCK TIME
   ========================================================= */
function clockSVG(h,m){
  const ha=((h%12)+m/60)*30,ma=m*6;
  let nums='';for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;nums+=`<text x="${100+66*Math.sin(a)}" y="${100-66*Math.cos(a)+7}" text-anchor="middle" font-size="20" font-family="Fredoka, sans-serif" font-weight="700" fill="#1d2b4f">${i}</text>`}
  let ticks='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?88:84;ticks+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+92*Math.sin(a)}" y2="${100-92*Math.cos(a)}" stroke="#9aa9c7" stroke-width="${i%5?1.5:3}"/>`}
  return `<svg viewBox="0 0 200 200" role="img" aria-label="A clock"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#2f8cff" stroke-width="7"/>${ticks}${nums}
    <line x1="100" y1="100" x2="${100+46*Math.sin(ha*Math.PI/180)}" y2="${100-46*Math.cos(ha*Math.PI/180)}" stroke="#1d2b4f" stroke-width="9" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${100+70*Math.sin(ma*Math.PI/180)}" y2="${100-70*Math.cos(ma*Math.PI/180)}" stroke="#ff6f61" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#1d2b4f"/></svg>`;
}
const fmt=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
function playClock(){
  if(location.hash!=='#clock')return; // a late timer from a game you already left
  const lv=K.lv.clock;setHeader('Clock Time',`Level ${lv}`);
  const mins=lv===1?[0]:lv===2?[0,30]:lv===3?[0,15,30,45]:[...Array(12)].map((_,i)=>i*5);
  const h=rnd(1,12),m=pick(mins),ans=fmt(h,m);
  const s=new Set([ans]);const wrap=x=>((x-1+12)%12)+1;let guard=0;
  while(s.size<4&&guard++<100){const k=rnd(0,3);
    if(k===0)s.add(fmt(wrap(h+pick([-1,1])),m));
    else if(k===1)s.add(fmt(h,pick(mins.length>1?mins:[0,30])));
    else if(k===2&&m%5===0&&m>0)s.add(fmt(wrap(m/5),(h%12)*5));   // hands mixed up
    else s.add(fmt(wrap(h+pick([-2,2])),pick(lv<3?[0,30]:mins)))}
  view.innerHTML=`<div class="board"><p class="prompt">What time is it?</p><div class="panel clock">${clockSVG(h,m)}</div><div id="ch"></div>${progressDots('clock')}</div>`;
  $('#ch').replaceWith(choices(shuffle([...s]),ans,btn=>{addStars(1,btn,'clock');if(correct('clock'))setTimeout(()=>levelUp('clock',playClock),600);else setTimeout(playClock,800)}));
}

/* =========================================================
   WORD BUILDER
   ========================================================= */
const WORDS=[

const SHAPES=['🔴','🔵','🟡','🟢','🟣','🟠','⭐','❤️','🔺','🟦'];
function patternQ(lv){
  const kind=lv===1?'ab':lv===2?pick(['abb','aab','abc']):lv===3?pick(['count','abc','aabb']):lv===4?pick(['count','step','aabb']):pick(['step','double','down','abcd']);
  let seq,ans,pool;
  const sym=n=>shuffle(SHAPES.slice()).slice(0,n);
  const rep=(unit,len)=>[...Array(len)].map((_,i)=>unit[i%unit.length]);
  if(['ab','abb','aab','abc','aabb','abcd'].includes(kind)){
    const [A,B,C,D]=sym(4);
    const unit={ab:[A,B],abb:[A,B,B],aab:[A,A,B],abc:[A,B,C],aabb:[A,A,B,B],abcd:[A,B,C,D]}[kind];
    const full=rep(unit,unit.length*2+1+(kind==='ab'?2:0));ans=full.pop();seq=full;pool=[...new Set(unit)];
    while(pool.length<3)pool.push(pick(SHAPES.filter(s=>!pool.includes(s))));
    return{seq,ans,opts:shuffle(pool.slice(0,Math.max(3,new Set(unit).size)))};
  }
  let start,step;
  if(kind==='count'){step=pick([2,5,10]);start=step*rnd(0,4)}
  else if(kind==='step'){step=rnd(3,4);start=rnd(1,10)}
  else if(kind==='down'){step=-pick([2,5,10]);start=rnd(8,12)*Math.abs(step)}
  if(kind==='double'){start=rnd(1,3);seq=[start];for(let i=0;i<4;i++)seq.push(seq[i]*2);ans=seq[4]*2}
  else{seq=[...Array(5)].map((_,i)=>start+step*i);ans=start+step*5}
  return{seq,ans,opts:nearOptions(ans,3,Math.max(2,Math.abs(step||4)))};
}
function playPattern(){
  if(location.hash!=='#pattern')return; // a late timer from a game you already left
  const lv=K.lv.pattern;setHeader('What Comes Next',`Level ${lv}`);
  const q=patternQ(lv);
  view.innerHTML=`<div class="board"><p class="prompt">What comes next?</p><div class="seq">${q.seq.map(s=>`<span>${s}</span>`).join('')}<span class="q">?</span></div><div id="ch"></div>${progressDots('pattern')}</div>`;
  $('#ch').replaceWith(choices(q.opts,q.ans,btn=>{const last=view.querySelector('.seq .q');last.textContent=q.ans;last.classList.remove('q');
    addStars(1,btn,'pattern');if(correct('pattern'))setTimeout(()=>levelUp('pattern',playPattern),700);else setTimeout(playPattern,900)},'c3'));
}

/* =========================================================
   FRUIT POP (match 3)
   Every animation step has a fixed, unhurried length and the game waits for it,
   so matches always play out the same way: glow, burst, fall with a bounce.
   ========================================================= */
const FR=['🍓','🍊','🍋','🍏','🍇','🍑'];
const FRC=['#ff4d6d','#ff9f1c','#ffd23f','#5cc463','#9a63e0','#ff9a8b'];
const FN=8;
const FT={swap:240,glow:260,pop:300,fallBase:220,fallRow:75,settle:60,beam:420,born:420};
let F=null,fid=0;
const fsleep=ms=>new Promise(r=>setTimeout(r,ms));
const fColors=lv=>lv<=4?5:6;
const fTarget=lv=>1200+lv*500;
const fMoves=lv=>Math.max(18,24-Math.floor(lv/4));
const fTile=c=>({id:++fid,c,s:null});
const fy=p=>Math.floor(p/FN),fx=p=>p%FN;
function fNewBoard(lv){
  const n=fColors(lv),G=new Array(FN*FN);
  for(let p=0;p<FN*FN;p++){const y=fy(p),x=fx(p);let c;
    do{c=rnd(0,n-1)}while((x>=2&&G[p-1].c===c&&G[p-2].c===c)||(y>=2&&G[p-FN].c===c&&G[p-2*FN].c===c));
    G[p]=fTile(c)}
  return G;
}
function fRuns(G){
  const runs=[];
  for(const dir of ['h','v'])for(let a=0;a<FN;a++){let start=0;
    for(let b=1;b<=FN;b++){
      const p=dir==='h'?a*FN+b:b*FN+a,q=dir==='h'?a*FN+start:start*FN+a;
      const same=b<FN&&G[p]&&G[q]&&G[p].c>=0&&G[p].c===G[q].c;
      if(!same){if(b-start>=3){const cells=[];for(let k=start;k<b;k++)cells.push(dir==='h'?a*FN+k:k*FN+a);runs.push({dir,cells,c:G[q].c})}start=b}
    }}
  return runs;
}
function fHasMove(G){
  for(let p=0;p<FN*FN;p++){if(G[p].s==='r')return[p,fx(p)<FN-1?p+1:p+FN];
    for(const q of [fx(p)<FN-1?p+1:-1,p+FN<FN*FN?p+FN:-1]){if(q<0)continue;
      if(G[p].s&&G[q].s)return[p,q];
      [G[p],G[q]]=[G[q],G[p]];const ok=fRuns(G).length>0;[G[p],G[q]]=[G[q],G[p]];if(ok)return[p,q]}}
  return null;
}
function fBlast(p,t,G){const y=fy(p),x=fx(p),out=[];
  if(t.s==='h')for(let k=0;k<FN;k++)out.push(y*FN+k);
  else if(t.s==='v')for(let k=0;k<FN;k++)out.push(k*FN+x);
  else if(t.s==='b')for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<FN&&xx>=0&&xx<FN)out.push(yy*FN+xx)}
  else if(t.s==='r'){const c=rnd(0,fColors(F.level)-1);G.forEach((u,i)=>{if(u&&u.c===c)out.push(i)})}
  return out}

/* ---------- effects layer: particles, beams, rings, score pop-ups ---------- */
const FX={parts:[],beams:[],rings:[],texts:[],rays:[],running:false};
function fxCanvas(){const cv=$('#fFx');if(!cv)return null;const b=$('#fBoard').getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  if(cv.width!==Math.round(b.width*dpr)){cv.width=Math.round(b.width*dpr);cv.height=Math.round(b.height*dpr)}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w:b.width,h:b.height}}
// centre of a cell in board pixels
function fCell(p){const b=$('#fBoard').getBoundingClientRect(),inset=b.width*0.02,cs=(b.width-2*inset)/FN;return{x:inset+(fx(p)+.5)*cs,y:inset+(fy(p)+.5)*cs,cs}}
function fxBurst(p,c,n=20){const {x,y,cs}=fCell(p);FX.rings.push({p,life:1,color:'#fff',small:true});
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(1.6+Math.random()*3)*cs;
    FX.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-cs*2.2,life:1,size:cs*(0.09+Math.random()*0.11),color:Math.random()<.25?'#fff':FRC[c]||'#ffd23f',star:Math.random()<.3})}
  fxRun()}
function fxText(p,text,big){const {x,y,cs}=fCell(p);FX.texts.push({x,y,text,life:1,size:big?cs*0.8:cs*0.5,big});fxRun()}
function fxBeam(p,dir){FX.beams.push({p,dir,life:1});fxRun()}
function fxRing(p,color){FX.rings.push({p,life:1,color});fxRun()}
function fxRun(){if(FX.running)return;FX.running=true;let last=performance.now();
  const step=now=>{const dt=Math.min(0.05,(now-last)/1000);last=now;const C=fxCanvas();
    if(!C){FX.running=false;FX.parts=[];FX.beams=[];FX.rings=[];FX.texts=[];FX.rays=[];return}
    const {ctx,w,h}=C;ctx.clearRect(0,0,w,h);
    FX.beams.forEach(b=>{b.life-=dt/(FT.beam/1000);const {x,y,cs}=fCell(b.p),a=Math.max(0,b.life);
      const thick=cs*(0.25+0.9*a);ctx.save();ctx.globalAlpha=a;
      const g=b.dir==='h'?ctx.createLinearGradient(0,y-thick,0,y+thick):ctx.createLinearGradient(x-thick,0,x+thick,0);
      g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;
      if(b.dir==='h')ctx.fillRect(0,y-thick,w,thick*2);else ctx.fillRect(x-thick,0,thick*2,h);
      ctx.globalAlpha=a*0.6;ctx.fillStyle='#7c5cff';if(b.dir==='h')ctx.fillRect(0,y-thick*0.18,w,thick*0.36);else ctx.fillRect(x-thick*0.18,0,thick*0.36,h);ctx.restore()});
    FX.rays.forEach(r=>{r.life-=dt/0.6;const A=fCell(r.a),B=fCell(r.b),a=Math.max(0,r.life);ctx.save();ctx.globalAlpha=a;ctx.lineCap='round';
      ctx.strokeStyle=`hsl(${(r.b*47)%360},95%,65%)`;ctx.lineWidth=A.cs*0.14*a+1;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=A.cs*0.05*a+0.5;ctx.stroke();ctx.restore()});
    FX.rings.forEach(r=>{r.life-=dt/(r.small?0.35:0.55);const {x,y,cs}=fCell(r.p),t=1-Math.max(0,r.life);
      if(r.small){ctx.save();ctx.globalAlpha=Math.max(0,r.life);ctx.strokeStyle='#fff';ctx.lineWidth=cs*0.12*Math.max(0,r.life)+1;ctx.beginPath();ctx.arc(x,y,cs*(0.25+0.55*t),0,7);ctx.stroke();ctx.restore();return}
      ctx.save();ctx.globalAlpha=Math.max(0,r.life);ctx.strokeStyle=r.color;ctx.lineWidth=cs*0.25*(1-t)+2;ctx.beginPath();ctx.arc(x,y,cs*(0.4+2.4*t),0,7);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,'+(0.5*Math.max(0,r.life-0.5))+')';ctx.beginPath();ctx.arc(x,y,cs*1.6*t,0,7);ctx.fill();ctx.restore()});
    FX.parts.forEach(q=>{q.vy+=dt*1500;q.vx*=Math.pow(0.35,dt);q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt/0.85;
      ctx.save();ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.color;ctx.translate(q.x,q.y);
      if(q.star){ctx.rotate(q.life*6);ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?q.size*0.45:q.size*1.1,a=i*Math.PI/5;ctx.lineTo(Math.sin(a)*rr,-Math.cos(a)*rr)}ctx.fill()}
      else{ctx.beginPath();ctx.arc(0,0,q.size*Math.max(.3,q.life),0,7);ctx.fill()}ctx.restore()});
    FX.texts.forEach(t=>{t.life-=dt/(t.big?1.3:0.9);const a=Math.max(0,Math.min(1,t.life*2.2)),rise=(1-t.life)*(t.big?20:46);

      if(!all.has(q)){all.add(q);queue.push(q);delay.set(q,d)}}}

      const hang=new Set(),q=[];for(let cc2=0;cc2<BN;cc2++)if(B.grid.has(key(0,cc2))){hang.add(key(0,cc2));q.push([0,cc2])}
      for(let i=0;i<q.length;i++)for(const n of nbrs(...q[i])){const k=key(...n);if(B.grid.has(k)&&!hang.has(k)){hang.add(k);q.push(n)}}
      let dropped=0;for(const [k,col] of [...B.grid]){if(!hang.has(k)){const [a,b]=k.split(',').map(Number),p=pos(a,b);B.drops.push({x:p.x,y:p.y,vx:(Math.random()-.5)*S.W*.4,vy:-S.H*.3*Math.random(),c:col});B.grid.delete(k);dropped++}}
      if(dropped){B.score+=dropped*20;setTimeout(()=>sfx.up(),150)}
      B.miss=0}
    else{B.miss++;tone([[330,0,.1]],'triangle',0.06);
      if(B.miss>=perRow){B.miss=0;const g=new Map();for(const [k,v] of B.grid){const [a,b]=k.split(',').map(Number);g.set(key(a+1,b),v)}B.grid=g;B.shift^=1;
        for(let cc2=0;cc2<cols(0);cc2++)B.grid.set(key(0,cc2),rnd(0,nColors-1))}}
    if(!colorsLeft().includes(B.cur))B.cur=pickColor();if(!colorsLeft().includes(B.next))B.next=pickColor();
    hud();
    if(!B.grid.size){B.over=true;const stars=B.score>rows*BN*12?3:2;K.lv.bubble=Math.max(K.lv.bubble,lv+1);save();
      setTimeout(()=>{addStars(stars,S.cv,'bubble');popup('🎉',`Level ${lv} cleared!`,`You popped every bubble. Score ${B.score}.`,'Next level',()=>playBubble(lv+1))},700);return}
    for(const k of B.grid.keys()){const [a,b]=k.split(',').map(Number);if(pos(a,b).y>dead){B.over=true;sfx.no();
      setTimeout(()=>popup('💥','The bubbles reached the bottom!',`Score ${B.score}. Pop groups early to keep them up high.`,'Try again',()=>playBubble(lv)),500);return}}
  }
  S.loop(dt=>{
    const ctx=S.ctx,W=S.W,H=S.H;
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#e9f4ff');bg.addColorStop(1,'#c9e6ff');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(offX(),0,2*BN*R,H);
    // danger line
    ctx.strokeStyle='rgba(255,111,97,.6)';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(offX(),dead+R);ctx.lineTo(W-offX(),dead+R);ctx.stroke();ctx.setLineDash([]);
    for(const [k,c] of B.grid){const [r,cc]=k.split(',').map(Number),p=pos(r,cc);drawBall(p.x,p.y,c,ballR())}
    // flying bubble
    if(B.fly){const f=B.fly;for(let s=0;s<4&&B.fly;s++){f.x+=f.vx*dt/4;f.y+=f.vy*dt/4;
        if(f.x<offX()+R){f.x=offX()+R;f.vx=Math.abs(f.vx)}if(f.x>W-offX()-R){f.x=W-offX()-R;f.vx=-Math.abs(f.vx)}
        let hit=f.y<=R;if(!hit)for(const [k] of B.grid){const [r,cc]=k.split(',').map(Number),p=pos(r,cc);if((p.x-f.x)**2+(p.y-f.y)**2<(R*1.75)**2){hit=true;break}}
        if(hit){const c=f.c,x=f.x,y=f.y;B.fly=null;land(x,y,c)}}
      if(B.fly)drawBall(B.fly.x,B.fly.y,B.fly.c,ballR())}
    // pops and drops
    for(const p of B.pops){p.t+=dt;if(p.t<0){drawBall(p.x,p.y,p.c,ballR());continue}if(!p.sp){p.sp=1;sparks(B.sparks,p.x,p.y,BCOL[p.c],10,R*9)}
      const k=Math.min(1,p.t/0.25);drawBall(p.x,p.y,p.c,ballR()*(1+k*0.6),1-k)}
    B.pops=B.pops.filter(p=>p.t<0.25);
    for(const d of B.drops){d.vy+=H*2.5*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;drawBall(d.x,d.y,d.c,ballR())}B.drops=B.drops.filter(d=>d.y<H+R*2);
    drawSparks(ctx,B.sparks,dt,H*1.5);
    // aim line
    if(B.aim!==null&&!B.fly){const pts=tracePath(B.aim);ctx.strokeStyle='rgba(29,43,79,.45)';ctx.lineWidth=3;ctx.setLineDash([3,9]);ctx.lineCap='round';ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([])}
    // shooter
    const a=B.aim??Math.PI/2;ctx.save();ctx.translate(shooter.x,shooter.y);ctx.rotate(-a+Math.PI/2);ctx.fillStyle='#1d2b4f';ctx.beginPath();ctx.roundRect(-R*0.45,-R*2.4,R*0.9,R*2,R*0.3);ctx.fill();ctx.restore();
    ctx.fillStyle='#2f8cff';ctx.beginPath();ctx.arc(shooter.x,shooter.y,R*1.35,0,7);ctx.fill();
    if(!B.fly)drawBall(shooter.x,shooter.y,B.cur,ballR());
    drawBall(shooter.x-R*4,shooter.y,B.next,ballR()*0.75);
    ctx.fillStyle='#5d6b8a';ctx.font=`700 ${Math.max(11,R*0.55)}px Nunito, system-ui`;ctx.textAlign='center';ctx.fillText('Next (tap)',shooter.x-R*4,shooter.y+R*1.6);
  });
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+amt));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}

/* =========================================================
   DINO DASH (endless runner)
   ========================================================= */
function playRunner(){
  if(location.hash!=='#runner')return; // a late timer from a game you already left
  const S=canvasGame('Dino Dash','Tap to jump. Tap again in the air to double jump!',`<span>Distance <b id="rDist">0</b> m</span><span id="rHearts"></span><span>⭐ <b id="rStars">0</b></span>`);
  const G={state:'ready',y:0,vy:0,jumps:0,speed:0,dist:0,t:0,obs:[],stars:[],clouds:[],sparks:[],hearts:3,hurt:0,got:0,awarded:0,spawn:0,starSpawn:2};
  const ground=()=>S.H*0.78,size=()=>Math.min(S.H*0.14,S.W*0.12),dinoX=()=>S.W*0.18;
  for(let i=0;i<5;i++)G.clouds.push({x:Math.random()*S.W,y:S.H*(0.08+Math.random()*0.3),s:0.6+Math.random()*0.8});
  const hud=()=>{$('#rDist').textContent=Math.floor(G.dist);$('#rStars').textContent=G.got;$('#rHearts').textContent='❤️'.repeat(G.hearts)+'🤍'.repeat(3-G.hearts)};hud();
  const jump=()=>{if(G.state==='ready'){G.state='run';G.speed=S.W*0.42}
    if(G.state!=='run')return;if(G.jumps<2){G.vy=-S.H*(G.jumps?1.05:1.25);G.jumps++;tone([[G.jumps>1?660:520,0,.1],[G.jumps>1?880:700,.05,.1]],'square',0.04)}};
  S.cv.onpointerdown=e=>{e.preventDefault();jump()};
  function end(){G.state='over';sfx.no();K.runBest=Math.max(K.runBest||0,Math.floor(G.dist));save();
    setTimeout(()=>popup('🦖','Ouch! Run over.',`You ran ${Math.floor(G.dist)} m and grabbed ${G.got} stars. Best: ${K.runBest} m.`,'Run again',playRunner),600)}
  S.loop(dt=>{
    const ctx=S.ctx,W=S.W,H=S.H,gy=ground(),sz=size();
    if(G.state==='run'){G.t+=dt;G.speed=Math.min(W*1.15,W*0.42+G.t*W*0.012);G.dist+=G.speed*dt/(W*0.08);
      G.vy+=H*3.4*dt;G.y+=G.vy*dt;if(G.y>0){G.y=0;G.vy=0;G.jumps=0}
      G.spawn-=dt;if(G.spawn<=0){const kind=G.t>25&&Math.random()<.25?'double':Math.random()<.3?'shroom':'cactus';
        G.obs.push({x:W+sz,kind,w:kind==='double'?sz*1.4:sz*0.7});G.spawn=(0.9+Math.random()*1.3)*(W*0.6/G.speed)+0.35}
      G.starSpawn-=dt;if(G.starSpawn<=0){const h=sz*(1+Math.random()*2.2);for(let i=0;i<3;i++)G.stars.push({x:W+sz+i*sz*0.9,y:gy-h-Math.sin(i/2*Math.PI)*sz*0.5});G.starSpawn=2+Math.random()*2.5}
      for(const o of G.obs)o.x-=G.speed*dt;for(const s of G.stars)s.x-=G.speed*dt;
      G.obs=G.obs.filter(o=>o.x>-sz*2);G.stars=G.stars.filter(s=>s.x>-sz&&!s.got);
      G.hurt=Math.max(0,G.hurt-dt);
      const dx=dinoX(),dy=gy-sz*0.5+G.y;
      for(const o of G.obs){if(o.hit||G.hurt)continue;if(Math.abs(o.x-dx)<(o.w*0.5+sz*0.28)&&dy+sz*0.35>gy-sz*(o.kind==='shroom'?0.45:0.75)){o.hit=true;G.hearts--;G.hurt=1.5;sfx.no();sparks(G.sparks,dx,dy,'#ff6f61',14,H*0.6);hud();if(!G.hearts){end();break}}}
      for(const s of G.stars){if(Math.hypot(s.x-dx,s.y-dy)<sz*0.6){s.got=true;G.got++;sfx.tap();sparks(G.sparks,s.x,s.y,'#ffd23f',10,H*0.5);
        if(G.got%3===0&&G.awarded<10){G.awarded++;addStars(1,S.cv,'runner')}hud()}}
      if(Math.floor(G.dist)%10===0)hud();
    }
    // sky, sun, clouds, hills
    const sky=ctx.createLinearGradient(0,0,0,gy);sky.addColorStop(0,'#8fd3ff');sky.addColorStop(1,'#e6f7ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(W*0.85,H*0.16,sz*0.6,0,7);ctx.fill();
    for(const c of G.clouds){c.x-=(G.state==='run'?G.speed*0.15:W*0.02)*dt*c.s;if(c.x<-sz*3)c.x=W+sz*2;ctx.fillStyle='rgba(255,255,255,.95)';
      const r=sz*0.35*c.s;ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);ctx.arc(c.x+r,c.y-r*0.4,r*1.1,0,7);ctx.arc(c.x+r*2.1,c.y,r*0.9,0,7);ctx.fill()}
    const off=(G.t*G.speed*0.3)%(W);ctx.fillStyle='#9bd87f';
    for(let k=-1;k<3;k++){const hx=k*W*0.6-off*0.5;ctx.beginPath();ctx.ellipse(hx,gy,W*0.4,H*0.18,0,Math.PI,0);ctx.fill()}
    ctx.fillStyle='#e8c07d';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#7ccf5f';ctx.fillRect(0,gy,W,H*0.025);
    ctx.fillStyle='rgba(120,80,30,.25)';const doff=(G.dist*W*0.08)%(sz);for(let x=-doff;x<W;x+=sz)ctx.fillRect(x,gy+H*0.06,sz*0.35,4);
    for(const o of G.obs){if(o.kind==='double'){emojiAt(ctx,'🌵',o.x-sz*0.35,gy-sz*0.42,sz*0.8);emojiAt(ctx,'🌵',o.x+sz*0.35,gy-sz*0.42,sz*0.8)}
      else emojiAt(ctx,o.kind==='shroom'?'🍄':'🌵',o.x,gy-sz*(o.kind==='shroom'?0.3:0.42),sz*(o.kind==='shroom'?0.65:0.8))}
    for(const s of G.stars){const b=Math.sin(performance.now()/200+s.x)*sz*0.05;emojiAt(ctx,'⭐',s.x,s.y+b,sz*0.5)}
    // dino
    const bob=G.state==='run'&&G.y===0?Math.abs(Math.sin(G.t*14))*sz*0.06:0;
    if(!(G.hurt&&Math.floor(G.hurt*10)%2))emojiAt(ctx,'🦖',dinoX(),gy-sz*0.5+G.y-bob,sz,true);
    drawSparks(ctx,G.sparks,dt,H*1.5);
    if(G.state==='ready'){ctx.fillStyle='rgba(29,43,79,.75)';ctx.font=`700 ${Math.max(22,sz*0.4)}px Fredoka, system-ui`;ctx.textAlign='center';ctx.fillText('Tap to start!',W/2,H*0.42)}
  });
}

/* =========================================================
   TOWER BUILDER
   ========================================================= */
function playTower(){
  if(location.hash!=='#tower')return; // a late timer from a game you already left
  const S=canvasGame('Tower Builder','Tap to drop the block. Line it up perfectly!',`<span>Floors <b id="tFloors">0</b></span><span>Best <b>${K.towerBest||0}</b></span>`);
  const T={blocks:[],cur:null,dir:-1,falls:[],sparks:[],cam:0,camT:0,over:false,perfect:0,awarded:0,flash:0,texts:[]};
  const bh=()=>Math.max(18,S.H*0.055);
  const baseW=()=>Math.min(S.W*0.5,360);
  T.blocks.push({x:S.W/2-baseW()/2,w:baseW(),hue:200});
  const topY=i=>S.H-bh()*1.6-(i+1)*bh();
  const newBlock=()=>{const last=T.blocks[T.blocks.length-1];T.dir=-T.dir;T.cur={x:T.dir>0?0:S.W-last.w,w:last.w,hue:(last.hue+14)%360,speed:S.W*(0.3+Math.min(0.8,T.blocks.length*0.025))}};
  newBlock();if(location.search.includes('selftest'))window.__tower=T;
  const hud=()=>{$('#tFloors').textContent=T.blocks.length-1};
  S.cv.onpointerdown=e=>{e.preventDefault();if(T.over||!T.cur)return;
    const c=T.cur,last=T.blocks[T.blocks.length-1],i=T.blocks.length;
    let left=Math.max(c.x,last.x),right=Math.min(c.x+c.w,last.x+last.w);
    if(right-left<=2){T.over=true;T.cur=null;T.falls.push({x:c.x,y:topY(i-1),w:c.w,hue:c.hue,vy:0,rot:0,vr:(Math.random()-.5)*3});sfx.no();
      K.towerBest=Math.max(K.towerBest||0,T.blocks.length-1);save();
      setTimeout(()=>popup('🏗️','Crash!',`Your tower was ${T.blocks.length-1} floors tall. Best: ${K.towerBest}.`,'Build again',playTower),900);return}
    if(Math.abs(c.x-last.x)<Math.max(4,last.w*0.025)){left=last.x;right=last.x+last.w;T.perfect++;T.flash=1;
      T.texts.push({text:T.perfect>=3?'Perfect! Bigger!':'Perfect!',y:topY(i-1),life:1});
      if(T.perfect>=3){const grow=Math.min(baseW()-(right-left),baseW()*0.08);left-=grow/2;right+=grow/2;T.perfect=0}
      tone([[660,0,.1],[880,.08,.12],[1100,.16,.2]],'sine',0.08);for(let k=0;k<20;k++)sparks(T.sparks,left+Math.random()*(right-left),topY(i-1)+bh()/2,`hsl(${c.hue},90%,70%)`,1,S.H*0.5)}
    else{T.perfect=0;tone([[400+i*6,0,.12]],'triangle',0.08);
      if(c.x<left)T.falls.push({x:c.x,y:topY(i-1),w:left-c.x,hue:c.hue,vy:0,rot:0,vr:-1.5});
      if(c.x+c.w>right)T.falls.push({x:right,y:topY(i-1),w:c.x+c.w-right,hue:c.hue,vy:0,rot:0,vr:1.5})}
    T.blocks.push({x:left,w:right-left,hue:c.hue});hud();
    const floors=T.blocks.length-1;if(floors%10===0&&T.awarded<10){T.awarded++;addStars(1,S.cv,'tower')}
    newBlock()};
  S.loop(dt=>{
    const ctx=S.ctx,W=S.W,H=S.H,h=bh(),n=T.blocks.length;
    T.camT=Math.max(0,(H-topY(n))-H*0.55);T.cam+=(T.camT-T.cam)*Math.min(1,dt*5);
    const hgt=Math.min(1,n/60);const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,`hsl(${210+hgt*40},${70-hgt*30}%,${80-hgt*62}%)`);sky.addColorStop(1,`hsl(${200+hgt*30},70%,${92-hgt*55}%)`);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    if(hgt>0.4){ctx.fillStyle=`rgba(255,255,255,${(hgt-0.4)*1.5})`;for(let k=0;k<40;k++){const sx=(k*137)%W,sy=((k*89)%H+T.cam*0.2)%H;ctx.fillRect(sx,sy,2,2)}}
    ctx.save();ctx.translate(0,T.cam);
    ctx.fillStyle='#7ccf5f';ctx.fillRect(0,H-h*1.6,W,h*3);
    const drawBlock=(x,y,w,hue,glow)=>{const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,`hsl(${hue},85%,68%)`);g.addColorStop(1,`hsl(${hue},75%,52%)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,h-2,6);ctx.fill();if(glow){ctx.strokeStyle=`rgba(255,255,255,${glow})`;ctx.lineWidth=4;ctx.stroke()}
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x+4,y+3,Math.max(0,w-8),3)};
    T.blocks.forEach((b,i)=>{if(topY(i-1)+T.cam>-h&&topY(i-1)+T.cam<H+h)drawBlock(b.x,topY(i-1),b.w,b.hue,i===n-1?T.flash:0)});
    T.flash=Math.max(0,T.flash-dt*2);
    if(T.cur){const c=T.cur;c.x+=c.speed*T.dir*dt;if(c.x>W-c.w&&T.dir>0){c.x=W-c.w;T.dir=-1}if(c.x<0&&T.dir<0){c.x=0;T.dir=1}drawBlock(c.x,topY(n-1),c.w,c.hue,0)}
    for(const f of T.falls){f.vy+=H*2.2*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;ctx.save();ctx.translate(f.x+f.w/2,f.y+h/2);ctx.rotate(f.rot);drawBlock(-f.w/2,-h/2,f.w,f.hue,0);ctx.restore()}
    T.falls=T.falls.filter(f=>f.y<H*3+T.cam);
    drawSparks(ctx,T.sparks,dt,H*1.2);
    for(const t of T.texts){t.life-=dt*0.9;t.y-=dt*40;ctx.globalAlpha=Math.max(0,t.life);ctx.font=`700 ${Math.max(22,h*1.1)}px Fredoka, system-ui`;ctx.textAlign='center';
      ctx.lineWidth=5;ctx.strokeStyle='#1d2b4f';ctx.strokeText(t.text,W/2,t.y-h*0.6);ctx.fillStyle='#ffd23f';ctx.fillText(t.text,W/2,t.y-h*0.6);ctx.globalAlpha=1}
    T.texts=T.texts.filter(t=>t.life>0);
    ctx.restore();
    if(n===1&&T.cur){ctx.fillStyle='rgba(29,43,79,.7)';ctx.font=`700 ${Math.min(h*0.6,W/20)}px Fredoka, system-ui`;ctx.textAlign='center';ctx.fillText('Tap when the block is over the tower!',W/2,H*0.25)}
  });
}

function playButterfly(){
