const ABC={A:['apple','🍎'],B:['butterfly','🦋'],C:['cat','🐱'],D:['dog','🐶'],E:['elephant','🐘'],F:['flower','🌸'],G:['grapes','🍇'],H:['heart','💖'],I:['ice cream','🍦'],J:['juice','🧃'],K:['kite','🪁'],L:['lion','🦁'],M:['moon','🌙'],N:['nest','🪺'],O:['octopus','🐙'],P:['princess','👸'],Q:['queen','👑'],R:['rainbow','🌈'],S:['star','⭐'],T:['tiger','🐯'],U:['unicorn','🦄'],V:['violin','🎻'],W:['whale','🐳'],X:['fox','🦊'],Y:['yo-yo','🪀'],Z:['zebra','🦓']};

function traceList(){const nm=(K.name||'').toUpperCase().replace(/[^A-Z]/g,'');return [...(nm?nm.split(''):[]),...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')]}
function playTrace(){
  if(location.hash!=='#trace')return; // a late timer from a game you already left
  const list=traceList();K.traceIdx=(K.traceIdx||0)%list.length;const idx=K.traceIdx,L=list[idx];
  const nm=(K.name||'').toUpperCase().replace(/[^A-Z]/g,''),inName=idx<nm.length;
  setHeader('Trace Letters',inName?`Spell your name: ${nm}`:'A to Z');
  view.innerHTML=`<div class="trace"><div class="tbox" id="tbox"><canvas id="tcv"></canvas><div class="tword" id="tword"></div></div>
    <div class="row"><button class="pbtn" id="tagain">🔁 Again</button><button class="pbtn" id="tnext" style="background:var(--sun)">Next ▶</button></div></div>`;
  const box=$('#tbox'),cv=$('#tcv'),ctx=cv.getContext('2d');let W,H,fs,mask,cov,mcount=0,got=0,done=false,last=null;const SC=0.25;
  const font=s=>`700 ${s}px Fredoka, "Arial Rounded MT Bold", Arial, sans-serif`;
  function setup(){const r=box.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    fs=Math.min(W*0.8,H*0.85);
    const m=document.createElement('canvas');m.width=Math.ceil(W*SC);m.height=Math.ceil(H*SC);const mc=m.getContext('2d');mc.font=font(fs*SC);mc.textAlign='center';mc.textBaseline='middle';mc.fillText(L,m.width/2,m.height*0.52);
    const d=mc.getImageData(0,0,m.width,m.height).data;mask=new Uint8Array(m.width*m.height);mcount=0;for(let i=0;i<mask.length;i++)if(d[i*4+3]>128){mask[i]=1;mcount++}
    cov=new Uint8Array(mask.length);got=0;mask.w=m.width;mask.h=m.height;draw()}
  function draw(){ctx.clearRect(0,0,W,H);ctx.font=font(fs);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ffe0ef';ctx.fillText(L,W/2,H*0.52);ctx.setLineDash([10,10]);ctx.lineWidth=4;ctx.strokeStyle='#e58ab8';ctx.strokeText(L,W/2,H*0.52);ctx.setLineDash([])}
  setup();
  const brush=()=>fs*0.12;
  function mark(x,y){const r=brush()/2*SC,cx=x*SC,cy=y*SC;for(let yy=Math.floor(cy-r);yy<=cy+r;yy++)for(let xx=Math.floor(cx-r);xx<=cx+r;xx++){if(xx<0||yy<0||xx>=mask.w||yy>=mask.h)continue;if((xx-cx)**2+(yy-cy)**2>r*r)continue;const i=yy*mask.w+xx;if(mask[i]&&!cov[i]){cov[i]=1;got++}}}
  function stroke(a,b){ctx.strokeStyle='#ff5fa2';ctx.lineWidth=brush();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();
    const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/4));for(let k=0;k<=n;k++)mark(a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n)}
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{if(done)return;cv.setPointerCapture(e.pointerId);last=pt(e);stroke(last,last)};
  cv.onpointermove=e=>{if(!last||done)return;const p=pt(e);stroke(last,p);last=p};
  cv.onpointerup=()=>{last=null;if(!done&&got/mcount>0.68)win()};
  function win(){done=true;const g=ctx.createLinearGradient(0,H*0.1,0,H*0.9);['#ff7eb6','#ffd75e','#6ee0b5','#7cc4ff','#c48bff'].forEach((c,i)=>g.addColorStop(i/4,c));
    ctx.clearRect(0,0,W,H);ctx.font=font(fs);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=g;ctx.fillText(L,W/2,H*0.52);ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(L,W/2,H*0.52);
    sparkleOver(box);sfx.up();addStars(1,box,'trace');
    if(inName){const so=nm.slice(0,idx+1);$('#tword').innerHTML=`<b>${so}</b>`;speakNow(idx===nm.length-1?`${L}! You wrote ${K.name}!`:`${L}!`)}
    else{const [w,em]=ABC[L];$('#tword').innerHTML=`<span>${em}</span><b>${L} is for ${w}</b>`;speakNow(`${L}. ${L} is for ${w}!`)}
    setTimeout(()=>{if(location.hash==='#trace'&&done){K.traceIdx=idx+1;save();playTrace()}},3200)}
  $('#tagain').onclick=()=>{done=false;$('#tword').innerHTML='';setup()};
  $('#tnext').onclick=()=>{K.traceIdx=idx+1;save();playTrace()};
  setTimeout(()=>speakNow(inName?`Trace the letter ${L}, for ${K.name}!`:`Trace the letter ${L}!`),250);
  playTrace.fit=setup;
}

    p.style.cssText=`width:${pw}px;height:${ph}px;background-image:url("${img}");background-size:${S}px ${S}px;background-position:${-c*pw}px ${-r*ph}px`;

        if(Math.abs(x-c*pw)<pw*0.4&&Math.abs(y-r*ph)<ph*0.4){p.classList.remove('drag');p.classList.add('done');p.style.left=(c*pw)+'px';p.style.top=(r*ph)+'px';board.appendChild(p);
          tone([[523+placed*40,0,.1],[784+placed*40,.06,.16]],'sine',0.08);placed++;

        else{p.classList.remove('drag');p.style.left='';p.style.top='';sfx.no()}};

/* =========================================================
   ROBOT PATH: program the robot with arrow cards
   ========================================================= */
const DIRS={U:[0,-1,'↑'],D:[0,1,'↓'],L:[-1,0,'←'],R:[1,0,'→']};
function robotLevel(lv){
  const n=lv<=2?5:lv<=5?6:7,minL=Math.min(3+lv,n*2),maxL=minL+3;
  for(let t=0;t<400;t++){
    const walls=new Set();for(let i=0;i<n*n;i++)if(Math.random()<0.18+lv*0.015)walls.add(i);
    const start=rnd(0,n*n-1),goal=rnd(0,n*n-1);if(start===goal||walls.has(start)||walls.has(goal))continue;
    const dist=new Map([[start,0]]),q=[start];
    for(let k=0;k<q.length;k++){const p=q[k],x=p%n,y=Math.floor(p/n);for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy,np=ny*n+nx;
      if(nx<0||ny<0||nx>=n||ny>=n||walls.has(np)||dist.has(np))continue;dist.set(np,dist.get(p)+1);q.push(np)}}
    const L=dist.get(goal);if(L>=minL&&L<=maxL)return{n,walls,start,goal,L,slots:L+2};
  }
  return{n:5,walls:new Set([7,12,17]),start:10,goal:14,L:6,slots:8};
}
function playRobot(){
  if(location.hash!=='#robot')return; // a late timer from a game you already left
  const lv=K.lv.robot;setHeader('Robot Path',`Level ${lv}`);
  const Lv=robotLevel(lv),prog=[];let running=false;
  view.innerHTML=`<div class="robot"><p class="prompt">Program the robot to reach the flag!</p>
    <div class="rgrid" id="rgrid" style="grid-template-columns:repeat(${Lv.n},1fr)">${[...Array(Lv.n*Lv.n)].map((_,i)=>`<div class="rcell ${Lv.walls.has(i)?'wall':''}"><b>${Lv.walls.has(i)?'🧱':i===Lv.goal?'🏁':''}</b></div>`).join('')}<div class="rbot" id="rbot">🤖</div></div>
    <div class="rprog" id="rprog"></div>
    <div class="rkeys">${Object.entries(DIRS).map(([k,[,,a]])=>`<button class="rkey" data-d="${k}" aria-label="Move ${k}">${a}</button>`).join('')}<button class="rkey del" id="rdel" aria-label="Remove last">⌫</button></div>
    <div class="row"><button class="pbtn" id="rclear">Clear</button><button class="pbtn go" id="rrun">▶ Run</button></div>${progressDots('robot')}</div>`;
  const bot=$('#rbot');
  const place=p=>{const cell=$('#rgrid').children[p];bot.style.left=cell.offsetLeft+'px';bot.style.top=cell.offsetTop+'px';bot.style.width=cell.offsetWidth+'px';bot.style.height=cell.offsetHeight+'px'};
  place(Lv.start);
  const drawProg=(active)=>{$('#rprog').innerHTML=[...Array(Lv.slots)].map((_,i)=>`<span class="${i===active?'on':''} ${prog[i]?'full':''}">${prog[i]?DIRS[prog[i]][2]:''}</span>`).join('')};drawProg(-1);
  view.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(running||prog.length>=Lv.slots)return;prog.push(b.dataset.d);sfx.tap();drawProg(-1)});
  $('#rdel').onclick=()=>{if(running)return;prog.pop();drawProg(-1)};
  $('#rclear').onclick=()=>{if(running)return;prog.length=0;drawProg(-1);place(Lv.start)};
  $('#rrun').onclick=async()=>{if(running||!prog.length)return;running=true;let p=Lv.start;place(p);await fsleep(250);
    for(let i=0;i<prog.length;i++){drawProg(i);const [dx,dy]=DIRS[prog[i]],x=p%Lv.n+dx,y=Math.floor(p/Lv.n)+dy,np=y*Lv.n+x;
      if(x<0||y<0||x>=Lv.n||y>=Lv.n||Lv.walls.has(np)){bot.classList.remove('bump');void bot.offsetWidth;bot.classList.add('bump');sfx.no();say('Bonk! Try a different path.');await fsleep(700);running=false;place(Lv.start);drawProg(-1);return}
      p=np;place(p);tone([[400+i*30,0,.08]],'square',0.04);await fsleep(380);
      if(p===Lv.goal){sfx.up();bot.classList.add('win');const stars=prog.length<=Lv.L?2:1;say(stars===2?'Perfect program!':'You made it!');
        addStars(stars,bot,'robot');setTimeout(()=>{if(correct('robot'))levelUp('robot',playRobot);else playRobot()},1300);return}}
    sfx.no();say('Not quite at the flag. Add more moves!');await fsleep(600);running=false;place(Lv.start);drawProg(-1)};
}

/* =========================================================
   DAILY CHALLENGE: five mixed questions, once a day
   ========================================================= */
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function dayKey(offset){const d=new Date();d.setDate(d.getDate()-offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dailyQs(){
  const qs=[];
  const m=()=>{const x=mathQ(K.lv.math);return{prompt:'Solve it!',html:`<div class="big">${x.text} = ?</div>`,opts:nearOptions(x.ans,4,x.spread),ans:x.ans}};
  const c=()=>{const lv=K.lv.clock,mins=lv===1?[0]:lv===2?[0,30]:lv===3?[0,15,30,45]:[...Array(12)].map((_,i)=>i*5);const h=rnd(1,12),mm=pick(mins),ans=fmt(h,mm);
    const s=new Set([ans]);while(s.size<4)s.add(fmt(((h+rnd(1,10)-1)%12)+1,pick(mins.length>1?mins:[0,30])));return{prompt:'What time is it?',html:`<div class="clock">${clockSVG(h,mm)}</div>`,opts:shuffle([...s]),ans}};
  const p=()=>{const x=patternQ(K.lv.pattern);return{prompt:'What comes next?',html:`<div class="seq">${x.seq.map(s=>`<span>${s}</span>`).join('')}<span class="q">?</span></div>`,opts:x.opts,ans:x.ans,cls:'c3'}};
  const r=()=>{const fam=pick(FAM),[w,a]=shuffle(fam.slice()).slice(0,2),wrong=shuffle(FAM.filter(f=>f!==fam).flat().filter(x=>!fam.includes(x))).slice(0,3);
    return{prompt:'Which word rhymes with…',html:`<div class="big">${w}</div>`,opts:shuffle([a,...wrong]),ans:a}};
  [m,c,p,r,m].forEach(f=>qs.push(f()));return qs;
}
function playDaily(){
  if(location.hash!=='#daily')return; // a late timer from a game you already left
  setHeader('Daily Challenge');K.daily=K.daily||{days:[]};const D=K.daily,today=todayKey();
  const streak=()=>{let s=0;for(let i=D.days.includes(today)?0:1;;i++){if(D.days.includes(dayKey(i)))s++;else break}return s};

  const qs=dailyQs();let i=0;

function brickScene(stage,token,drawBar){
  const T=THREE;let R;

  const scene=new T.Scene();scene.background=new T.Color('#cfe8ff');scene.fog=new T.Fog('#cfe8ff',60,120);

  const sun=new T.DirectionalLight(0xffffff,0.78);sun.position.set(14,30,20);scene.add(sun);
  const back=new T.DirectionalLight(0xffffff,0.28);back.position.set(-18,12,-14);scene.add(back);
  const floor=new T.Mesh(new T.CircleGeometry(70,48),new T.MeshLambertMaterial({color:'#e9f4ff'}));floor.rotation.x=-Math.PI/2;floor.position.y=-0.42;scene.add(floor);
  const PLATE='#3c9a48';
  const plate=new T.Mesh(new T.BoxGeometry(BB_N,0.4,BB_N),new T.MeshPhongMaterial({color:PLATE,shininess:30}));plate.position.y=-0.2;scene.add(plate);
  const mats=BB_COLORS.map(c=>new T.MeshPhongMaterial({color:c,shininess:70,specular:0x333333}));
  const geos={},boxGeo=(w,d)=>geos[w+'x'+d]||(geos[w+'x'+d]=new T.BoxGeometry(w-0.05,BB_H-0.03,d-0.05));
  const edges={},edgeGeo=(w,d)=>edges[w+'x'+d]||(edges[w+'x'+d]=new T.EdgesGeometry(boxGeo(w,d)));const edgeMat=new T.LineBasicMaterial({color:'#000000',transparent:true,opacity:0.22});
  const studGeo=new T.CylinderGeometry(0.3,0.3,0.22,16);
  const studs=new T.InstancedMesh(studGeo,new T.MeshPhongMaterial({color:'#ffffff',shininess:70,specular:0x333333}),BB_STUDS);

  const ghostEdge=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1,1,1)),new T.LineBasicMaterial({color:'#1d2b4f'}));ghost.add(ghostEdge);
  const M=new T.Matrix4(),C=new T.Color(),plateC=new T.Color(PLATE);
  const build=()=>K.builds[K.buildCur|0];
  const bricks=()=>build().b;
  const undo=[];
  let dirty=true,saveT=0;
  const wx=(x,w)=>x+w/2-BB_N/2;
  function rebuild(){
    while(group.children.length)group.remove(group.children[0]);
    const occ=new Set(),list=bricks();
    list.forEach(([x,z,w,d,y])=>{for(let i=0;i<w;i++)for(let j=0;j<d;j++)occ.add((x+i)+','+y+','+(z+j))});
    let n=0;
    const stud=(cx,cz,yTop,col)=>{if(n>=BB_STUDS)return;M.makeTranslation(cx+0.5-BB_N/2,yTop+0.11,cz+0.5-BB_N/2);studs.setMatrixAt(n,M);studs.setColorAt(n,col);n++};
    for(let x=0;x<BB_N;x++)for(let z=0;z<BB_N;z++)if(!occ.has(x+',0,'+z))stud(x,z,0,plateC);
    list.forEach((b,k)=>{const [x,z,w,d,y,c]=b;const m=new T.Mesh(boxGeo(w,d),mats[c]||mats[0]);
      m.position.set(wx(x,w),y*BB_H+BB_H/2,wx(z,d));m.userData.k=k;m.add(new T.LineSegments(edgeGeo(w,d),edgeMat));group.add(m);C.set(BB_COLORS[c]||BB_COLORS[0]);
      for(let i=0;i<w;i++)for(let j=0;j<d;j++)if(!occ.has((x+i)+','+(y+1)+','+(z+j)))stud(x+i,z+j,(y+1)*BB_H,C)});
    studs.count=n;studs.instanceMatrix.needsUpdate=true;if(studs.instanceColor)studs.instanceColor.needsUpdate=true;

  function changed(){rebuild();build().t=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{if(token===loopToken)snapThumb();save()},700)}
  function snapThumb(){try{ghost.visible=false;R.render(scene,cam);const c=document.createElement('canvas');c.width=200;c.height=150;const g=c.getContext('2d');
    const s=Math.min(cvs.width/4,cvs.height/3);g.drawImage(cvs,(cvs.width-s*4)/2,(cvs.height-s*3)/2,s*4,s*3,0,0,200,150);build().img=c.toDataURL('image/jpeg',0.72)}catch(e){}}
  function remember(){undo.push(JSON.stringify(bricks()));if(undo.length>60)undo.shift()}
  // camera
  const V={th:0.75,ph:0.95,r:30,ty:1.5};
  function aim(){V.ph=Math.max(0.18,Math.min(1.48,V.ph));V.r=Math.max(7,Math.min(60,V.r));
    cam.position.set(V.r*Math.sin(V.ph)*Math.sin(V.th),V.ty+V.r*Math.cos(V.ph),V.r*Math.sin(V.ph)*Math.cos(V.th));cam.lookAt(0,V.ty,0);dirty=true}

    return y<BB_MAXY?[x,z,w,d,y,BB.color]:null;
  }
  function showGhost(cx,cy){
    const h=hitAt(cx,cy);
    if(!h){ghost.visible=false;dirty=true;return}
    if(BB.tool==='build'){const s=spot(h);if(!s){ghost.visible=false;dirty=true;return}const [x,z,w,d,y]=s;
      ghost.geometry=boxGeo(w,d);ghostEdge.scale.set(w-0.04,BB_H-0.02,d-0.04);ghostMat.color.set(BB_COLORS[BB.color]);ghostMat.opacity=0.55;
      ghost.position.set(wx(x,w),y*BB_H+BB_H/2,wx(z,d));ghost.visible=true}
    else if(h.object!==plate){const [x,z,w,d,y]=bricks()[h.object.userData.k];ghost.geometry=boxGeo(w+0.1,d+0.1);ghostEdge.scale.set(w+0.1,BB_H+0.1,d+0.1);
      ghostMat.color.set(BB.tool==='erase'?'#ff3b3b':BB_COLORS[BB.color]);ghostMat.opacity=0.45;ghost.position.set(wx(x,w),y*BB_H+BB_H/2,wx(z,d));ghost.visible=true}

  }
  playBrick.ghostOff=()=>{ghost.visible=false;dirty=true};
  function act(cx,cy){
    const h=hitAt(cx,cy);ghost.visible=false;dirty=true;if(!h)return;

      if(bricks().length>=BB_MAX){say('That is a lot of bricks! Start a new build.');return}

    }else if(h.object!==plate){const k=h.object.userData.k;remember();
      if(BB.tool==='erase'){bricks().splice(k,1);tone([[700,0,.05],[350,.04,.1]],'triangle',0.08)}

    gal.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{K.buildCur=+b.dataset.o;undo.length=0;save();rebuild();gal.hidden=true;sfx.tap()});

// When sign-in can't get through, find out which step is blocked so a grown-up knows what to fix
async function jfDiagnose(url){
  const host=esc(url.replace(/^https?:\/\//,'')),me=esc(location.origin&&location.origin!=='null'?location.origin:'this page');
  if(!/^https:/i.test(url))return `<b>Step 1 failed:</b> the address must start with https:// (this app is on a secure page, so tablets won't talk to plain http servers).`;
  const t=(p,o)=>Promise.race([fetch(url+p,o),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),9000))]);
  try{await t('/System/Info/Public',{mode:'no-cors',cache:'no-store'})}catch(e){return `<b>Step 1 failed:</b> this tablet can't reach <b>${host}</b> at all. Check the address and Wi-Fi, and try opening https://${host} in the browser on this tablet.`}
  let info=null;try{const r=await t('/System/Info/Public',{cache:'no-store'});info=await r.json()}catch(e){
    return `<b>Step 2 failed:</b> the server is there, but it is blocking apps that live on other websites (CORS). Ask the server owner to allow <b>${me}</b>: in Jellyfin, Dashboard › Networking › "CORS hosts"/"Known proxies" area, or in the reverse proxy (nginx, Caddy, Cloudflare) add an Access-Control-Allow-Origin header for that address.`}
  try{await t('/System/Info/Public',{cache:'no-store',headers:{'X-Emby-Authorization':jfHdr()}})}catch(e){
    return `<b>Step 3 failed:</b> the server ${info&&info.ServerName?`(“${esc(info.ServerName)}”) `:''}answers simple requests but blocks the sign-in check (CORS preflight). The reverse proxy in front of Jellyfin needs to answer OPTIONS requests and allow the Authorization and X-Emby-Authorization headers for <b>${me}</b>.`}
  return `The server ${info&&info.ServerName?`“${esc(info.ServerName)}” `:''}is reachable and allows this app, but the sign-in still failed. Try again in a minute.`;
}

const SL_FRUIT=[['🍉','#ff4d6d','#3fae3c'],['🍊','#ffa23a','#ff8a00'],['🍎','#fff1c9','#e8343a'],['🍋','#fff27a','#f5d21f'],['🍍','#ffe066','#d9a21b'],

function slNoise(len,vol,hi){if(!K.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const n=Math.floor(ac.sampleRate*len),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=hi||2500;f.Q.value=0.8;g.gain.value=vol;
  s.connect(f).connect(g).connect(ac.destination);s.start()}catch(e){}}
function playSlice(){
  if(location.hash!=='#slice')return; // a late timer from a game you already left
  K.sliceBest=K.sliceBest||{classic:0,zen:0};
  const S=canvasGame('Fruit Slice','Swipe to slice! Watch out for bombs 💣',`<span>Score <b id="slScore">0</b></span><span id="slLives"></span><span>Best <b id="slBest">0</b></span>`);
  const G={mode:null,state:'menu',items:[],halves:[],splats:[],sparks:[],texts:[],trail:[],score:0,lives:3,t:0,spawn:1,wave:0,time:60,shake:0,swipe:[],flash:0};
  const size=()=>Math.max(54,Math.min(S.W,S.H)*0.13),grav=()=>S.H*1.05;
  const hud=()=>{$('#slScore').textContent=G.score;$('#slBest').textContent=G.mode?K.sliceBest[G.mode]:Math.max(K.sliceBest.classic,K.sliceBest.zen);
    $('#slLives').innerHTML=G.mode==='zen'?`⏱️ <b>${Math.ceil(G.time)}</b>`:G.mode?'❌'.repeat(Math.max(0,3-G.lives))+'<span style="opacity:.25">❌</span>'.repeat(Math.max(0,G.lives)):'Pick a mode'};
  // the menu: slice a fruit to pick a mode
  function menu(){G.state='menu';G.mode=null;G.items=[];
    const s=size()*1.5;
    G.items.push({e:'🍉',f:SL_FRUIT[0],x:S.W*0.3,y:S.H*0.55,vx:0,vy:0,r:s/2,s,rot:0,vr:0.6,menu:'classic',label:'Classic'});
    G.items.push({e:'🍓',f:SL_FRUIT[5],x:S.W*0.7,y:S.H*0.55,vx:0,vy:0,r:s/2,s,rot:0,vr:-0.6,menu:'zen',label:'Zen (no bombs)'});hud()}
  function start(mode){G.mode=mode;G.state='play';G.items=[];G.score=0;G.lives=3;G.wave=0;G.spawn=0.8;G.time=60;hud();sfx.up()}
  function launch(bomb){const s=size()*(0.9+Math.random()*0.25),x=S.W*(0.15+Math.random()*0.7),peak=S.H*(0.12+Math.random()*0.3);
    const vy=-Math.sqrt(2*grav()*(S.H+s-peak)),tFlight=-vy/grav();const tx=S.W*(0.3+Math.random()*0.4);
    const f=pick(SL_FRUIT);G.items.push({e:bomb?'💣':f[0],f,bomb,x,y:S.H+s/2,vx:(tx-x)/tFlight*0.9,vy,r:s*0.42,s,rot:Math.random()*6,vr:(Math.random()-.5)*5})}
  function wave(){G.wave++;const lvl=Math.min(10,1+G.wave/4),n=Math.min(6,1+Math.floor(Math.random()*(1+lvl*0.5)));
    const bombs=G.mode==='classic'&&G.wave>2?(Math.random()<0.25+lvl*0.03?1:0)+(lvl>6&&Math.random()<0.25?1:0):0;
    for(let i=0;i<n;i++)setTimeout(()=>{if(S.alive()&&G.state==='play')launch(false)},i*rnd(80,260));
    for(let i=0;i<bombs;i++)setTimeout(()=>{if(S.alive()&&G.state==='play')launch(true)},rnd(0,400));
    G.spawn=Math.max(0.9,2.3-lvl*0.13)+Math.random()*0.5}
  function cut(o,ang){
    o.dead=true;const nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2),sp=S.W*0.12;
    if(o.bomb){boom(o);return}
    for(const side of [1,-1])G.halves.push({e:o.e,x:o.x,y:o.y,vx:o.vx*0.6+nx*sp*side,vy:Math.min(o.vy,0)*0.4+ny*sp*side-80,s:o.s,rot:o.rot,vr:o.vr+side*3,rel:ang-o.rot,side,life:2.5});
    for(let k=0;k<3;k++)G.splats.push({x:o.x+(Math.random()-.5)*o.s*0.8,y:o.y+(Math.random()-.5)*o.s*0.8,r:o.s*(0.25+Math.random()*0.35),c:o.f[1],a:0.55});
    sparks(G.sparks,o.x,o.y,o.f[1],16,S.H*0.5);
    if(o.menu){slNoise(0.18,0.5,3000);setTimeout(()=>{if(S.alive())start(o.menu)},450);return}
    G.score++;G.swipe.push(o);slNoise(0.16,0.45,2200+Math.random()*1500);tone([[300+Math.random()*200,0,.06]],'triangle',0.04)}
  function boom(o){G.shake=0.5;G.flash=1;slNoise(0.6,0.9,500);tone([[90,0,.4],[60,.05,.5]],'sawtooth',0.12);sparks(G.sparks,o.x,o.y,'#ffb347',40,S.H*0.9);sparks(G.sparks,o.x,o.y,'#555',20,S.H*0.6);
    G.texts.push({x:o.x,y:o.y,t:'BOOM!',c:'#ff4d4d',life:1.2,big:1.6});
    if(G.mode==='classic'){G.lives--;hud();if(G.lives<=0)over()}}

  function endSwipe(){const n=G.swipe.length;if(n>=3){const bonus=n;G.score+=bonus;const o=G.swipe[n-1];
      G.texts.push({x:o.x,y:o.y-o.s,t:`${n} fruit combo! +${bonus}`,c:'#ffd23f',life:1.4,big:1.1});tone([[660,0,.1],[880,.08,.1],[1100,.16,.2]],'sine',0.08);if(n>=4)say(`${n} fruit combo!`)}

  function over(){if(G.state!=='play')return;G.state='over';endSwipe();const best=K.sliceBest[G.mode],rec=G.score>best;if(rec)K.sliceBest[G.mode]=G.score;save();hud();
    say(rec?`New best! ${G.score} points!`:`Game over! ${G.score} points.`);
    setTimeout(()=>{if(!S.alive())return;G.items=G.items.filter(o=>!o.bomb);popup(rec?'🏆':'🍉',rec?'New best score!':'Game over!',`You sliced ${G.score} point${G.score===1?'':'s'}. Best: ${K.sliceBest[G.mode]}.`,'Play again',()=>{menu()})},1100)}
  // swiping
  let down=false,last=null;
  const pt=e=>{const r=S.cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}};
  S.cv.onpointerdown=e=>{e.preventDefault();try{S.cv.setPointerCapture(e.pointerId)}catch(_){}down=true;last=pt(e);G.trail=[last];G.swipe=[]};
  S.cv.onpointermove=e=>{if(!down)return;const p=pt(e),dx=p.x-last.x,dy=p.y-last.y,L=Math.hypot(dx,dy);if(L<2)return;
    G.trail.push(p);if(G.trail.length>14)G.trail.shift();
    if(L>4&&G.state!=='over')for(const o of G.items){if(o.dead)continue;
      const t=Math.max(0,Math.min(1,((o.x-last.x)*dx+(o.y-last.y)*dy)/(L*L))),cx=last.x+dx*t,cy=last.y+dy*t;
      if(Math.hypot(o.x-cx,o.y-cy)<o.r)cut(o,Math.atan2(dy,dx))}

    last=p};
  const up=()=>{if(!down)return;down=false;endSwipe()};S.cv.onpointerup=up;S.cv.onpointercancel=up;
  menu();if(/[?&]bot\b/.test(location.search))window.__slG=G;
  S.loop(dt=>{
    const c=S.ctx,W=S.W,H=S.H;G.t+=dt;
    if(G.state==='play'){G.spawn-=dt;if(G.spawn<=0&&G.items.filter(o=>!o.dead).length<8)wave();
      if(G.mode==='zen'){const before=Math.ceil(G.time);G.time-=dt;if(Math.ceil(G.time)!==before)hud();if(G.time<=0){G.time=0;over()}}}
    for(const o of G.items){if(o.menu){o.y=H*0.55+Math.sin(G.t*2+(o.menu==='zen'?1:0))*8;o.x=o.menu==='classic'?W*0.3:W*0.7;o.rot+=o.vr*dt;continue}
      o.vy+=grav()*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
      if(o.vy>0&&o.y>H+o.s){o.gone=true;if(!o.dead&&!o.bomb)miss(o)}}

    // background

    const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#6b3f1f');bg.addColorStop(1,'#4a2a12');c.fillStyle=bg;c.fillRect(-20,-20,W+40,H+40);

  const n=stickersEarned();
  if(K.mode==='little'){
    view.innerHTML=`<div class="tiles ltiles">${[...GAMES.filter(g=>g.little),...GAMES.filter(g=>g.both)].map(g=>`<button class="tile" data-g="${g.id}" data-say="${g.name}" style="background:${g.color}"><span class="em">${g.em}</span><span><b>${g.name}</b></span></button>`).join('')}
      <button class="tile" data-g="stickers" data-say="Sticker book" style="background:#7a3a6e"><span class="em">${n?stickerSet()[n-1]:'📒'}</span><span><b>Stickers</b><br><small>${n} of ${stickerSet().length}</small></span></button></div>
      <div class="home-foot"><span></span><button class="grownup" id="grown">Grown-ups: press and hold<i></i></button></div>`;
    view.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{sfx.tap();speakNow(b.dataset.say);go(b.dataset.g)});
    holdGrownups();return}
  const tile=g=>`<button class="tile" data-g="${g.id}" style="background:${g.color}"><span class="em">${g.em}</span>${isGated(g.id)?`<span class="lv">⭐ ${K.playSec>0?fmtSec(K.playSec)+' left':'Uses stars'}</span>`:g.max?`<span class="lv">Level ${K.lv[g.id]}</span>`:''}<span><b>${g.name}</b><br><small>${g.sub}</small></span></button>`;
  view.innerHTML=`<p class="hello">Play</p>
    <div class="tiles">${GAMES.filter(g=>g.play&&!g.little).map(tile).join('')}</div>
    <p class="hello">Learn</p>
    <div class="tiles">${GAMES.filter(g=>!g.play&&!g.little).map(tile).join('')}
      <button class="tile" data-g="stickers" style="background:#1d2b4f"><span class="em">${n?stickerSet()[n-1]:'📒'}</span><span><b>Sticker Book</b><br><small>${n} of ${stickerSet().length} stickers</small></span></button></div>
    <div class="home-foot"><p class="note">${gateOn()?`You have ⭐ ${K.wallet} to spend on Play games. Learn games earn more!`:`Every 10 stars earns a new sticker. ${10-K.stars%10} more to go!`}</p>
      <button class="grownup" id="grown">Grown-ups: press and hold<i></i></button></div>`;
  view.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{sfx.tap();go(b.dataset.g)});
  holdGrownups();
}
function holdGrownups(){
  const g=$('#grown');let t=null;
  const start=e=>{e.preventDefault();g.classList.add('holding');t=setTimeout(()=>{g.classList.remove('holding');go('grownups')},2000)};
  const stop=()=>{clearTimeout(t);g.classList.remove('holding')};
  g.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>g.addEventListener(ev,stop));
  g.oncontextmenu=e=>e.preventDefault();
}
function stickers(){
  setHeader('Sticker Book');const n=stickersEarned();
  view.innerHTML=`<p class="note">You have ${n} sticker${n===1?'':'s'}. Earn 10 stars for the next one!</p>
    <div class="sgrid">${stickerSet().map((s,i)=>i<n?`<div class="sticker">${s}</div>`:`<div class="sticker locked">?</div>`).join('')}</div>`;
}
let resetArm=false;
function grownups(){
  setHeader('Grown-ups');
  view.innerHTML=`<p class="note">Star Quest has no ads, no purchases and no accounts. Progress is saved only on this tablet.</p>
    <div class="prow"><span>Who plays on this tablet?</span><span class="ctl"><button class="pbtn" id="modeB" style="${K.mode!=='little'?'background:var(--ink);color:#fff':''}">Big kid</button><button class="pbtn" id="modeL" style="${K.mode==='little'?'background:var(--ink);color:#fff':''}">Little kid</button></span></div>
    <div class="prow"><span>Child's name <small style="color:var(--muted)">(used for tracing and hello)</small></span><input id="kidName" value="${(K.name||'').replace(/"/g,'')}" maxlength="12" placeholder="Name" style="font:inherit;font-size:20px;padding:8px 12px;border-radius:12px;border:2px solid var(--sky-2);width:10em;user-select:text;-webkit-user-select:text"></div>
    ${GAMES.filter(g=>g.max&&(K.mode==='little'?(g.little||g.both):!g.little)).map(g=>`<div class="prow"><span>${g.em} ${g.name}</span><span class="ctl"><button class="pm" data-d="-1" data-id="${g.id}" aria-label="Easier">−</button>Level ${K.lv[g.id]} <small style="font-size:14px;color:var(--muted)">${g.play?'':'/ '+g.max}</small><button class="pm" data-d="1" data-id="${g.id}" aria-label="Harder">+</button></span></div>`).join('')}
    <div class="row" style="justify-content:flex-start">
      <button class="pbtn" id="snd">Sound: ${K.sound?'On':'Off'}</button>
      <button class="pbtn" id="fs">Full screen: ${K.full===false?'Off':'On'}</button></div>
    <div class="prow" id="vrow" style="flex-wrap:wrap"><span>Voice</span><span class="ctl" style="flex-wrap:wrap"><button class="pbtn" id="vonoff" style="${voiceOn()?'background:var(--ink);color:#fff':''}">${voiceOn()?'On':'Off'}</button><select id="vsel" style="font:inherit;font-size:17px;padding:8px;border-radius:12px;border:2px solid var(--sky-2);max-width:16em"></select>
      <button class="pm" id="vslow" aria-label="Slower">🐢</button><button class="pm" id="vfast" aria-label="Faster">🐇</button><button class="pbtn" id="vtest">▶ Test</button></span></div>
    ${K.mode!=='little'?`<div class="prow" style="flex-wrap:wrap"><span>Play games cost stars <small style="color:var(--muted)">(Fruit Pop, Bubble Pop, Dino Dash, Tower Builder, Brick Builder, Fishing Trip, Fruit Slice, Movies & Shows)</small></span><span class="ctl"><button class="pbtn" id="gateT">${K.gate===false?'Off':'On'}</button></span></div>
    ${K.gate!==false?`<div class="prow" style="flex-wrap:wrap"><span>Each star buys</span><span class="ctl">${[1,2,3,5].map(m=>`<button class="pbtn" data-mps="${m}" style="${minsPerStar()===m?'background:var(--ink);color:#fff':''}">${m} min</button>`).join('')}</span></div>
    <div class="prow" style="flex-wrap:wrap"><span>Stars to spend: <b>${K.wallet}</b> · Play time left: <b>${fmtSec(K.playSec||0)}</b></span><span class="ctl"><button class="pbtn" id="give5">+5 stars</button><button class="pbtn" id="time5">+5 min</button><button class="pbtn" id="time0">Clear time</button></span></div>`:''}`:''}
    ${tvGrownups()}
    <div class="row" style="justify-content:flex-start"><button class="pbtn ${resetArm?'warn':''}" id="rst">${resetArm?'Tap again to erase everything':'Reset stars and stickers'}</button></div>
    <p class="note">Levels go up by themselves after ${PER_LEVEL} right answers. Use − and + if a game feels too hard or too easy.</p>`;
  view.querySelectorAll('.pm').forEach(b=>b.onclick=()=>{const g=GAMES.find(x=>x.id===b.dataset.id);K.lv[g.id]=Math.max(1,Math.min(g.max,K.lv[g.id]+ +b.dataset.d));K.got[g.id]=0;save();grownups()});
  $('#snd').onclick=()=>{K.sound=!K.sound;save();grownups()};
  $('#modeB').onclick=()=>{K.mode='big';save();applyMode();grownups()};$('#modeL').onclick=()=>{K.mode='little';save();applyMode();grownups()};
  $('#kidName').onchange=e=>{K.name=e.target.value.trim().replace(/[^A-Za-z \-']/g,'');K.traceIdx=0;save()};
  (function voicePicker(){const sel=$('#vsel');if(!sel)return;let list=[];
    if(window.SQAndroid&&SQAndroid.voices){try{list=JSON.parse(SQAndroid.voices()).map(v=>({id:v.name,label:v.name.replace(/[-_]/g,' ')+(v.q>=400?' ★':'')+(v.net?' (needs internet)':''),on:v.on}))}catch(e){}}
    else list=webVoices().map(v=>({id:v.name,label:v.name+(v.localService?'':' (needs internet)'),on:v.name===K.voiceName}));
    list.sort((a,b)=>(b.label.includes('★')-a.label.includes('★'))||a.label.localeCompare(b.label));
    if(!list.length){$('#vrow').querySelector('span').textContent='Voice (this tablet has no voices to choose from)';sel.hidden=true}
    sel.innerHTML=list.map(v=>`<option value="${v.id.replace(/"/g,'')}" ${v.on||v.id===K.voiceName?'selected':''}>${v.label}</option>`).join('');
    $('#vonoff').onclick=()=>{K.voiceOn=!voiceOn();save();grownups();if(K.voiceOn)speakNow('Voice is on!')};
    const test=()=>speakNow(K.name?`Hi ${K.name}! Let's catch some butterflies!`:`Hi! Let's play Star Quest!`,true);
    sel.onchange=()=>{K.voiceName=sel.value;save();if(window.SQAndroid&&SQAndroid.setVoice)SQAndroid.setVoice(sel.value);test()};
    const pace=d=>{K.vrate=Math.max(0.6,Math.min(1.4,(K.vrate||0.95)+d));save();if(window.SQAndroid&&SQAndroid.setPace)SQAndroid.setPace(K.vrate,K.vpitch||1);test()};
    $('#vslow').onclick=()=>pace(-0.1);$('#vfast').onclick=()=>pace(0.1);$('#vtest').onclick=test;
    if(!window.SQAndroid&&'speechSynthesis' in window&&!list.length)speechSynthesis.onvoiceschanged=()=>{if(location.hash==='#grownups')grownups()}})();
  if($('#gateT')){$('#gateT').onclick=()=>{K.gate=K.gate===false;save();grownups()};
    view.querySelectorAll('[data-mps]').forEach(b=>b.onclick=()=>{K.minsPerStar=+b.dataset.mps;save();grownups()});
    if($('#give5')){$('#give5').onclick=()=>{K.wallet=(K.wallet||0)+5;save();grownups()};$('#time5').onclick=()=>{K.playSec=(K.playSec||0)+300;save();grownups()};$('#time0').onclick=()=>{K.playSec=0;save();grownups()}}}
  tvGrownupsWire(grownups);
  $('#fs').onclick=()=>{K.full=K.full===false;save();if(K.full===false&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});grownups()};
  $('#rst').onclick=()=>{if(!resetArm){resetArm=true;return grownups()}resetArm=false;const keep={jf:K.jf,jfDev:K.jfDev,jfLast:K.jfLast,mode:K.mode,name:K.name,voiceName:K.voiceName,voiceOn:K.voiceOn,gate:K.gate,minsPerStar:K.minsPerStar};K=Object.assign(blank(),keep,{wallet:0,playSec:0});save();updateStars();grownups()};
}

/* ---------- navigation (plain #names so the back button works) ---------- */
const ROUTES={story:()=>{playStory.cur=null;playStory()},playground:playPlayground,puzzle:playPuzzle,piano:playPiano,robot:playRobot,boss:playBoss,daily:playDaily,butterfly:playButterfly,dressup:playDressup,color:playColoring,sort:playSort,trace:playTrace,fruit:gated('fruit',()=>playFruit()),bubble:gated('bubble',()=>playBubble()),runner:gated('runner',playRunner),tower:gated('tower',playTower),brick:gated('brick',playBrick),fish:gated('fish',playFish),slice:gated('slice',playSlice),tv:gated('tv',()=>{TV.stack=[];playTv()}),adventure:()=>{ADV.step=null;playAdventure()},math:playMath,clock:playClock,words:playWords,rhyme:playRhyme,memory:playMemory,pattern:playPattern,doodle:playDoodle,stickers,grownups};
function go(name){if(location.hash.slice(1)!==name)location.hash=name;else show()}
function show(){loopToken++;const r=location.hash.slice(1);resetArm=false;$('#timeChip').hidden=true;updateStars();$('#overlay').hidden=true;popQ.length=0;try{if(window.SQAndroid)SQAndroid.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  view.scrollTop=0;(ROUTES[r]||home)()}
window.addEventListener('hashchange',show);
$('#homeBtn').onclick=()=>{sfx.tap();go('home')};
window.addEventListener('resize',()=>{if(location.hash==='#doodle'&&playDoodle.resize)playDoodle.resize();if(location.hash==='#fruit'&&playFruit.fit)playFruit.fit();if(location.hash==='#trace'&&playTrace.fit)playTrace.fit();if(location.hash==='#brick'&&playBrick.fit)playBrick.fit();const S=canvasGame.cur;if(S&&S.alive())S.fit()});
// In a browser, go full screen on the first tap so it feels like an app (not needed inside the installed app)
const inApp=/\bwv\b|; wv\)/.test(navigator.userAgent)||matchMedia('(display-mode: standalone)').matches;
function goFull(){if(inApp||K.full===false||document.fullscreenElement)return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(f)try{const r=f.call(el);r&&r.catch&&r.catch(()=>{})}catch(e){}}
document.addEventListener('pointerup',goFull,{passive:true});
applyMode();updateStars();show();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
