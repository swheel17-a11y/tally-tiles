  const hud=()=>{$('#hp').style.width=(hp/maxHp*100)+'%';$('#hearts').textContent='❤️'.repeat(hearts)+'🤍'.repeat(3-hearts)};hud();
  function ask(){const Q=q();$('#bq').textContent=`${Q.text} = ?`;
    $('#bhelp').onclick=()=>{if(busy)return;if(!Q.helped){Q.helped=true;helps++}multHelp(Q.x,Q.y)};
    const box=document.createElement('div');box.className='choices';box.id='bch';
    nearOptions(Q.ans,4,Q.ans<20?4:Q.ans<50?8:12,1).forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;
      b.onclick=async()=>{if(busy)return;busy=true;
        if(v===Q.ans){b.classList.add('ok');sfx.yes();const z=$('#zap');z.classList.remove('fire');void z.offsetWidth;z.classList.add('fire');
          await fsleep(380);hp--;hud();const B=$('#boss');B.classList.remove('hit');void B.offsetWidth;B.classList.add('hit');tone([[200,0,.15],[120,.05,.2]],'sawtooth',0.05);
          if(hp<=0){B.classList.add('ko');sfx.up();say(`You beat the ${name}!`);await fsleep(900);K.bossN=(K.bossN||0)+1;const stars=helps>2?2:3;addStars(stars,B,'boss');
            K.got.boss=PER_LEVEL-1;const up=correct('boss');popup('🏆',`${name} defeated!`,`You earned ${stars} stars.${helps>2?' Fewer helps next time means 3 stars!':''}`,up?'Next level':'Next boss',()=>playBoss());return}
          await fsleep(450)}
        else{b.classList.add('no');sfx.no();const B=$('#boss');B.classList.remove('lunge');void B.offsetWidth;B.classList.add('lunge');hearts--;hud();
          $('#bnote').textContent=`${Q.text} = ${Q.ans}`;say(`${Q.text.replace('×','times')} is ${Q.ans}`);
          if(Math.max(Q.x,Q.y)>5&&hearts>0){$('#bnote').innerHTML=`${Q.text} = ${Q.ans} <button class="linkbtn" id="bsee">See how ▶</button>`;
            await new Promise(res=>{const t=setTimeout(res,2600);$('#bsee').onclick=()=>{clearTimeout(t);multHelp(Q.x,Q.y,res)}})}
          else await fsleep(1500);$('#bnote').textContent='';
          if(hearts<=0){popup(em,`The ${name} won this time!`,'Practice makes you stronger. Try again!','Try again',()=>playBoss());return}}
        busy=false;ask()};box.appendChild(b)});
    $('#bch').replaceWith(box)}
  ask();
}

/* =========================================================
   DAILY CHALLENGE: five mixed questions, once a day
   ========================================================= */
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function dayKey(offset){const d=new Date();d.setDate(d.getDate()-offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dailyQs(){
  const qs=[];
  const m=()=>{const x=mathQ(K.lv.math);return{prompt:'Solve it!',html:`<div class="big">${x.text} = ?</div>`,opts:nearOptions(x.ans,4,x.spread),ans:x.ans}};
  const c=()=>{const lv=K.lv.clock,mins=lv===1?[0]:lv===2?[0,30]:lv===3?[0,15,30,45]:[...Array(12)].map((_,i)=>i*5);const h=rnd(1,12),mm=pick(mins),ans=fmt(h,mm);
    const s=new Set([ans]);while(s.size<4)s.add(fmt(((h+rnd(1,10)-1)%12)+1,pick(mins.length>1?mins:[0,30])));return{prompt:'What time is it?',html:`<div class="clock">${clockSVG(h,mm)}</div>`,opts:shuffle([...s]),ans}};
  const p=()=>{const x=patternQ(K.lv.pattern);return{prompt:'What comes next?',html:`<div class="seq">${x.seq.map(s=>`<span>${s}</span>`).join('')}<span class="q">?</span></div>`,opts:x.opts,ans:x.ans,cls:'c3'}};
  const r=()=>{const fam=pick(FAM),[w,a]=shuffle(fam.slice()).slice(0,2),wrong=shuffle(FAM.filter(f=>f!==fam).flat().filter(x=>!fam.includes(x))).slice(0,3);
    return{prompt:'Which word rhymes with…',html:`<div class="big">${w}</div>`,opts:shuffle([a,...wrong]),ans:a}};
  [m,c,p,r,m].forEach(f=>qs.push(f()));return qs;
}
function playDaily(){
  if(location.hash!=='#daily')return; // a late timer from a game you already left
  setHeader('Daily Challenge');K.daily=K.daily||{days:[]};const D=K.daily,today=todayKey();
  const streak=()=>{let s=0;for(let i=D.days.includes(today)?0:1;;i++){if(D.days.includes(dayKey(i)))s++;else break}return s};
  const week=()=>`<div class="week">${[6,5,4,3,2,1,0].map(i=>{const k=dayKey(i),d=new Date();d.setDate(d.getDate()-i);return `<span class="${D.days.includes(k)?'on':''}"><small>${'SMTWTFS'[d.getDay()]}</small>${D.days.includes(k)?'✅':'·'}</span>`}).join('')}</div>`;
  if(D.days.includes(today)){view.innerHTML=`<div class="board"><div class="panel spend"><div class="em">🔥</div><h2>${streak()} day streak!</h2><p>You finished today's challenge. Come back tomorrow for a new one!</p>${week()}</div></div>`;return}
  const qs=dailyQs();let i=0;
  const ask=()=>{const Q=qs[i];view.innerHTML=`<div class="board">${week()}<p class="prompt">${Q.prompt}</p><div class="panel">${Q.html}</div><div id="dch"></div>
      <div class="progress">${qs.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div></div>`;
    $('#dch').replaceWith(choices(Q.opts,Q.ans,btn=>{i++;if(i<qs.length)return setTimeout(ask,700);
      D.days=[...new Set([...D.days,today])].slice(-60);save();const s=streak();sfx.up();say(`Challenge complete! ${s} day streak!`);
      addStars(5,btn,'daily');setTimeout(()=>popup('🔥','Daily challenge done!',`That's a ${s} day streak. You earned 5 stars!`,'Yay!',()=>playDaily()),900)},Q.cls))};
  ask();
}

const BB_IDEAS=[['🏠','a house'],['🚀','a rocket'],['🚗','a car'],['🏰','a castle'],['🌉','a bridge'],['🗼','a tall tower'],['🐶','a dog'],['🚂','a train'],['⛵','a boat'],['🌳','a tree'],['🤖','a robot'],['🐍','a snake'],['🛸','a spaceship'],['🦖','a dinosaur'],['🪑','a chair'],['🌈','a rainbow'],['🏟️','a stadium'],['✈️','an airplane']];

function loadThree(){

function brickScene(stage,token,drawBar){
  const T=THREE;let R;

  const plate=new T.Mesh(new T.BoxGeometry(BB_N,0.4,BB_N),new T.MeshPhongMaterial({color:PLATE,shininess:30}));plate.position.y=-0.2;scene.add(plate);
  const mats=BB_COLORS.map(c=>new T.MeshPhongMaterial({color:c,shininess:70,specular:0x333333}));
  const geos={},boxGeo=(w,d)=>geos[w+'x'+d]||(geos[w+'x'+d]=new T.BoxGeometry(w-0.05,BB_H-0.03,d-0.05));
  const edges={},edgeGeo=(w,d)=>edges[w+'x'+d]||(edges[w+'x'+d]=new T.EdgesGeometry(boxGeo(w,d)));const edgeMat=new T.LineBasicMaterial({color:'#000000',transparent:true,opacity:0.22});
  const studGeo=new T.CylinderGeometry(0.3,0.3,0.22,16);
  const studs=new T.InstancedMesh(studGeo,new T.MeshPhongMaterial({color:'#ffffff',shininess:70,specular:0x333333}),BB_STUDS);
  scene.add(studs); // count stays full until the first rebuild so instance colours get allocated
  const group=new T.Group();scene.add(group);
  const ghostMat=new T.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0.5,depthWrite:false});
  const ghost=new T.Mesh(boxGeo(1,1),ghostMat);ghost.visible=false;scene.add(ghost);
  const ghostEdge=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1,1,1)),new T.LineBasicMaterial({color:'#1d2b4f'}));ghost.add(ghostEdge);
  const M=new T.Matrix4(),C=new T.Color(),plateC=new T.Color(PLATE);

  const undo=[];
  let dirty=true,saveT=0;
  const wx=(x,w)=>x+w/2-BB_N/2;
  function rebuild(){

    const opts=shuffle(ADV_TRAVEL.slice()).slice(0,2);
    opts.forEach((o,i)=>{const b=advItem(scene,`${o[0]}`,62+i*24,40,'achoice float');b.style.animationDelay=(i*500)+'ms';

        speakNow(o[1].replace(/^\w+/,w=>({floated:'Float',slid:'Slide',flew:'Fly',rode:'Ride',sailed:'Sail',zoomed:'Zoom'})[w]||w)+'!');done(`They ${o[1]}!`)}});

  bow(scene,done,{fn,fr}){
    ADV_BOWS.forEach(([name,col],i)=>{const b=advItem(scene,'',56+(i%3)*14,26+Math.floor(i/3)*26,'aswatch');b.style.background=col;b.setAttribute('aria-label',name);
      b.onclick=()=>{ADV.bow=[name,col];$('#abow').innerHTML=bowSVG(col);sparkleOver(fr);tone([[880,0,.08],[1320,.06,.15]],'sine',0.07);
        scene.querySelectorAll('.aswatch').forEach(x=>x.classList.toggle('picked',x===b));
        if(!done.fired){done.fired=1;done(`A ${name} bow! ${fn} looks beautiful!`)}else speakNow(`${name}!`)}});
  },
  pop(scene,done,{P}){
    const n=rnd(3,5),bub=P.pop[0]==='bubble';let got=0;
    advSpots(n).forEach(([x,y],i)=>{const b=advItem(scene,bub?'':P.pop[0],x,y,'float '+(bub?'abub':''));b.style.animationDelay=(i*300)+'ms';
      b.onclick=()=>{if(b.classList.contains('gone'))return;got++;b.classList.add('gone');sparkleOver(b);tone([[500+got*120,0,.08],[900+got*120,.05,.12]],'sine',0.08);
        speakNow(ANUM[got]+'!');if(got===n)setTimeout(()=>done(`${ANUM[n]} ${P.pop[1]}!`),700)}});
  },
  catch(scene,done,{P,fr}){
    let got=0;const tok=loopToken,live=[],need=5;
    const meter=document.createElement('div');meter.className='ameter';meter.innerHTML=[...Array(need)].map(()=>`<i>${P.catch[0]}</i>`).join('');scene.appendChild(meter);
    const spawn=()=>{const b=advItem(scene,P.catch[0],rnd(46,92),-8,'afall');const it={b,y:-8,v:rnd(9,13)};live.push(it);
      b.onclick=()=>{if(it.caught)return;it.caught=true;got++;meter.children[got-1].classList.add('on');sparkleOver(b);tone([[600+got*100,0,.08],[900+got*100,.05,.12]],'sine',0.08);
        speakNow(ANUM[got]+'!');b.classList.add('gone');setTimeout(()=>b.remove(),300);if(got>=need){done(`You caught ${ANUM[need].toLowerCase()} ${P.catch[1]}!`)}}};
    let last=performance.now(),gap=0;spawn();
    const step=now=>{if(tok!==loopToken||!document.body.contains(scene))return;const dt=Math.min(0.05,(now-last)/1000);last=now;
      if(got>=need)return;gap+=dt;if(gap>1.5&&live.filter(i=>!i.caught).length<3){gap=0;spawn()}
      for(let k=live.length-1;k>=0;k--){const it=live[k];if(it.caught){live.splice(k,1);continue}it.y+=it.v*dt;it.b.style.top=it.y+'%';if(it.y>104){it.b.remove();live.splice(k,1)}}
      requestAnimationFrame(step)};
    requestAnimationFrame(step);
  },
  music(scene,done,{fn,fr}){
    const notes=[523,587,659,784,880],cols=['#ff6fb5','#ffcf33','#3fbf6f','#3f9bff','#a66bff'];let taps=0;
    notes.forEach((f,i)=>{const b=advItem(scene,'🔔',52+i*9.5,30+(i%2)*22,'abell');b.style.background=cols[i];
      b.onclick=()=>{taps++;tone([[f,0,.5]],'triangle',0.13);b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring');
        const n=document.createElement('span');n.className='anote';n.textContent=pick(['🎵','🎶']);n.style.left=b.style.left;n.style.top=b.style.top;scene.appendChild(n);setTimeout(()=>n.remove(),1200);
        fr.classList.remove('boing');void fr.offsetWidth;fr.classList.add('boing');
        if(taps===8)done(`What a pretty song! ${fn} loved it!`)}});
  },
  grow(scene,done,{P,fn}){
    let t=0;const b=advItem(scene,'🌱',72,62,'agrow');b.style.fontSize='9vmin';
    b.onclick=()=>{if(t>=3)return;t++;b.style.fontSize=(9+t*5)+'vmin';sparkleOver(b);tone([[400+t*200,0,.12],[600+t*200,.08,.2]],'sine',0.08);
      if(t<3)speakNow(ANUM[t]+'!');else{b.textContent=P.grow;b.classList.add('bloom');done(`${ANUM[3]}! A beautiful ${P.growName}!`)}};
  },
  match(scene,done,{wait}){
    let round=0,fin0=false;const want0=document.createElement('div');want0.className='awant';scene.appendChild(want0);
    const ask=()=>{scene.querySelectorAll('.aheart').forEach(x=>x.remove());const three=shuffle(ADV_HEARTS.slice()).slice(0,3),want=pick(three);
      want0.innerHTML=`<small>Find</small>${want[0]}`;if(round)speakNow(`Now tap the ${want[1]} heart!`);else setTimeout(()=>{if(document.body.contains(scene)&&!fin0)speakNow(`Tap the ${want[1]} heart!`)},wait);
      three.forEach((h,i)=>{const b=advItem(scene,h[0],60+i*14,round%2?36:46,'aheart float');b.style.animationDelay=(i*250)+'ms';
        b.onclick=()=>{if(h===want){scene.querySelectorAll('.aheart').forEach(x=>x.disabled=true);sparkleOver(b);sfx.yes();round++;if(round<2){speakNow('Yes! '+want[1]+'!');setTimeout(ask,1200)}else{fin0=true;want0.remove();done(`Yes, ${want[1]}!`)}}
          else{b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig');sfx.no();speakNow(`That one is ${h[1]}. Find ${want[1]}!`)}}})};
    ask();
  },
  find(scene,done,{P,lost}){
    const n=P.hide.length,at=rnd(0,n-1);let found=false;
    advSpots(n).forEach(([x,y],i)=>{const b=advItem(scene,P.hide[i],x,y+6,'ahide');

        else{b.classList.remove('wig');void b.offsetWidth;b.classList.add('wig');tone([[300,0,.1]],'triangle',0.08);speakNow(pick(['Not here!','Hmm, not there!','Try another one!']));
          b.disabled=true;b.style.opacity='.55'}}});

  feed(scene,done,{P,fn,fr}){
    let fed=0;const foods=shuffle(P.feed.slice()).slice(0,3);

      b.onclick=()=>{if(b.classList.contains('fly'))return;const s=scene.getBoundingClientRect(),f=fr.getBoundingClientRect();
        b.classList.add('fly');b.style.left=((f.left+f.width/2-s.left)/s.width*100)+'%';b.style.top=((f.top+f.height*0.4-s.top)/s.height*100)+'%';
        setTimeout(()=>{b.remove();fed++;fr.classList.remove('boing');void fr.offsetWidth;fr.classList.add('boing');tone([[500,0,.08],[380,.08,.1]],'square',0.04);
          speakNow(pick(['Yum!','Num num num!','Yummy!']));if(fed===foods.length)setTimeout(()=>done(`${fn} is so full and happy!`),600)},650)}});
  }
};

   ========================================================= */
// [emoji, name, depth 0-1, weight (higher = more common), difficulty 1-5, min cm, max cm, kind]  kind: s=swims, b=bottom crawler, j=junk/treasure on the floor
const FISH_SPOTS=[
  {id:'pond',name:'Lily Pond',em:'🐸',top:'#bfe8ff',sky:'#e8f6ff',w1:'#5cc1b0',w2:'#1f6f6a',floor:'#7a6a3a',weed:'#3f9a4a',fish:[

  {id:'sea',name:'Coral Sea',em:'🐚',top:'#9fdcff',sky:'#dff4ff',w1:'#36b6e6',w2:'#0d4f8a',floor:'#e8cf8f',weed:'#ff7f9e',fish:[
    ['🐠','Clownfish',0.35,10,1,6,12,'s'],['🐟','Mackerel',0.25,9,2,25,45,'s'],['🐡','Pufferfish',0.55,6,2,15,40,'s'],['🦀','Red Crab',1,6,1,8,22,'b'],
    ['⭐','Starfish',1,4,0,10,30,'j'],['🦑','Squid',0.7,4,3,30,90,'s'],['🐢','Sea Turtle',0.5,2,3,60,140,'s'],['🦈','Shark',0.75,1.5,5,150,400,'s'],['🥫','Old Can',1,2,0,10,12,'j']]},
  {id:'deep',name:'Deep Dark Sea',em:'🌑',top:'#5b8fd6',sky:'#cfe0f7',w1:'#1f4f9a',w2:'#070d2e',floor:'#3a3550',weed:'#6a5acd',night:true,fish:[
    ['🦐','Glow Shrimp',0.4,10,1,5,15,'s'],['🐙','Octopus',0.85,6,3,40,200,'s'],['🦑','Giant Squid',0.7,4,4,300,1200,'s'],['🐡','Angler Puffer',0.6,6,2,20,60,'s'],
    ['🐳','Blue Whale',0.4,1,5,2000,3000,'s'],['🐉','Sea Dragon',0.9,0.7,5,500,900,'s'],['💎','Sunken Gem',1,2,0,3,8,'j'],['👑','Pirate Crown',1,1,0,20,25,'j']]}];
const FISH_UNLOCK=4; // species to find before the next spot opens
function fishBook(){K.fish=K.fish||{book:{},spot:0};return K.fish}
function fishFound(si){const B=fishBook().book;return FISH_SPOTS[si].fish.filter((_,i)=>B[si+':'+i]).length}
function fishOpen(si){return si===0||fishFound(si-1)>=FISH_UNLOCK}
function playFish(){
  if(location.hash!=='#fish')return; // a late timer from a game you already left
  const F=fishBook();if(!fishOpen(F.spot))F.spot=0;
  const SP=FISH_SPOTS[F.spot];
  const S=canvasGame('Fishing Trip',SP.name,`<span>Found <b id="fFound">${fishFound(F.spot)}</b> of ${SP.fish.length}</span>
    ${FISH_SPOTS.map((p,i)=>`<button class="pbtn fspot" data-sp="${i}" aria-pressed="${i===F.spot}" ${fishOpen(i)?'':'disabled'}>${fishOpen(i)?p.em:'🔒'} ${p.name}</button>`).join('')}
    <button class="pbtn" id="fBookB">📖 Fish book</button>`);
  view.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sp;if(!fishOpen(i)){sfx.no();return}F.spot=i;save();sfx.tap();playFish()});
  const G={t:0,boatX:0,boatTo:0,hook:{x:0,y:0,ty:0,state:'up'},fish:[],items:[],bubbles:[],sparks:[],ring:[],hold:false,reel:null,show:null,msg:'Tap the water to drop your hook!',msgT:4,tutorial:!F.tutDone};
  const Wy=()=>S.H*0.2,floorY=()=>S.H-28,depthY=d=>Wy()+40+d*(floorY()-Wy()-70),sz=()=>Math.max(30,Math.min(S.W,S.H)*0.075);
  const rodTip=()=>({x:G.boatX+sz()*0.55,y:Wy()-sz()*0.9});
  G.boatX=G.boatTo=S.W*0.4;G.hook.x=rodTip().x;G.hook.y=Wy()-10;
  const weeds=[...Array(14)].map(()=>({x:Math.random(),h:0.5+Math.random(),p:Math.random()*6}));
  const pickSpecies=kind=>{const list=SP.fish.map((f,i)=>[f,i]).filter(([f])=>kind==='j'?f[7]!=='s':f[7]==='s');const tot=list.reduce((a,[f])=>a+f[3],0);let r=Math.random()*tot;
    for(const [f,i] of list){r-=f[3];if(r<=0)return i}return list[0][1]};
  function spawnFish(edge){const i=pickSpecies('s'),f=SP.fish[i],dir=Math.random()<.5?1:-1,d=Math.max(0.02,Math.min(0.95,f[2]+(Math.random()-.5)*0.3));
    G.fish.push({i,x:edge?(dir>0?-60:S.W+60):40+Math.random()*(S.W-80),d,dir,v:(30+Math.random()*30)*(1+f[4]*0.18),ph:Math.random()*6,want:Math.random()<0.75})}
  function spawnItem(){const i=pickSpecies('j'),f=SP.fish[i];G.items.push({i,x:60+Math.random()*(S.W-120),dir:Math.random()<.5?1:-1,v:f[7]==='b'?12+Math.random()*10:0})}
  for(let k=0;k<6;k++)spawnFish(false);for(let k=0;k<3;k++)spawnItem();
  if(/[?&]bot\b/.test(location.search))window.__fishG=G;
  const fy=o=>depthY(o.d)+Math.sin(G.t*2+o.ph)*6;
  // ----- input -----
  S.cv.onpointerdown=e=>{e.preventDefault();const r=S.cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;G.hold=true;
    if(G.reel){reelTap();return} if(G.show){if(G.show.t>0.6){G.show=null;G.hook.state='up'}return}
    if(y<Wy()){G.hook.state='up';return}
    G.boatTo=Math.max(sz(),Math.min(S.W-sz(),x-sz()*0.55));G.hook.tx=G.boatTo+sz()*0.55;G.hook.ty=Math.min(y,floorY()-14);G.hook.state='move';G.hook.wait=0;
    G.fish.forEach(o=>{o.want=Math.random()<0.8;o.chase=false});
    if(G.tutorial&&G.msgT>0){G.msgT=0}};
  const release=()=>{G.hold=false};S.cv.onpointerup=release;S.cv.onpointercancel=release;S.cv.onpointerleave=release;
  // ----- reeling mini-game -----
  // tap-fast reeling: tap while the fish is calm, stop when it turns red (3 taps while it's red snaps the line)
  const calmFor=d=>(2.2+Math.random()*1.6)*(1.1-d*0.08);
  function startReel(o){const f=SP.fish[o.i];o.hooked=true;
    G.reel={o,f,diff:f[4],p:0.25,mood:'calm',moodT:f[4]<=1?calmFor(1)+1:1.1+Math.random()*0.8,tension:0,startY:G.hook.y,warn:0.5,taps:0,pop:0};
    sfx.yes();tone([[300,0,.08],[300,.12,.08]],'square',0.05);
    if(G.tutorial){G.msg='Tap tap tap to reel it in! When the fish turns RED, stop tapping!';G.msgT=6}}
  function reelTap(){const R=G.reel;if(!R)return;R.taps++;
    if(R.mood==='angry'){R.tension+=0.4;tone([[160,0,.08]],'sawtooth',0.06);
      if(R.tension>=1){lose('snap');return}
      G.msg='Stop! Wait for it to calm down!';G.msgT=1.2;return}
    R.p=Math.min(1,R.p+0.054-R.diff*0.004);R.pop=1;tone([[700+R.p*500,0,.04]],'square',0.025);
    if(R.p>=1)catchIt(R.o,false)}
  function catchIt(o,instant){const f=SP.fish[o.i],key=F.spot+':'+o.i,B=F.book,cm=Math.round(f[5]+Math.random()*Math.random()*(f[6]-f[5]));
    const old=B[key],isNew=!old,rec=old&&cm>old.best;B[key]={n:(old?old.n:0)+1,best:Math.max(cm,old?old.best:0)};
    const firstTime=G.tutorial;G.tutorial=false;F.tutDone=true;save();
    G.show={o,f,cm,isNew,rec,t:0};G.reel=null;sfx.up();sparks(G.sparks,G.hook.x,Wy(),'#ffd23f',26,260);
    const unlocked=isNew&&F.spot<2&&fishFound(F.spot)===FISH_UNLOCK;
    say(isNew?`New fish! A ${f[1]}!`:rec?`New record! ${cm} centimeters!`:`You caught a ${f[1]}!`);
    if(isNew)addStars(1,S.cv,'fish');
    $('#fFound').textContent=fishFound(F.spot);
    if(unlocked)setTimeout(()=>{if(S.alive())popup(FISH_SPOTS[F.spot+1].em,`${FISH_SPOTS[F.spot+1].name} is open!`,`You found ${FISH_UNLOCK} kinds of ${instant?'things':'fish'} here. Tap the new spot at the top to fish somewhere new.`,'Cool!',()=>playFish())},1800);
    if(instant)G.items.splice(G.items.indexOf(o),1);else G.fish.splice(G.fish.indexOf(o),1)}
  function lose(why){const o=G.reel.o;o.hooked=false;o.chase=false;o.want=false;o.dir=Math.random()<.5?1:-1;o.v*=2.2;o.flee=2;G.reel=null;G.hook.state='up';
    sfx.no();if(why==='snap'){G.shake=0.4;G.msg='Snap! The line broke. Try again!';G.msgT=2.4;say('Snap! The line broke!')}else{G.msg='It got away! Try again.';G.msgT=2.2;say('It got away!')}}
  // ----- loop -----
  S.loop(dt=>{
    const c=S.ctx,W=S.W,H=S.H,s=sz();G.t+=dt;
    // update boat + hook
    G.boatX+=(G.boatTo-G.boatX)*Math.min(1,dt*3);
    const tip=rodTip(),h=G.hook;
    if(h.state==='move'){h.x+=(tip.x-h.x)*Math.min(1,dt*8);if(Math.abs(G.boatX-G.boatTo)<4){h.state='sink';h.x=tip.x;if(h.y<Wy()){h.y=Wy();tone([[220,0,.12],[160,.05,.15]],'sine',0.08);G.ring.push({x:h.x,t:0})}}}
    else if(h.state==='sink'){h.x=tip.x;h.y=Math.min(h.ty,h.y+Math.max(120,H*0.45)*dt);if(h.y>=h.ty)h.state='wait';if(h.y<Wy())h.y=Wy()}
    else if(h.state==='wait'){h.x=tip.x+Math.sin(G.t*2)*3;h.wait+=dt}
    else if(h.state==='up'&&!G.show){h.x+=(tip.x-h.x)*Math.min(1,dt*6);h.y+=(tip.y+30-h.y)*Math.min(1,dt*4)}
    // treasure on the floor: grab it if the hook lands right on it
    if(h.state==='wait'&&!G.reel&&!G.show)for(const it of G.items){if(Math.hypot(it.x-h.x,floorY()-14-h.y)<s*0.9){catchIt(it,true);break}}
    // fish
    for(const o of G.fish){const f=SP.fish[o.i];
      if(o.hooked){o.x=h.x+Math.sin(G.t*18)*6;continue}
      if(o.flee){o.flee-=dt;if(o.flee<=0){o.flee=0;o.v/=2.2}}
      const y=fy(o);
      if(h.state==='wait'&&!G.reel&&!G.show&&o.want&&!o.flee&&Math.hypot(o.x-h.x,y-h.y)<Math.max(170,W*0.2))o.chase=true;
      if(o.chase&&h.state==='wait'&&!G.reel&&!G.show){const dx=h.x-o.x,dy=h.y-y;o.dir=dx>0?1:-1;o.x+=Math.sign(dx)*Math.min(Math.abs(dx),o.v*1.3*dt);
        const want=(h.y-Wy()-40)/(floorY()-Wy()-70);o.d+=(want-o.d)*Math.min(1,dt*1.5);
        if(Math.hypot(dx,dy)<s*0.55)startReel(o)}
      else{o.chase=false;o.x+=o.dir*o.v*dt;if(Math.random()<dt*0.15)o.dir*=-1}
      if(o.x<-120||o.x>W+120)o.gone=true}
    G.fish=G.fish.filter(o=>!o.gone);while(G.fish.length<6)spawnFish(true);
    for(const it of G.items){if(!it.v)continue;it.x+=it.dir*it.v*dt;if(it.x<30||it.x>W-30)it.dir*=-1}
    while(G.items.length<3)spawnItem();
    if(Math.random()<dt*3)G.bubbles.push({x:Math.random()*W,y:floorY(),r:2+Math.random()*4});
    // reeling
    const R=G.reel;
    if(R){R.moodT-=dt;R.pop=Math.max(0,R.pop-dt*4);R.tension=Math.max(0,R.tension-dt*0.7);
      if(R.moodT<=0){if(R.mood==='calm'){R.mood='warn';R.moodT=0.9;tone([[500,0,.08],[500,.15,.08]],'triangle',0.05)}
        else if(R.mood==='warn'){R.mood='angry';R.moodT=1.0+R.diff*0.18;if(G.tutorial){G.msg='RED! Stop tapping!';G.msgT=1.5}}
        else{R.mood='calm';R.moodT=calmFor(R.diff);R.tension=0}}
      R.p=Math.max(0.08,R.p-(R.mood==='angry'?0.04+R.diff*0.008:0.012+R.diff*0.005)*dt);
      h.y=R.startY+(Wy()-R.startY)*R.p}
    if(G.show){G.show.t+=dt;h.y+=(tip.y+30-h.y)*Math.min(1,dt*3);h.x+=(tip.x-h.x)*Math.min(1,dt*3)}
    // ----- draw -----
    const sky=c.createLinearGradient(0,0,0,Wy());sky.addColorStop(0,SP.night?'#26305e':SP.top);sky.addColorStop(1,SP.sky);c.fillStyle=sky;c.fillRect(0,0,W,Wy());
    emojiAt(c,SP.night?'🌙':'☀️',W*0.88,Wy()*0.35,s*0.9);emojiAt(c,'☁️',(G.t*12)%(W+200)-100,Wy()*0.3,s*0.9);
    const wg=c.createLinearGradient(0,Wy(),0,H);wg.addColorStop(0,SP.w1);wg.addColorStop(1,SP.w2);c.fillStyle=wg;c.fillRect(0,Wy(),W,H-Wy());

// When sign-in can't get through, find out which step is blocked so a grown-up knows what to fix
async function jfDiagnose(url){
  const host=esc(url.replace(/^https?:\/\//,'')),me=esc(location.origin&&location.origin!=='null'?location.origin:'this page');
  if(!/^https:/i.test(url))return `<b>Step 1 failed:</b> the address must start with https:// (this app is on a secure page, so tablets won't talk to plain http servers).`;
  const t=(p,o)=>Promise.race([fetch(url+p,o),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),9000))]);
  try{await t('/System/Info/Public',{mode:'no-cors',cache:'no-store'})}catch(e){return `<b>Step 1 failed:</b> this tablet can't reach <b>${host}</b> at all. Check the address and Wi-Fi, and try opening https://${host} in the browser on this tablet.`}
  let info=null;try{const r=await t('/System/Info/Public',{cache:'no-store'});info=await r.json()}catch(e){
    return `<b>Step 2 failed:</b> the server is there, but it is blocking apps that live on other websites (CORS). Ask the server owner to allow <b>${me}</b>: in Jellyfin, Dashboard › Networking › "CORS hosts"/"Known proxies" area, or in the reverse proxy (nginx, Caddy, Cloudflare) add an Access-Control-Allow-Origin header for that address.`}
  try{await t('/System/Info/Public',{cache:'no-store',headers:{'X-Emby-Authorization':jfHdr()}})}catch(e){
    return `<b>Step 3 failed:</b> the server ${info&&info.ServerName?`(“${esc(info.ServerName)}”) `:''}answers simple requests but blocks the sign-in check (CORS preflight). The reverse proxy in front of Jellyfin needs to answer OPTIONS requests and allow the Authorization and X-Emby-Authorization headers for <b>${me}</b>.`}
  return `The server ${info&&info.ServerName?`“${esc(info.ServerName)}” `:''}is reachable and allows this app, but the sign-in still failed. Try again in a minute.`;
}

    for(const o of G.items){if(o.menu){o.y=H*0.55+Math.sin(G.t*2+(o.menu==='zen'?1:0))*8;o.x=o.menu==='classic'?W*0.3:W*0.7;o.rot+=o.vr*dt;continue}
      o.vy+=grav()*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
      if(o.vy>0&&o.y>H+o.s){o.gone=true;if(!o.dead&&!o.bomb)miss(o)}}
    G.items=G.items.filter(o=>!o.dead&&!o.gone);
    // background
    c.save();if(G.shake>0){G.shake-=dt;c.translate((Math.random()-.5)*16*G.shake,(Math.random()-.5)*16*G.shake)}
    const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#6b3f1f');bg.addColorStop(1,'#4a2a12');c.fillStyle=bg;c.fillRect(-20,-20,W+40,H+40);
    c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=3;for(let i=1;i<6;i++){c.beginPath();c.moveTo(0,H*i/6);c.lineTo(W,H*i/6+Math.sin(i)*10);c.stroke()}

      c.beginPath();c.arc(s.x+s.r*0.9,s.y+s.r*0.3,s.r*0.3,0,7);c.fill()}c.globalAlpha=1;G.splats=G.splats.filter(s=>s.a>0);
    // halves
    for(const h of G.halves){h.vy+=grav()*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;h.life-=dt;
      c.save();c.translate(h.x,h.y);c.rotate(h.rot+h.rel);c.beginPath();if(h.side>0)c.rect(-h.s,0,h.s*2,h.s);else c.rect(-h.s,-h.s,h.s*2,h.s);c.clip();
      c.rotate(-h.rel);emojiAt(c,h.e,0,0,h.s);c.restore()}
    G.halves=G.halves.filter(h=>h.life>0&&h.y<H+h.s*2);

      if(o.bomb){c.shadowColor='#ff3b3b';c.shadowBlur=18+Math.sin(G.t*12)*8}
      emojiAt(c,o.e,0,0,o.s);c.restore();
      if(o.bomb&&Math.random()<0.5)sparks(G.sparks,o.x+o.s*0.25,o.y-o.s*0.4,'#ffd23f',1,60);
      if(o.menu){c.fillStyle='#fff';c.textAlign='center';c.font=`700 ${Math.round(Math.max(18,o.s*0.2))}px Fredoka,system-ui`;c.fillText(o.label,o.x,o.y+o.s*0.8)}}

      c.font=`700 ${Math.round(Math.max(15,size()*0.22))}px Nunito,system-ui`;c.fillStyle='rgba(255,255,255,.75)';
      c.fillText(`Classic: miss 3 fruit or hit bombs and it's over · Zen: 60 seconds, no bombs`,W/2,H*0.22+size()*0.5,W-40)}

      c.font=`700 ${Math.round(Math.max(22,size()*0.4)*t.big)}px Fredoka,system-ui`;c.strokeText(t.t,t.x,t.y,W-20);c.fillText(t.t,t.x,t.y,W-20)}

      for(let i=1;i<G.trail.length;i++){const a=G.trail[i-1],b=G.trail[i],k=i/G.trail.length;

        c.strokeStyle=`rgba(255,255,255,${k})`;c.lineWidth=7*k;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}}
    c.restore();
    if(G.flash>0){G.flash-=dt*2.5;c.fillStyle=`rgba(255,255,255,${Math.max(0,G.flash)*0.8})`;c.fillRect(0,0,W,H)}
  });
}

/* =========================================================
   NINJA PORTAL: Noah's game. Tib (gold), Drock (red) and Kuko (blue) vs the robots.
   Drag to move, grab coins, buy power-ups, hit the middle portal 5 times, escape through a side portal.
   Built light for slow tablets: every picture is drawn once into a sprite and reused.
   ========================================================= */
const NJ_TEAM=[{name:'Tib',color:'#f2b705'},{name:'Drock',color:'#e0352b'},{name:'Kuko',color:'#2f6fe0'}];
const NJ_COLORS=['#f2b705','#e0352b','#2f6fe0','#2e9e45','#8a4fd8','#ff7eb6','#f57c1f','#18b5b0','#f2f2f2','#2b2b2b'];
const NJ_POWERS=[{id:'stars',name:'Ninja Stars',icon:'✴️',cost:3,say:'Ninja stars!'},{id:'fast',name:'Super Fast',icon:'⚡',cost:3,time:7,say:'Super fast!'},
  {id:'invis',name:'Invisible',icon:'👻',cost:4,time:6,say:'Invisible!'},{id:'team',name:'Team Up',icon:'',cost:6,time:10,say:'Team up!'}];
const NJ_BOTS={bot:{col:'#9aa3ad',size:1,hp:1,spd:1},zip:{col:'#f57c1f',size:0.8,hp:1,spd:1},tank:{col:'#7a5bd0',size:1.3,hp:1,spd:1}}; // every robot: one hit, same speed
const NJ_LEVELS=10,NJ_HEARTS=10,NJ_PORTAL_HP=5;
function njData(){K.ninja=K.ninja||{sel:0,custom:[],best:1,won:0};return K.ninja}
function njList(){return NJ_TEAM.concat(njData().custom)}
function njShade(hex,k){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function njLight(hex){const n=parseInt(hex.slice(1),16);return (0.3*(n>>16)+0.59*(n>>8&255)+0.11*(n&255))>150}
function njCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h||w));return c}
function njRR(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
// a ninja, drawn once; robo=true is the "turned into a robot" version for game over
function njNinja(color,px,robo){
  const c=njCanvas(px),g=c.getContext('2d'),s=px;g.translate(s/2,s/2);
  const suit=robo?'#8f98a3':color,dark=robo?'#5b636d':njShade(color,-0.38),band=robo?'#ff3b3b':njLight(color)?'#1d2b4f':'#ffffff';
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,.43*s,.27*s,.06*s,0,0,7);g.fill();
  g.fillStyle=dark;njRR(g,-.21*s,.33*s,.15*s,.1*s,.04*s);g.fill();njRR(g,.06*s,.33*s,.15*s,.1*s,.04*s);g.fill();
  g.lineWidth=.03*s;g.strokeStyle=dark;g.fillStyle=suit;njRR(g,-.24*s,0,.48*s,.37*s,.12*s);g.fill();g.stroke();
  g.fillStyle=dark;g.fillRect(-.24*s,.16*s,.48*s,.06*s);
  g.fillStyle=suit;for(const x of [-.29,.29]){g.beginPath();g.arc(x*s,.13*s,.08*s,0,7);g.fill();g.stroke()}
  g.beginPath();g.arc(0,-.15*s,.27*s,0,7);g.fill();g.stroke();
  g.fillStyle=robo?'#2b3340':'#ffd9b3';njRR(g,-.19*s,-.21*s,.38*s,.13*s,.06*s);g.fill();
  if(robo){g.fillStyle='#ff3b3b';g.fillRect(-.13*s,-.175*s,.08*s,.05*s);g.fillRect(.05*s,-.175*s,.08*s,.05*s)}
  else{g.fillStyle='#1b1b1b';for(const x of [-.08,.08]){g.beginPath();g.ellipse(x*s,-.145*s,.035*s,.045*s,0,0,7);g.fill()}
    g.fillStyle='#fff';for(const x of [-.07,.09]){g.beginPath();g.arc(x*s,-.16*s,.012*s,0,7);g.fill()}}
  g.strokeStyle=band;g.lineWidth=.07*s;g.beginPath();g.arc(0,-.15*s,.25*s,Math.PI*1.12,Math.PI*1.88);g.stroke();
  g.lineWidth=.05*s;g.lineCap='round';g.beginPath();g.moveTo(.2*s,-.28*s);g.lineTo(.42*s,-.38*s);g.moveTo(.2*s,-.27*s);g.lineTo(.43*s,-.23*s);g.stroke();
  if(robo){g.strokeStyle='#5b636d';g.lineWidth=.03*s;g.beginPath();g.moveTo(0,-.42*s);g.lineTo(0,-.49*s);g.stroke();g.fillStyle='#ff3b3b';g.beginPath();g.arc(0,-.49*s,.04*s,0,7);g.fill()}
  return c;
}
function njRobot(type,px,sleep){
  const T=NJ_BOTS[type],c=njCanvas(px),g=c.getContext('2d'),s=px;g.translate(s/2,s/2);
  const col=T.col,dark=njShade(col,-0.42),lite=njShade(col,0.18),eye=sleep?'#5b636d':type==='zip'?'#ffd23f':'#ff3b3b';
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,.43*s,.3*s,.06*s,0,0,7);g.fill();
  g.fillStyle='#2b2f3a';njRR(g,-.3*s,.3*s,.6*s,.12*s,.06*s);g.fill();
  g.lineWidth=.03*s;g.strokeStyle=dark;g.fillStyle=col;njRR(g,-.29*s,-.04*s,.58*s,.38*s,.09*s);g.fill();g.stroke();
  if(type==='tank'){g.fillStyle=dark;njRR(g,-.4*s,-.04*s,.14*s,.2*s,.05*s);g.fill();njRR(g,.26*s,-.04*s,.14*s,.2*s,.05*s);g.fill()}
  g.fillStyle=dark;for(const x of [-.17,0,.17]){g.beginPath();g.arc(x*s,.17*s,.035*s,0,7);g.fill()}
  g.fillStyle=lite;njRR(g,-.25*s,-.38*s,.5*s,.32*s,.1*s);g.fill();g.stroke();
  g.fillStyle='#1d2b4f';njRR(g,-.19*s,-.32*s,.38*s,.2*s,.06*s);g.fill();
  g.fillStyle=eye;
  if(sleep){g.fillRect(-.13*s,-.225*s,.08*s,.02*s);g.fillRect(.05*s,-.225*s,.08*s,.02*s)}
  else if(type==='zip'){njRR(g,-.14*s,-.26*s,.28*s,.07*s,.03*s);g.fill()}
  else for(const x of [-.085,.085]){g.beginPath();g.arc(x*s,-.22*s,.05*s,0,7);g.fill()}
  g.strokeStyle=dark;g.beginPath();g.moveTo(0,-.38*s);g.lineTo(0,-.46*s);g.stroke();g.fillStyle=sleep?'#5b636d':eye;g.beginPath();g.arc(0,-.47*s,.04*s,0,7);g.fill();
  return c;
}
function njCoin(px){const c=njCanvas(px),g=c.getContext('2d'),r=px/2;g.translate(r,r);
  g.fillStyle='#f7c62f';g.strokeStyle='#b8860b';g.lineWidth=px*.07;g.beginPath();g.arc(0,0,r*.85,0,7);g.fill();g.stroke();
  g.lineWidth=px*.05;g.strokeStyle='#e0a91a';g.beginPath();g.arc(0,0,r*.55,0,7);g.stroke();
  g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=px*.07;g.beginPath();g.arc(0,0,r*.65,Math.PI*1.1,Math.PI*1.45);g.stroke();return c}
function njPortalDisc(px,a,b){const c=njCanvas(px),g=c.getContext('2d'),r=px/2;g.translate(r,r);
  const gr=g.createRadialGradient(0,0,r*.05,0,0,r);gr.addColorStop(0,'#ffffff');gr.addColorStop(.25,a);gr.addColorStop(.85,b);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.55)';g.lineCap='round';
  for(let k=0;k<4;k++){g.lineWidth=px*.03;g.beginPath();g.arc(0,0,r*(.35+k*.13),k*1.6,k*1.6+2.2);g.stroke()}return c}
function njShuriken(px){const c=njCanvas(px),g=c.getContext('2d'),r=px/2;g.translate(r,r);g.fillStyle='#dfe6ee';g.strokeStyle='#5b636d';g.lineWidth=px*.06;
  g.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rr=k%2?r*.32:r*.95;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.stroke();
  g.fillStyle='#5b636d';g.beginPath();g.arc(0,0,r*.12,0,7);g.fill();return c}
function njAvatar(n,px){return njNinja(n.color,px||96).toDataURL()}
const njTeamIcon=()=>`<span class="njteam">${NJ_TEAM.map(n=>`<i style="background:${n.color}"></i>`).join('')}</span>`;

/* ---------- menu, picker and ninja maker ---------- */
function playNinja(){
  if(location.hash!=='#ninja')return; // a late timer from a game you already left
  const D=njData(),list=njList();if(!list[D.sel])D.sel=0;
  setHeader('Ninja Portal','Tib, Drock & Kuko vs the robots');
  view.innerHTML=`<div class="njmenu">
    <p class="prompt">Pick your ninja!</p>
    <div class="njpick">${list.map((n,i)=>`<button class="njcard" data-i="${i}" aria-pressed="${i===D.sel}"><img src="${njAvatar(n)}" alt=""><b>${esc(n.name)}</b>${i>=NJ_TEAM.length?`<span class="njdel" data-del="${i}" role="button" aria-label="Remove ${esc(n.name)}">✕</span>`:''}</button>`).join('')}
      <button class="njcard njnew" id="njMake"><span>＋</span><b>Make a ninja</b></button></div>
    <div class="row"><button class="pbtn go" id="njPlay">▶ Play level 1</button>${D.best>1?`<button class="pbtn" id="njCont">Keep going: level ${D.best}</button>`:''}</div>
    <div class="panel njhow"><b>How to play</b><ul>
      <li>👆 Slide your finger to move your ninja. Dodge the robots!</li>
      <li><i class="njcoin"></i> Grab coins to buy power-ups at the bottom.</li>
      <li>✴️ Ninja stars hit the robots first. When no robots are out, they hit the <b>middle portal</b>. 5 hits shuts it down!</li>
      <li>🌀 Then run into a <b>side portal</b> to go to the next level. There are 10 levels!</li></ul></div></div>`;
  view.querySelectorAll('.njcard[data-i]').forEach(b=>b.onclick=e=>{
    const del=e.target.closest('[data-del]');
    if(del){const i=+del.dataset.del;if(del.dataset.arm!=='1'){del.dataset.arm='1';del.textContent='Sure?';return}D.custom.splice(i-NJ_TEAM.length,1);D.sel=0;save();sfx.no();return playNinja()}
    D.sel=+b.dataset.i;save();sfx.tap();speakNow(list[D.sel].name+'!');view.querySelectorAll('.njcard[data-i]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#njMake').onclick=()=>{sfx.tap();njMaker()};
  $('#njPlay').onclick=()=>njStart(1);
  const cont=$('#njCont');if(cont)cont.onclick=()=>njStart(D.best);
}
function njMaker(){
  const D=njData();let color=NJ_COLORS[rnd(3,NJ_COLORS.length-1)];
  setHeader('Ninja Portal','Make a ninja');
  view.innerHTML=`<div class="njmenu"><p class="prompt">Make a new ninja!</p>
    <div class="njmaker"><img id="njPrev" alt="Your new ninja">
      <div class="njform"><label>Name<input id="njName" class="gin" maxlength="12" placeholder="Ninja name" autocomplete="off" autocapitalize="words"></label>

}

/* ---------- the game ---------- */
function njStart(level,carry){
  if(location.hash!=='#ninja')return;
  const D=njData(),me=njList()[D.sel]||NJ_TEAM[0];
  const mates=NJ_TEAM.filter(n=>n.name!==me.name).slice(0,2);
  const S=canvasGame('Ninja Portal',`${esc(me.name)} · Level ${level} of ${NJ_LEVELS}`,
    `<span>❤️ <b id="njH">${NJ_HEARTS}</b></span><span><i class="njcoin"></i> <b id="njC">0</b></span><span>🌀 Portal <b id="njP">${NJ_PORTAL_HP}</b></span>`);
  // slow tablets: draw at a lower resolution than the screen (it still looks fine for cartoon art)
  const box=S.box,cv=S.cv,ctx=S.ctx;
  S.fit=()=>{const r=box.getBoundingClientRect(),dpr=Math.min(1.25,devicePixelRatio||1);S.W=r.width;S.H=r.height;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);S.onfit&&S.onfit()};
  const bar=document.createElement('div');bar.className='njbar';
  bar.innerHTML=NJ_POWERS.map(p=>`<button class="njpw" data-p="${p.id}" disabled><span class="njpi">${p.id==='team'?njTeamIcon():p.icon}</span><b>${p.name}</b><small><i class="njcoin"></i>${p.cost}</small><u></u></button>`).join('');
  view.querySelector('.cgame').appendChild(bar);
  const L=level,G={state:'play',t:0,hearts:carry?carry.hearts:NJ_HEARTS,coins:carry?carry.coins:0,
    tib:{x:0,y:0,ax:0,ay:0,hurt:0,flip:false,trail:[]},bots:[],coinsOn:[],shots:[],poofs:[],texts:[],sparks:[],mates:[],
    portal:{hp:NJ_PORTAL_HP,alive:true,spawn:1.6,flash:0},coinT:0.5,throwT:0,ammo:0,fast:0,invis:0,team:0,shake:0};
  if(/[?&]bot\b/.test(location.search))window.__njG=G;
  const P={spawnEvery:Math.max(1.4,3.4-L*0.2),maxBots:Math.min(8,1+Math.ceil(L*0.7)),speed:0.85+L*0.08,zip:L>=4?0.25:0,tank:L>=6?0.2:0};
  // sprites, rebuilt only when the screen size changes
  let U=40,SP={},bg=null;
  const build=()=>{U=Math.max(30,Math.min(64,Math.min(S.W,S.H)*0.085));const px=Math.round(U*1.6);
    SP={me:njNinja(me.color,px),mates:mates.map(m=>njNinja(m.color,px)),coin:njCoin(Math.round(U*0.62)),shur:njShuriken(Math.round(U*0.5)),
      portal:njPortalDisc(Math.round(U*3),'#ff4fd8','#5b2bbf'),side:njPortalDisc(Math.round(U*2.2),'#7ff6ff','#1f6fd0'),sideOff:njPortalDisc(Math.round(U*2.2),'#8f98a3','#2b2f3a'),bots:{},sleep:{}};
    for(const k in NJ_BOTS){SP.bots[k]=njRobot(k,Math.round(U*1.6*NJ_BOTS[k].size));SP.sleep[k]=njRobot(k,Math.round(U*1.6*NJ_BOTS[k].size),true)}
    bg=njCanvas(S.W,S.H);const g=bg.getContext('2d');g.fillStyle='#1a1e3a';g.fillRect(0,0,S.W,S.H);
    const step=U*1.5;g.strokeStyle='#262b52';g.lineWidth=2;for(let x=step/2;x<S.W;x+=step){g.beginPath();g.moveTo(x,0);g.lineTo(x,S.H);g.stroke()}
    for(let y=step/2;y<S.H;y+=step){g.beginPath();g.moveTo(0,y);g.lineTo(S.W,y);g.stroke()}
    g.fillStyle='#2f3563';for(let x=step/2;x<S.W;x+=step)for(let y=step/2;y<S.H;y+=step){g.beginPath();g.arc(x,y,2.5,0,7);g.fill()}
    g.strokeStyle='#ffd23f';g.lineWidth=6;g.setLineDash([16,12]);g.strokeRect(5,5,S.W-10,S.H-10);g.setLineDash([]);
    if(!G.tib.x){G.tib.x=G.tib.ax=S.W/2;G.tib.y=G.tib.ay=S.H*0.85}

/* =========================================================
   TIMES-TABLE HELP: shows *how* to work out a fact with dot arrays, the way school teaches it.
   Over 5: split into a 5s fact + a small fact (6×7 = 6×5 + 6×2). ×9: ×10 then take one group away.
   ×10: add a zero. Small facts: skip-count the rows. After a few helps on the same fact it gives a hint first.
   ========================================================= */
function multSteps(x,y){
  const s=Math.min(x,y),b=Math.max(x,y),ans=x*y,R=s,C=b,st=[];
  // each step: text, how to color the dots, and a running equation line
  if(s===1){st.push({t:`One group of ${b} is just ${b}.`,paint:()=>'L',eq:[`1 × ${b} = ${b}`]});return{R,C,st}}
  if(b===10){
    st.push({t:`${s} rows of 10 dots.`,paint:()=>'N'});
    st.push({t:`Count by tens: ${[...Array(s)].map((_,i)=>(i+1)*10).join(', ')}.`,paint:()=>'L',eq:[`${s} × 10 = ${ans}`]});
    st.push({t:`Trick: anything times 10, just put a zero on the end! ${s} → ${ans}.`,paint:()=>'L',eq:[`${s} × 10 = ${ans}`]});return{R,C,st}}
  if(b===9){
    const R2=s,C2=10;
    st.push({t:`Nine is one less than ten. Let's do ${s} × 10 first.`,paint:()=>'N',C:10});
    st.push({t:`${s} × 10 = ${s*10}. (Just add a zero!)`,paint:()=>'L',C:10,eq:[`${s} × 10 = ${s*10}`]});
    st.push({t:`We only wanted 9 in each row, so take away one column of ${s}.`,paint:(r,c)=>c===9?'G':'L',C:10,eq:[`${s} × 10 = ${s*10}`,`− ${s}`]});
    st.push({t:`${s*10} take away ${s} is ${ans}.`,paint:(r,c)=>c===9?'G':'L',C:10,eq:[`${s} × 10 = ${s*10}`,`− ${s}`,`= ${ans}`]});
    return{R:R2,C:C2,st}}
  if(b<=5){
    st.push({t:`${s} rows with ${b} dots in each row.`,paint:()=>'N'});
    for(let r=1;r<=s;r++)st.push({t:`Count by ${b}s: ${[...Array(r)].map((_,i)=>(i+1)*b).join(', ')}${r===s?'!':'…'}`,paint:(rr)=>rr<r?'K':'N',eq:r===s?[`${s} × ${b} = ${ans}`]:null});
    return{R,C,st}}
  // over 5: split the long side into a part you know (5, or 10 for 11 and 12) and the rest
  const L=b>10?10:5,Rt=b-L,pa=s*L,pb=s*Rt;
  const small=Rt===1?`${s} × 1 = ${pb}. Just one more column!`:Rt===2?`${s} × 2 = ${pb}. That's just doubling ${s}!`:`${s} × ${Rt} = ${pb}.`;
  st.push({t:`${s} rows of ${b}. That's a lot to count! Let's split it into ${L} and ${Rt}.`,paint:(r,c)=>c<L?'L':'R'});
  st.push({t:`Blue part: ${s} × ${L} = ${pa}. ${L===5?'You know your 5s!':'Just add a zero!'}`,paint:(r,c)=>c<L?'L':'n',eq:[`${s} × ${L} = ${pa}`]});
  st.push({t:`Orange part: ${small}`,paint:(r,c)=>c<L?'l':'R',eq:[`${s} × ${L} = ${pa}`,`${s} × ${Rt} = ${pb}`]});

function timesRun(t){

          if(!helped){streak++;if(streak%3===0)addStars(1,b,'times')}
          $('#ttn').textContent=helped?'Nice! Next time, try it without help.':pick(['Great job!','You got it!','Nice!','Yes!']);await fsleep(800);busy=false;ask()}
        else{b.classList.add('no');sfx.no();streak=0;$('#ttn').innerHTML=`Not quite. <button class="linkbtn" id="ttSee">See how ▶</button>`;
          $('#ttSee').onclick=()=>{helped=true;multHelp(Q.x,Q.y)}}};box.appendChild(b)});

}

function mxStar(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;p.push((cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1))}return p.join(' ')}
const MX_SHAPES={circle:'<circle cx="150" cy="140" r="102"/>',
  heart:'<path d="M150 242 C50 182 28 122 60 82 C90 46 135 56 150 92 C165 56 210 46 240 82 C272 122 250 182 150 242Z"/>',
  star:`<polygon points="${mxStar(150,148,118,54)}"/>`,
  flower:[0,1,2,3,4,5].map(i=>`<circle cx="${(150+62*Math.cos(i*Math.PI/3)).toFixed(1)}" cy="${(140+62*Math.sin(i*Math.PI/3)).toFixed(1)}" r="46"/>`).join('')+'<circle cx="150" cy="140" r="66"/>'};

/* ---------- pots and what you made, as SVG ---------- */
function mxPotSVG(st){const k=MX_ST[st].pot,u=++mxU;
  const body=k==='cauldron'?'#2b2b3a':k==='tub'?'#d7f0ff':'#9fd3f0',rim=k==='cauldron'?'#4a4a66':k==='tub'?'#a9d8f5':'#6fb6e0';
  return `<svg class="mxpot" viewBox="0 0 300 280" id="mxPot">
   <defs><clipPath id="mxc${u}"><path d="M50 92 Q50 238 150 244 Q250 238 250 92 Z"/></clipPath></defs>
   ${k==='cauldron'?`<g class="mxfire"><path d="M105 280 Q118 236 134 262 Q150 222 166 262 Q182 236 195 280Z" fill="#ff9a2e"/><path d="M128 280 Q140 252 150 266 Q160 252 172 280Z" fill="#ffd23f"/></g>
     <rect x="70" y="232" width="14" height="34" rx="5" fill="#2b2b3a"/><rect x="216" y="232" width="14" height="34" rx="5" fill="#2b2b3a"/>`:''}
   <path d="M40 88 Q40 252 150 258 Q260 252 260 88 Z" fill="${body}"/>
   <g clip-path="url(#mxc${u})"><g id="mxLiq"></g>
     <g id="mxSwirl" opacity="0"><path d="M150 178 m-6 0 a6 6 0 1 1 12 0 a14 14 0 1 1 -28 0 a24 24 0 1 1 48 0 a36 36 0 1 1 -72 0 a50 50 0 1 1 100 0 a66 66 0 1 1 -132 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".4"/></g>
     <g id="mxFx"></g></g>
   <ellipse cx="150" cy="88" rx="110" ry="17" fill="none" stroke="${rim}" stroke-width="12"/>
   ${k!=='cauldron'?'<path d="M62 140 Q68 196 106 222" stroke="#fff" stroke-width="8" fill="none" opacity=".45" stroke-linecap="round"/>':''}</svg>`}
function mxFxSVG(fx,top,bot,seed){const r=mxRng(seed||7);let s='';const y=()=>top+8+r()*Math.max(4,bot-top-16),x=()=>70+r()*160;
  if(fx.includes('glitter'))for(let i=0;i<8;i++)s+=`<text x="${x()}" y="${y()}" font-size="${14+r()*10}" text-anchor="middle" class="mxtw" style="animation-delay:${(r()*1.5).toFixed(2)}s">✨</text>`;
  if(fx.includes('bubbles'))for(let i=0;i<6;i++)s+=`<circle cx="${x()}" cy="${bot-6}" r="${5+r()*7}" fill="#fff" opacity=".55" class="mxbub" style="animation-delay:${(r()*2).toFixed(2)}s"/>`;
  if(fx.includes('fluffy'))for(let i=0;i<7;i++)s+=`<circle cx="${x()}" cy="${y()}" r="${10+r()*10}" fill="#fff" opacity=".5"/>`;
  if(fx.includes('chips'))for(let i=0;i<9;i++)s+=`<ellipse cx="${x()}" cy="${y()}" rx="6" ry="5" fill="#4a2a14"/>`;
  return s}
function mxSpr(x,y,seed){const r=mxRng(seed);let s='';for(let i=0;i<9;i++)s+=`<rect x="${(x-22+r()*44).toFixed(1)}" y="${(y-18+r()*36).toFixed(1)}" width="11" height="4" rx="2" fill="${MX_SPR[i%6]}" transform="rotate(${(r()*180).toFixed(0)} ${x} ${y})"/>`;return s}
function mxTops(it,party){return (it.tops||[]).map((t,i)=>t.k==='🌈'?mxSpr(t.x,t.y,t.s):t.k==='candle'
   ?`<g class="mxcdl" data-c="${i}"><rect x="${t.x-7}" y="${t.y-44}" width="14" height="44" rx="5" fill="#8fd0ff"/><rect x="${t.x-7}" y="${t.y-32}" width="14" height="6" fill="#fff"/><rect x="${t.x-7}" y="${t.y-16}" width="14" height="6" fill="#fff"/>
      ${!party||!party.out||!party.out.has(i)?`<ellipse class="mxflame" cx="${t.x}" cy="${t.y-56}" rx="8" ry="13" fill="#ffb32b"/><ellipse cx="${t.x}" cy="${t.y-52}" rx="4" ry="7" fill="#fff3a0"/>`:''}<rect x="${t.x-22}" y="${t.y-80}" width="44" height="84" fill="transparent"/></g>`
   :`<text x="${t.x}" y="${t.y}" font-size="34" text-anchor="middle" dominant-baseline="central">${t.k}</text>`).join('')}
function mxSVG(it,opt={}){const u=++mxU,c=it.color;
  if(it.st==='potion'){const B='M128 50 h44 v52 Q238 124 236 188 Q232 258 150 260 Q68 258 64 188 Q62 124 128 102 Z';
    return `<svg class="mxres" viewBox="0 0 300 280"><defs><clipPath id="pb${u}"><path d="${B}"/></clipPath></defs>
      <path d="${B}" fill="#eef8ff" stroke="#9cc9e8" stroke-width="5"/>
      <g clip-path="url(#pb${u})"><rect x="40" y="128" width="220" height="140" fill="${c}"/><ellipse cx="150" cy="128" rx="110" ry="8" fill="${mxLerp(c,'#ffffff',.35)}"/>${mxFxSVG(it.fx,128,256,u)}</g>
      <rect x="126" y="24" width="48" height="32" rx="7" fill="#b07a4a"/><path d="M96 150 Q88 200 114 232" stroke="#fff" stroke-width="9" fill="none" opacity=".5" stroke-linecap="round"/></svg>`}
  if(it.st==='slime')return `<svg class="mxres" viewBox="0 0 300 280"><g class="mxblob"><path d="M58 214 Q30 140 100 120 Q140 70 196 110 Q268 118 250 204 Q246 250 150 248 Q68 250 58 214Z" fill="${c}"/>
      <ellipse cx="112" cy="140" rx="26" ry="11" fill="#fff" opacity=".45" transform="rotate(-25 112 140)"/>${mxFxSVG(it.fx,120,236,u)}
      <circle cx="125" cy="178" r="15" fill="#fff"/><circle cx="185" cy="178" r="15" fill="#fff"/><circle cx="128" cy="182" r="7" fill="#222"/><circle cx="182" cy="182" r="7" fill="#222"/>
      <path d="M134 208 Q155 226 176 208" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/></g></svg>`;
  if(it.st==='cake'){const side=mxLerp(c,'#e3a85a',.3),f=it.frost||'#ffc2dc';let drips='';for(let x=55,i=0;x<245;x+=19,i++)drips+=`<path d="M${x} 140 v${i%2?26:14} q9.5 12 19 0 v-${i%2?26:14}Z" fill="${f}"/>`;
    return `<svg class="mxres" viewBox="0 0 300 280"><ellipse cx="150" cy="248" rx="135" ry="20" fill="#e8eef7"/><ellipse cx="150" cy="240" rx="95" ry="13" fill="${mxLerp(side,'#000000',.12)}"/>
      <rect x="55" y="140" width="190" height="100" fill="${side}"/><rect x="55" y="186" width="190" height="9" fill="${f}" opacity=".85"/>${drips}<ellipse cx="150" cy="140" rx="95" ry="22" fill="${f}"/>${mxTops(it,opt.party)}</svg>`}
  // cookie
  const bk=mxLerp(c,'#d9a25b',.45),sh=MX_SHAPES[it.shape||'circle'],bites=opt.bites||[];
  return `<svg class="mxres" viewBox="0 0 300 280"><defs><mask id="bm${u}"><rect width="300" height="280" fill="#fff"/>${bites.map(b=>`<circle cx="${b.x}" cy="${b.y}" r="38" fill="#000"/>`).join('')}</mask></defs>
    <g mask="url(#bm${u})"><g fill="${mxLerp(bk,'#000000',.22)}" transform="translate(3 6)">${sh}</g><g fill="${bk}">${sh}</g>
    ${it.frost&&it.frost!=='none'?`<g fill="${it.frost}" transform="translate(150 142) scale(.84) translate(-150 -142)">${sh}</g>`:''}
    ${it.fx.includes('chips')?[[-50,-30],[20,-55],[55,10],[-15,30],[-60,40],[35,60],[0,-10],[70,-40],[-35,-70]].map(([dx,dy])=>`<ellipse cx="${150+dx}" cy="${140+dy}" rx="8" ry="6" fill="#4a2a14"/>`).join(''):''}
    ${mxTops(it)}</g></svg>`}

/* ---------- pick what to make + the shelf ---------- */
function playMix(){
  if(location.hash!=='#mix')return;
  K.mix=K.mix||{shelf:[]};setHeader('Mix & Make','Potions, slime and treats');
  view.innerHTML=`<div class="board"><p class="prompt">What do you want to make?</p>
    <div class="mxpick">${Object.entries(MX_ST).map(([k,s])=>`<button data-s="${k}" style="--c:${s.col}" aria-label="${s.name}"><span>${s.em}</span><b>${s.name}</b></button>`).join('')}</div>
    ${K.mix.shelf.length?`<p class="mxlab">Your shelf</p><div class="mxshelf">${K.mix.shelf.map((it,i)=>`<button data-i="${i}" aria-label="${it.name}">${mxSVG(it)}</button>`).join('')}</div>`:''}</div>`;
  say('What do you want to make?');
  view.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sfx.tap();mxMix(b.dataset.s)});
  view.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sfx.tap();mxPlay(K.mix.shelf[+b.dataset.i],false)});
}
function mxMix(st){
  const S=MX_ST[st],tok=loopToken,M={layers:[],fx:new Set(),stirred:false,pend:0,prog:0,orig:[]};
  setHeader(S.name,'Tap to pour. Stir with your finger!');
  view.innerHTML=`<div class="mxwrap"><div class="mxstage" id="mxStage">${mxPotSVG(st)}<div class="mxspoon" id="mxSpoon">🥄</div></div>
    <div class="mxside"><div class="mxing">${S.ing.map((g,i)=>`<button data-g="${i}" aria-label="${g[2]}">${g[0]}</button>`).join('')}</div>
      <div class="row"><button class="pbtn" id="mxBack" aria-label="Back">◀</button><button class="pbtn" id="mxDump">🗑️ Start over</button></div>
      <button class="pbtn go mxdone" id="mxDone" hidden>All done! ✓</button></div></div>`;
  say(S.hello);
  const H=19,svg=$('#mxPot'),spoon=$('#mxSpoon'),stage=$('#mxStage'),word=S.pot==='cauldron'?'pot':S.pot;
  const draw=()=>{const n=M.layers.length,top=244-n*H;
    $('#mxLiq').innerHTML=M.layers.map((c,i)=>`<rect x="40" y="${244-(i+1)*H}" width="220" height="${H+(i===n-1?3:1)}" fill="${c}"/>`).join('')+(n?`<ellipse cx="150" cy="${top}" rx="105" ry="5" fill="#fff" opacity=".18"/>`:'');
    $('#mxFx').innerHTML=n?mxFxSVG([...M.fx],top,244,n*31+5):'';
    $('#mxDone').hidden=!(M.stirred&&n>=2);
    spoon.classList.toggle('hint',n>=2&&!M.stirred)};
  view.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=S.ing[+b.dataset.g];
    if(M.layers.length+M.pend>=8){sfx.no();say(`The ${word} is full! Stir it up!`);return}
    M.pend++;const a=b.getBoundingClientRect(),p=svg.getBoundingClientRect(),d=document.createElement('span');d.className='mxdrop';d.textContent=g[0];
    d.style.left=(a.left+a.width/2)+'px';d.style.top=(a.top+a.height/2)+'px';document.body.appendChild(d);
    requestAnimationFrame(()=>{d.style.transform=`translate(${p.left+p.width/2-(a.left+a.width/2)}px,${p.top+p.height*0.3-(a.top+a.height/2)}px) scale(.6) rotate(200deg)`;d.style.opacity='.4'});
    setTimeout(()=>{d.remove();if(tok!==loopToken)return;M.pend--;
      if(M.stirred)M.orig=M.layers.slice();M.orig.push(g[1]);M.layers.push(g[1]);if(g[3])M.fx.add(g[3]);M.stirred=false;M.prog=0;M.dist=0;
      tone([[520+rnd(0,200),0,.06],[300,.05,.12]],'sine',0.07);say(g[2]);draw()},460)});
  $('#mxDump').onclick=()=>{M.layers=[];M.orig=[];M.fx.clear();M.stirred=false;M.prog=0;tone([[400,0,.1],[200,.08,.2]],'triangle',0.06);draw()};
  $('#mxBack').onclick=()=>playMix();
  // stirring: move your finger around in the pot; colors swirl toward the mix
  let down=false,last=null,ang=0;M.dist=0;
  const pt=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  svg.addEventListener('pointerdown',e=>{if(!M.layers.length){say(`Put something in the ${word} first!`);return}down=true;last=pt(e);try{svg.setPointerCapture(e.pointerId)}catch(_){}
    spoon.classList.remove('hint');spoon.classList.add('on');spoon.style.left=last.x+'px';spoon.style.top=last.y+'px';$('#mxSwirl').setAttribute('opacity','1')});
  svg.addEventListener('pointermove',e=>{if(!down)return;const q=pt(e),dd=Math.hypot(q.x-last.x,q.y-last.y);last=q;spoon.style.left=q.x+'px';spoon.style.top=q.y+'px';
    if(M.stirred||dd<1)return;const before=Math.floor(M.dist/180);M.dist+=dd;ang=(ang+dd*1.2)%360;$('#mxSwirl').setAttribute('transform',`rotate(${ang} 150 178)`);
    if(Math.floor(M.dist/180)>before)tone([[220+rnd(0,60),0,.05]],'sine',0.03);
    const blend=mxBlend(M.orig);M.prog=Math.min(1,M.dist/1400);
    $('#mxLiq').querySelectorAll('rect').forEach((r,i)=>r.setAttribute('fill',mxLerp(M.orig[i],blend,M.prog)));
    if(M.prog>=1){M.stirred=true;M.layers=M.orig.map(()=>blend);sfx.up();sparkleOver(svg);say(M.layers.length>=2?'All mixed! Tap all done, or add more.':'Stirred!');draw()}},{passive:true});
  const up=()=>{if(!down)return;down=false;spoon.classList.remove('on');const sw=$('#mxSwirl');sw&&sw.setAttribute('opacity','0')};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  $('#mxDone').onclick=()=>{sfx.tap();const it={st,color:M.layers[0],fx:[...M.fx]};
    if(st==='potion'){it.name=`${mxName(it.color)} ${pick(['Sparkle','Giggle','Fairy','Bubble','Dragon','Bouncy','Sleepy','Rainbow'])} Potion`;mxPlay(it,true)}
    else if(st==='slime'){it.name=`${mxName(it.color)} ${it.fx.includes('fluffy')?'Fluffy':it.fx.includes('glitter')?'Glitter':'Squishy'} Slime`;mxPlay(it,true)}
    else if(st==='cake')mxOven(it,()=>mxDeco(it));
    else mxCutter(it)};
  draw();
}
function mxCutter(it){setHeader('Cookie cutters','Pick a shape');
  const raw=mxLerp(it.color,'#f2e2c0',.2);
  view.innerHTML=`<div class="board"><p class="prompt">Pick a cookie shape</p><div class="mxpick">${Object.keys(MX_SHAPES).map(k=>`<button data-k="${k}" aria-label="${MX_SHAPE_NAME[k]}"><svg viewBox="0 0 300 280" width="96" height="90"><g fill="${raw}">${MX_SHAPES[k]}</g></svg><b>${MX_SHAPE_NAME[k]}</b></button>`).join('')}</div></div>`;
  say('Pick a cookie shape!');
  view.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{it.shape=b.dataset.k;tone([[700,0,.06],[500,.06,.1]],'square',0.04);say(MX_SHAPE_NAME[it.shape]+'!');mxOven(it,()=>mxDeco(it))})}
function mxOven(it,next){const tok=loopToken,cake=it.st==='cake';setHeader('Into the oven!','Wait for the ding');
  const raw=mxLerp(it.color,'#f2e2c0',.15),food=cake?`<rect x="60" y="150" width="180" height="80" rx="8" fill="#9aa1b0"/><rect x="70" y="140" width="160" height="70" rx="8" fill="${raw}"/>`:`<g fill="${raw}">${MX_SHAPES[it.shape]}</g>`;
  view.innerHTML=`<div class="mxoven"><svg viewBox="0 0 300 270" class="mxov"><rect x="20" y="20" width="260" height="236" rx="22" fill="#d9dde6"/><rect x="38" y="30" width="224" height="32" rx="8" fill="#b9bfcc"/>
    ${[78,114,150,186,222].map(x=>`<circle cx="${x}" cy="46" r="9" fill="#7d8597"/>`).join('')}<rect x="44" y="76" width="212" height="160" rx="14" fill="#3a2c2c"/>
    <rect id="mxGlow" x="52" y="84" width="196" height="144" rx="10" fill="#ff8a2a" opacity=".2"/><g transform="translate(150 168) scale(.36) translate(-150 -150)">${food}</g>
    <rect x="70" y="242" width="160" height="10" rx="5" fill="#9aa1b0"/></svg><div class="mxcount" id="mxCount">3</div></div>`;
  say('Into the oven! Let\'s count.');let n=3;
  const tick=()=>{if(tok!==loopToken)return;const el=$('#mxCount');if(n>0){el.textContent=n;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');$('#mxGlow').setAttribute('opacity',(.2+(3-n)*.2).toFixed(2));
      tone([[880,0,.05]],'square',0.04);speakNow(String(n));n--;setTimeout(tick,1100)}
    else{el.textContent='🔔';tone([[1568,0,.4],[2093,.08,.7]],'sine',0.09);say("Ding! It's ready!");setTimeout(()=>{if(tok===loopToken)next()},1100)}};
  setTimeout(tick,1200)}
function mxDeco(it){const cake=it.st==='cake';it.tops=it.tops||[];if(!it.frost)it.frost=cake?'#ffc2dc':'none';
  const FROST=cake?['#ffc2dc','#ffffff','#7a4a2a','#bfe3ff','#c9f2c0','#e6d2ff','#fff1a8']:['none','#ffffff','#ffc2dc','#bfe3ff','#c9f2c0','#e6d2ff','#7a4a2a'];
  const TOPS=cake?['🍓','🍒','🌸','⭐','🍬','🌈','candle']:['🌈','🍬','⭐','💗','🍫','🌸'];let cur=cake?'🍓':'🌈';
  setHeader(cake?'Decorate your cake':'Decorate your cookie','Pick a topping, then tap to put it on');
  view.innerHTML=`<div class="mxwrap"><div class="mxstage" id="mxCv"></div><div class="mxside">
    <p class="mxlab">${cake?'Frosting':'Icing'}</p><div class="mxsw">${FROST.map(f=>`<button data-f="${f}" style="background:${f==='none'?'#fff':f}" aria-label="${f==='none'?'No icing':'Color'}">${f==='none'?'🚫':''}</button>`).join('')}</div>
    <p class="mxlab">Toppings</p><div class="mxtops">${TOPS.map(t=>`<button data-t="${t}" aria-label="Topping">${t==='candle'?'🕯️':t==='🌈'?'<i class="mxsprb"></i>':t}</button>`).join('')}</div>
    <div class="row"><button class="pbtn" id="mxClr">🧽 Clean off</button></div><button class="pbtn go mxdone" id="mxFin">All done! ✓</button></div></div>`;
  say(cake?'Pick a frosting color, then add toppings!':'Pick icing, then add sprinkles!');
  const draw=()=>{$('#mxCv').innerHTML=mxSVG(it);view.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===it.frost));view.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===cur))};
  view.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{it.frost=b.dataset.f;tone([[660,0,.06],[990,.05,.1]],'sine',0.06);draw()});
  view.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cur=b.dataset.t;sfx.tap();say(cur==='candle'?'Candles!':cur==='🌈'?'Sprinkles!':'');draw()});
  $('#mxClr').onclick=()=>{it.tops=[];tone([[400,0,.1],[300,.08,.15]],'triangle',0.05);draw()};
  $('#mxCv').addEventListener('pointerdown',e=>{const s=$('#mxCv svg');if(!s)return;const P=s.createSVGPoint();P.x=e.clientX;P.y=e.clientY;const q=P.matrixTransform(s.getScreenCTM().inverse());
    let x=Math.round(q.x),y=Math.round(q.y);
    if(cake){if(x<60||x>240||y<100||y>236)return;if(cur==='candle')y=Math.min(Math.max(y,128),150)}else if(Math.hypot(x-150,y-142)>118)return;
    if(it.tops.length>=30){say("That's a lot of toppings!");return}
    it.tops.push({k:cur,x,y,s:rnd(1,1e6)});tone([[700+rnd(0,300),0,.06]],'sine',0.07);draw()});
  $('#mxFin').onclick=()=>{it.name=cake?`${mxName(mxLerp(it.color,'#e3a85a',.3))} ${pick(['Birthday','Party','Princess','Yummy'])} Cake`:`${MX_SHAPE_NAME[it.shape]} Cookie`;mxPlay(it,true)};
  draw()}

const MX_MAGIC=[['🦄','You turned into a unicorn!'],['🐸','Ribbit! You turned into a frog!'],['🐱','Meow! You turned into a kitty!'],['🧚','You turned into a fairy!'],['🦖','Roar! You turned into a dinosaur!'],['🎈','Whee! You are floating like a balloon!'],['🐶','Woof! You turned into a puppy!'],['👸','You turned into a princess!']];
function mxPlay(it,fresh){const tok=loopToken;
  if(fresh){K.mix=K.mix||{shelf:[]};K.mix.shelf.unshift(JSON.parse(JSON.stringify(it)));K.mix.shelf=K.mix.shelf.slice(0,12);save()}
  setHeader(it.name,'');
  const hint={potion:'Drink it to see what happens!',slime:'Poke it! Stretch it!',cake:(it.tops||[]).some(t=>t.k==='candle')?'Tap the candles to blow them out!':'Tap the cake for a bite of fun!',cookie:'Tap the cookie to take a bite!'}[it.st];
  view.innerHTML=`<div class="mxwrap"><div class="mxstage mxplay" id="mxCv"></div><div class="mxside"><h2 class="mxname">${it.name}</h2><p class="note" style="text-align:center">${hint}</p>
    <div class="row">${it.st==='potion'?'<button class="pbtn go mxdone" id="mxAct">🪄 Drink it!</button>':it.st==='cake'?'<button class="pbtn go mxdone" id="mxAct">🎵 Sing</button>':it.st==='cookie'?'<button class="pbtn mxdone" id="mxAct" hidden>🍪 Another one!</button>':''}</div>
    <div class="row"><button class="pbtn" id="mxNew">✨ Make something new</button></div></div></div>`;

/* =========================================================
   SURPRISES FROM HOME: news.json (next to the app on the website) lists one-time messages,
   like a Tooth Fairy visit. Each one shows once per tablet, only inside its time window,
   only for the right kid (big/little), and only on the home screen.
   ========================================================= */
let NEWS=[];
function newsFetch(){if(!/^https?:$/.test(location.protocol))return;
  fetch('news.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.messages)){NEWS=d.messages;newsMaybe()}}).catch(()=>{})}
function newsMaybe(){
  if(!NEWS.length||document.hidden||!K.mode)return;const h=location.hash;if(h&&h!=='#home'&&h!=='#')return;
  if(!$('#overlay').hidden||document.querySelector('.tf'))return;
  K.seen=K.seen||[];const now=Date.now(),who=K.mode==='little'?'little':'big';
  const m=NEWS.find(m=>m&&m.id&&!K.seen.includes(m.id)&&(!m.mode||m.mode===who)&&(!m.from||now>=Date.parse(m.from))&&(!m.until||now<Date.parse(m.until)));
  if(!m)return;log('news',m.id);
  if(m.type==='toothfairy')return toothFairy(m);
  const pops=awardBig(m.stars||0,m.id);popup(m.em||'💌',m.title||'A message for you!',m.text||'','Yay!',pops)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)newsFetch()});
setInterval(()=>{if(!document.hidden)newsFetch()},10*60*1000);setTimeout(newsFetch,1500);
// gives a big pile of stars at once (no 300 flying stars on a slow tablet), returns a function that shows the sticker news
function awardBig(n,seenId){const before=skTotal();K.stars=(K.stars||0)+n;K.wallet=(K.wallet||0)+n;if(seenId){K.seen=K.seen||[];K.seen.push(seenId)}save();updateStars();
  const after=skTotal();
  return ()=>{if(after<=before)return;const got=after-before;sfx.up();
    popup(skAt(after-1),got===1?'New sticker!':`${got} new stickers!`,'They’re in your sticker book.','Yay!');
    for(let p=Math.floor(before/SK_N)+1;p<=Math.floor(after/SK_N);p++){const done=skPage(p-1),next=skPage(p);
      popup('📒','Page complete!',`Your “${done.title}” page goes in your sticker book. Here’s a brand new page to fill: “${next.title}”!`,'Yay!')}}}

/* ---------- the Tooth Fairy visit ---------- */
async function toothFairy(m){
  const nm=m.name||K.name||'my friend',stars=m.stars||100;
  const o=document.createElement('div');o.className='tf';
  o.innerHTML=`<div class="tfsky">${[...Array(45)].map(()=>`<i style="left:${rnd(0,99)}%;top:${rnd(0,99)}%;animation-delay:${(Math.random()*3).toFixed(2)}s;width:${rnd(3,7)}px;height:${rnd(3,7)}px"></i>`).join('')}</div>
    <div class="tfmoon"></div><p class="tfmsg" id="tfMsg"></p><div class="tftooth" id="tfTooth">🦷</div><div class="tffairy" id="tfFairy">🧚</div>`;
  document.body.appendChild(o);
  const W=()=>o.clientWidth,H=()=>o.clientHeight,fairy=o.querySelector('#tfFairy'),msg=o.querySelector('#tfMsg'),tooth=o.querySelector('#tfTooth');
  const chime=()=>tone([[1047,0,.6],[1319,.14,.6],[1568,.28,.6],[2093,.42,.9],[1568,.7,.5],[2093,.84,1.1]],'sine',0.05);
  const spark=(x,y,em)=>{const s=document.createElement('span');s.className='tfsp';s.textContent=em||pick(['✨','✨','⭐','💫']);s.style.left=x+'px';s.style.top=y+'px';o.appendChild(s);setTimeout(()=>s.remove(),1300)};
  const burst=(x,y,n,ems,far)=>{for(let i=0;i<n;i++){const s=document.createElement('span');s.className='tfburst';s.textContent=pick(ems);s.style.left=x+'px';s.style.top=y+'px';o.appendChild(s);
      const a=Math.PI*2*i/n+Math.random()*.4,d=(far||140)*(.6+Math.random()*.6);requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.5)`;s.style.opacity='0'}));setTimeout(()=>s.remove(),1200)}};
  const fly=(path,ms)=>new Promise(res=>{const t0=performance.now();let last=0;
    const step=t=>{if(!o.isConnected)return res();const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,[x,y]=path(e);
      fairy.style.left=x+'px';fairy.style.top=y+'px';if(t-last>75){last=t;spark(x+38,y+70)}k<1?requestAnimationFrame(step):res()};requestAnimationFrame(step)});
  const show=t=>{msg.textContent=t;msg.classList.add('on');speakNow(t,true)};
  chime();await fsleep(600);show('Psst… someone special visited last night…');await fsleep(3200);
  await fly(e=>[-130+(W()+260)*e,H()*0.34+Math.sin(e*Math.PI*3)*H()*0.12],3600);
  msg.classList.remove('on');tooth.classList.add('on');await fsleep(900);
  show('It’s the Tooth Fairy!');chime();
  const tx=W()/2-45,ty=H()*0.40;
  await fly(e=>[W()+130-(W()+130-tx)*e,H()*0.2+(ty-H()*0.2)*e-Math.sin(e*Math.PI)*H()*0.12],2800);
  fairy.classList.add('bob');await fsleep(500);
  tooth.style.bottom=(H()-ty-70)+'px';tooth.style.transform='translateX(-50%) scale(.35)';tone([[784,0,1.2]],'sine',0.04);
  await fsleep(1700);tooth.style.opacity='0';burst(W()/2,ty+60,18,['✨','⭐','💫'],150);tone([[1568,0,.2],[2093,.08,.5]],'triangle',0.05);
  await fsleep(1300);msg.classList.remove('on');
  fairy.classList.remove('bob');await fly(e=>[tx+(W()*0.06-tx)*e,ty+(H()*0.03-ty)*e],1300);fairy.classList.add('bob');
  // the letter
  const lines=m.letter||[`Dear ${nm},`,`I found your tooth under the stars last night. It is one of the shiniest teeth I have ever seen! ✨`,
    `I’m going to use it to build a sparkly new tower on my castle in Fairy Land.`,`Thank you for taking such good care of it. Here is a little gift, because you were so brave.`];
  const L=document.createElement('div');L.className='tfletter';
  L.innerHTML=`${lines.map(t=>`<p>${t}</p>`).join('')}<p class="sig">Love,<br>The Tooth Fairy 🧚</p><button class="tfgift" id="tfGift" hidden>🎁 Open your gift</button>`;
  o.appendChild(L);requestAnimationFrame(()=>L.classList.add('on'));chime();
  speakNow(lines.join(' ').replace(/[✨🧚]/g,'')+' Love, the Tooth Fairy.',true);
  await fsleep(3000);if(!o.isConnected)return;const gb=L.querySelector('#tfGift');gb.hidden=false;
  gb.onclick=()=>{sfx.tap();L.classList.remove('on');setTimeout(()=>L.remove(),700);
    const bag=document.createElement('div');bag.className='tfbag';bag.textContent='🎁';o.appendChild(bag);speakNow('Tap the present!',true);
    bag.onclick=async()=>{bag.onclick=null;const pops=awardBig(stars,m.id);log('news-done',m.id);
      const r=bag.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;bag.remove();
      burst(cx,cy,36,['⭐','⭐','🌟','✨'],Math.min(W(),H())*0.45);tone([[523,0,.15],[659,.1,.15],[784,.2,.15],[1047,.3,.5]],'triangle',0.08);
      const c=document.createElement('div');c.className='tfcount';o.appendChild(c);
      const t0=performance.now(),dur=2200;let lastTick=0;
      await new Promise(res=>{const step=t=>{const k=Math.min(1,(t-t0)/dur),v=Math.round(stars*(1-Math.pow(1-k,3)));c.textContent=`+${v} ⭐`;
        if(t-lastTick>90&&k<1){lastTick=t;tone([[900+k*700,0,.04]],'sine',0.03)}if(k<1)requestAnimationFrame(step);else res()};requestAnimationFrame(step)});
      speakNow(`${stars} stars! Wow!`,true);burst(W()/2,H()*0.28,20,['⭐','✨','💖'],220);
      await fsleep(1400);const tb=document.createElement('button');tb.className='tfgift tfthanks';tb.textContent='Thank you, Tooth Fairy! 💖';o.appendChild(tb);
      tb.onclick=async()=>{tb.remove();c.remove();sfx.tap();speakNow('Bye bye! Sweet dreams!',true);fairy.classList.remove('bob');
        const fx=parseFloat(fairy.style.left),fy=parseFloat(fairy.style.top);
        await fly(e=>[fx+(W()+140-fx)*e,fy+(-160-fy)*e+Math.sin(e*Math.PI*2)*40],2200);
        o.classList.add('out');setTimeout(()=>{o.remove();pops()},1000)}}};
}

/* =========================================================
   MONEY MARKET: learn coins and dollars the way school teaches it.
   L1 what's each coin worth · L2 count the same coins · L3 count mixed coins (biggest first)
   L4 pay for something with the exact coins · L5 count dollars and coins · L6 how much change?
   Coins show their words (ONE CENT, ONE DIME...) like real ones, not numbers, so he learns them by look.
   ========================================================= */
const MN_COIN={p:{v:1,name:'penny',mm:19,fill:'#c8763c',edge:'#9b5326',word:'ONE CENT',txt:'#6e3510'},n:{v:5,name:'nickel',mm:21,fill:'#c3c7cf',edge:'#9095a0',word:'FIVE CENTS',txt:'#4d535e'},
  d:{v:10,name:'dime',mm:18,fill:'#d4d7de',edge:'#9aa0ab',word:'ONE DIME',ridge:1,txt:'#4d535e'},q:{v:25,name:'quarter',mm:24,fill:'#cfd3da',edge:'#959ba6',word:'QUARTER',ridge:1,txt:'#4d535e'}};
const MN_BILL={1:{word:'ONE'},5:{word:'FIVE'},10:{word:'TEN'}};
const mnFmt=c=>c<100?`${c}¢`:`$${Math.floor(c/100)}.${String(c%100).padStart(2,'0')}`;
const MN_ITEMS=[['🍎','an apple'],['🍌','a banana'],['🧃','a juice box'],['🍪','a cookie'],['✏️','a pencil'],['🎈','a balloon'],['🍭','a lollipop'],['🧸','a teddy bear'],['🚗','a toy car'],['⚽','a ball'],['🦖','a toy dino'],['📕','a book'],['🥷','a ninja mask'],['🧩','a puzzle']];
function mnCoin(k,scale=4.2,label){const C=MN_COIN[k],r=C.mm*scale/2,s=r*2+4,c=s/2;
  return `<svg class="mncoin" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-label="${C.name}"><circle cx="${c}" cy="${c}" r="${r}" fill="${C.edge}"/>
    ${C.ridge?`<circle cx="${c}" cy="${c}" r="${r-1.5}" fill="none" stroke="${C.fill}" stroke-width="3" stroke-dasharray="2 2"/>`:''}
    <circle cx="${c}" cy="${c}" r="${r*0.86}" fill="${C.fill}"/><circle cx="${c}" cy="${c}" r="${r*0.86}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <text x="${c}" y="${c+r*0.1}" text-anchor="middle" font-size="${Math.max(7,r*0.3)}" font-weight="800" fill="${C.txt}" font-family="sans-serif">${C.word.split(' ').map((w,i,a)=>`<tspan x="${c}" dy="${i?r*0.34:-(a.length-1)*r*0.17}">${w}</tspan>`).join('')}</text>
    ${label?`<text x="${c}" y="${s-3}" text-anchor="middle" font-size="12" font-weight="800" fill="#1d2b4f">${label}</text>`:''}</svg>`}
function mnBill(v,w=150){const h=w*0.43;return `<svg class="mnbill" width="${w}" height="${h}" viewBox="0 0 150 64" aria-label="${v} dollar bill"><rect x="1" y="1" width="148" height="62" rx="5" fill="#cfe6c4" stroke="#6f9a62" stroke-width="2"/>
  <rect x="6" y="6" width="138" height="52" rx="3" fill="none" stroke="#86b078" stroke-width="1.5"/><ellipse cx="75" cy="32" rx="16" ry="20" fill="#b6d6a8" stroke="#6f9a62"/>
  <text x="16" y="22" font-size="14" font-weight="800" fill="#2f5a25" font-family="sans-serif">${v}</text><text x="134" y="56" text-anchor="end" font-size="14" font-weight="800" fill="#2f5a25" font-family="sans-serif">${v}</text>
  <text x="112" y="24" text-anchor="middle" font-size="9" font-weight="800" fill="#2f5a25" font-family="sans-serif">${MN_BILL[v].word}</text><text x="38" y="52" text-anchor="middle" font-size="9" font-weight="800" fill="#2f5a25" font-family="sans-serif">DOLLAR${v>1?'S':''}</text></svg>`}
// a pile of coins worth `c` cents using the biggest coins, then mixed up a little so he has to sort them
function mnPile(c,mix){const out=[];for(const k of ['q','d','n','p']){while(c>=MN_COIN[k].v){out.push(k);c-=MN_COIN[k].v}}
  if(mix&&out.length<6){const i=out.indexOf('q');if(i>=0&&Math.random()<.5){out.splice(i,1,'d','d','n')}}return out}
const mnSort=a=>a.slice().sort((x,y)=>MN_COIN[y].v-MN_COIN[x].v);
function mnChoices(ans,step){const s=new Set([ans]);let g=0;while(s.size<4&&g++<60){const d=pick([1,2,3])*pick([-1,1])*step;const v=ans+d;if(v>0)s.add(v)}return shuffle([...s])}
// "count it with me": label each coin with the running total, biggest first
function mnCountAlong(box,coins,bills){const els=[...box.querySelectorAll('[data-v]')].sort((a,b)=>b.dataset.v-a.dataset.v);let tot=0,i=0;
  els.forEach(e=>{e.classList.remove('lit');e.parentNode.appendChild(e)});
  const step=()=>{if(i>=els.length||!box.isConnected)return;const e=els[i++];tot+=+e.dataset.v;e.classList.add('lit');
    let t=e.querySelector('.mnrun');if(!t){t=document.createElement('b');t.className='mnrun';e.appendChild(t)}t.textContent=mnFmt(tot);speakNow(mnFmt(tot).replace('¢',' cents').replace(/^\$(\d+)\.(\d\d)$/,(m,d,c)=>`${d} dollars${+c?' and '+(+c)+' cents':''}`),true);setTimeout(step,1100)};
  step()}
function playMoney(){
  if(location.hash!=='#money')return;
  const lv=K.lv.money,tok=loopToken;setHeader('Money Market',`Level ${lv}`);
  const done=btn=>{addStars(1,btn,'money');if(correct('money'))setTimeout(()=>levelUp('money',playMoney),600);else setTimeout(()=>{if(tok===loopToken)playMoney()},900)};

    $('#ch').replaceWith(ch);if(help)$('#mnHelp').onclick=()=>mnCountAlong($('#mnStage'));speakNow(prompt.replace(/<[^>]+>/g,''))};
  const coinRow=ks=>ks.map(k=>`<span class="mnc" data-v="${MN_COIN[k].v}">${mnCoin(k)}</span>`).join('');
  if(lv===1){const k=pick(['p','n','d','q']);
    if(Math.random()<.5)return ask('How much is this coin worth?',`<span class="mnc">${mnCoin(k,6)}</span><p class="mncap">This is a ${MN_COIN[k].name}.</p>`,MN_COIN[k].v,[1,5,10,25],mnFmt,false);
    // tap the coin
    view.innerHTML=`<div class="board"><p class="prompt">Tap the <b>${MN_COIN[k].name}</b>.</p><div class="panel mnstage">${shuffle(['p','n','d','q']).map(c=>`<button class="mnpick" data-k="${c}">${mnCoin(c)}</button>`).join('')}</div><p class="note" id="mnNote" style="text-align:center;min-height:1.4em"></p>${progressDots('money')}</div>`;
    speakNow(`Tap the ${MN_COIN[k].name}.`);
    view.querySelectorAll('.mnpick').forEach(b=>b.onclick=()=>{if(b.dataset.k===k){b.classList.add('ok');sfx.yes();done(b)}else{b.classList.add('no');sfx.no();K.got.money=0;save();wrongNote(`That's a ${MN_COIN[b.dataset.k].name}. It's worth ${mnFmt(MN_COIN[b.dataset.k].v)}.`)}});return}
  if(lv===2){const k=pick(['n','d','q','d','n']),n=rnd(2,k==='q'?4:6),ans=MN_COIN[k].v*n;
    return ask(`How much money is this?`,coinRow(Array(n).fill(k)),ans,mnChoices(ans,MN_COIN[k].v),mnFmt,true)}
  if(lv===3){const ans=rnd(3,19)*5+(Math.random()<.5?rnd(1,4):0),ks=shuffle(mnPile(ans,true));
    return ask(`How much money is this? <small>Start with the biggest coins!</small>`,coinRow(ks),ans,mnChoices(ans,5),mnFmt,true)}
  if(lv===4){// pay for it: put coins on the counter
    const [em,what]=pick(MN_ITEMS),price=rnd(2,19)*5+(Math.random()<.4?rnd(1,4):0);let put=[];
    view.innerHTML=`<div class="board"><p class="prompt">${em} ${what[0].toUpperCase()+what.slice(1)} costs <b>${mnFmt(price)}</b>. Pay for it!</p>
      <div class="panel mncounter" id="mnCounter"><span class="mnempty">Tap coins to put them here</span></div><p class="mntot" id="mnTot">You put down: 0¢</p>
      <div class="mntray">${['q','d','n','p'].map(k=>`<button class="mnpick" data-k="${k}">${mnCoin(k,3.6)}</button>`).join('')}</div>
