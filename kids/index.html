/* =========================================================
   SPELLING WORDS (Noah): the weekly school list, practiced like the real test.
   The tablet says the word, uses it in a sentence, says it again; he spells it on a big letter keyboard.
   The list is split across the days before the test; the last day is a practice test of every word.
   Until today's words are done, the rest of the app stays locked (Message Mom & Dad still works).
   ========================================================= */
const wdAdd=(k,n)=>{const [y,m,d]=k.split('-').map(Number),t=new Date(y,m-1,d+n);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};
const wdDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short'})};
function wdPlan(){const W=K.words;if(!W||!W.list||!W.list.length)return null;const today=dayKey(0),days=[];
  for(let d=W.start;d<W.test&&days.length<7;d=wdAdd(d,1))days.push(d);
  const n=Math.max(1,days.length),cs=Math.ceil(W.list.length/n),idx=days.indexOf(today),active=idx>=0,last=idx===days.length-1;
  W.got=W.got||{};W.fin=W.fin||{};W.miss=W.miss||{};W.skip=W.skip||{};W.done=W.done||{};
  const need=!active?[]:last?W.list.filter(x=>W.fin[x.w]!==today):W.list.slice(0,(idx+1)*cs).filter(x=>!W.got[x.w]);
  return{W,days,idx,active,last,cs,need,today,learned:W.list.filter(x=>W.got[x.w]).length}}
function wdLocked(){if(K.mode!=='big')return false;const P=wdPlan();return !!(P&&P.active&&P.need.length&&!P.W.skip[P.today]&&!P.W.done[P.today])}
const WD_FREE=['','home','spelling','chat','grownups'];
function wdSummary(){const P=wdPlan();if(!P)return null;const W=P.W;
  return{n:W.list.length,test:W.test,start:W.start,learned:P.learned,need:P.need.length,locked:wdLocked(),doneToday:!!W.done[P.today],skipped:!!W.skip[P.today],
    tricky:Object.entries(W.miss).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([w,c])=>w+' ('+c+')'),list:W.list.map(x=>x.w)}}
// gate screen on Noah's home
function wdHome(){const P=wdPlan(),W=P.W;setHeader('Star Quest','Spelling words first!');
  view.innerHTML=`<div class="wdgate"><div class="wdcard"><div class="wdem">📝</div><h2>Spelling words first!</h2>
      <p>${P.last?`Practice test day! Spell all <b>${W.list.length}</b> words. Test is ${wdDay(W.test)}.`:`Today: <b>${P.need.length}</b> word${P.need.length===1?'':'s'}. Then everything unlocks!`}</p>
      <button class="pbtn go wdstart" id="wdGo">Start ▶</button>
      <div class="wddays">${P.days.map((d,i)=>`<span class="${W.done[d]?'done':i===P.idx?'now':''}">${wdDay(d)}${W.done[d]?' ✓':''}</span>`).join('')}<span class="test">${wdDay(W.test)} 🏆 Test</span></div>
      <div class="skbar" style="--pc:#2f9be0"><i style="width:${P.learned/W.list.length*100}%"></i></div><small>${P.learned} of ${W.list.length} words learned this week</small></div>
    <div class="row"><button class="pbtn" id="wdChat">💬 Message Mom & Dad</button><button class="pbtn" id="wdSkip">Grown-up: skip today</button></div>
    <div class="home-foot"><span></span><button class="grownup" id="grown">Grown-ups: press and hold<i></i></button></div></div>`;
  speakNow(P.last?'Practice test day! Let\'s spell all your words.':`Spelling words first! You have ${P.need.length} words today.`);
  $('#wdGo').onclick=()=>{sfx.tap();go('spelling')};$('#wdChat').onclick=()=>go('chat');
  $('#wdSkip').onclick=()=>pinPad('Grown-up: enter your PIN to skip today',()=>{W.skip[P.today]=true;save();famPush(true);home()});
  holdGrownups()}
const WD_KEYS=['abcdefg','hijklmn','opqrstu',"vwxyz'"];
function playSpelling(){
  if(location.hash!=='#spelling')return;
  const P=wdPlan();if(!P){setHeader('Spelling Words','');view.innerHTML='<div class="board"><p class="prompt">No spelling words right now.</p><p class="note" style="text-align:center">Mom or Dad will add your list from their phone.</p></div>';return}
  const W=P.W,tok=loopToken,today=P.today,gated=P.active&&P.need.length&&!W.done[today];
  // today's queue, or (no gate) extra practice on the whole list
  let queue=(gated?P.need:W.list).map(x=>({...x})),total=queue.length,doneN=0,typed='',mode='spell',helped=false;
  const say=x=>speakNow(`${x.w}. ${x.s?x.s.replace(/[.!?]?$/,'.'):''} ${x.w}.`,true);
  const cur=()=>queue[0];
  const draw=(msg)=>{if(tok!==loopToken)return;const x=cur();setHeader('Spelling Words',gated?`${total-doneN} left today`:'Extra practice');
    view.innerHTML=`<div class="wdwrap"><div class="wdtop"><button class="pbtn wdhear" id="wdHear">🔊 Hear it again</button><div class="wdprog"><i style="width:${doneN/total*100}%"></i></div><span>${doneN} / ${total}</span></div>
      ${mode==='copy'?`<div class="wdshow">${x.w.split('').map(c=>`<span>${c}</span>`).join('')}</div><p class="wdmsg">Now you type it while you look.</p>`:`<p class="wdmsg">${msg||'Listen, then spell the word.'}</p>`}
      <div class="wdtyped ${typed?'':'empty'}" id="wdTyped">${typed?typed.split('').map(c=>`<span>${c}</span>`).join(''):'<i>tap the letters</i>'}<b class="wdcur"></b></div>
      <div class="wdkeys">${WD_KEYS.map(r=>`<div>${r.split('').map(c=>`<button data-k="${c}">${c}</button>`).join('')}</div>`).join('')}
        <div><button class="wdwide" data-k="del">⌫</button>${mode==='spell'?`<button class="wdwide" data-k="hint">💡 First letter</button>`:''}<button class="wdwide go" data-k="ok">Check ✓</button></div></div></div>`;
    $('#wdHear').onclick=()=>say(x);
    view.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
      if(k==='del'){typed=typed.slice(0,-1);return draw(msg)}
      if(k==='hint'){helped=true;if(!typed)typed=x.w[0];draw(`It starts with "${x.w[0]}".`);speakNow(`It starts with ${x.w[0]}.`,true);return}
      if(k==='ok')return check();
      if(typed.length<20){typed+=k;tone([[600+typed.length*30,0,.04]],'sine',0.03);draw(msg)}})};
  const check=()=>{const x=cur(),ok=typed.trim().toLowerCase()===x.w.toLowerCase();
    if(mode==='copy'){if(ok){sfx.yes();mode='spell';typed='';queue.push(queue.shift());if(queue.length>2)queue.splice(2,0,queue.pop());next('Good! That word will come back later.')}else{sfx.no();typed='';draw()}return}
    if(ok&&!helped){sfx.yes();W.got[x.w]=today;if(P.last||!P.active)W.fin[x.w]=today;queue.shift();doneN++;typed='';save();addStars(1,$('#wdTyped'),'spelling');
      if(!queue.length)return finish();next(pick(['Great spelling!','You got it!','Nice work!','Correct!']))}
    else if(ok&&helped){sfx.yes();typed='';helped=false;queue.push(queue.shift());next('Right! You had help, so it will come back for you to try alone.')}
    else{sfx.no();W.miss[x.w]=(W.miss[x.w]||0)+1;save();const wrong=typed;typed='';helped=false;mode='copy';
      draw();const m=view.querySelector('.wdmsg');m.innerHTML=`You wrote <b class="wdbad">${wrong.split('').map((c,i)=>`<span class="${c===x.w[i]?'':'x'}">${c}</span>`).join('')||'nothing'}</b>. Here is how to spell it. Now type it while you look.`;
      speakNow(`Almost! ${x.w} is spelled ${x.w.split('').join(', ')}.`,true)}};
  const next=msg=>{helped=false;typed='';draw(msg);setTimeout(()=>{if(tok===loopToken&&queue.length)say(cur())},700)};
  const finish=()=>{if(gated){W.done[today]=true;save();addStars(5,view,'spelling');famPush(true);
      const tricky=Object.keys(W.miss).filter(w=>P.need.some(x=>x.w===w));famAlert(`📝 ${kidName()} finished spelling`,`${total} word${total===1?'':'s'} done${tricky.length?`. Tricky: ${tricky.slice(0,6).join(', ')}`:'. No misses!'}`,'pencil')}
    sfx.up();popup('🏆',gated?'All done for today!':'Practice done!',gated?(P.last?'You spelled every word. You are ready for your test!':'Everything is unlocked. Go play!'):'Great extra practice!','Yay!',()=>go('home'))};
  if(!queue.length){view.innerHTML='<div class="board"><p class="prompt">All done for today! 🎉</p></div>';return}
  draw();setTimeout(()=>{if(tok===loopToken)say(cur())},500);
}

function wdSet(c){const list=(c.list||[]).map(x=>({w:String(x.w||'').toLowerCase().replace(/[^a-z']/g,'').slice(0,20),s:String(x.s||'').slice(0,160)})).filter(x=>x.w);
  if(!list.length){K.words=null;save();return}
  const today=dayKey(0),start=c.start&&c.start>today?c.start:today;
  K.words={id:c.id||Date.now(),list,start,test:c.test&&c.test>start?c.test:wdAdd(start,3),got:{},fin:{},miss:{},skip:{},done:{}};save()}

    <div class="prow"><span>Who plays on this tablet?</span><span class="ctl"><button class="pbtn" id="modeB" style="${K.mode!=='little'?'background:var(--ink);color:#fff':''}">Big kid</button><button class="pbtn" id="modeL" style="${K.mode==='little'?'background:var(--ink);color:#fff':''}">Little kid</button></span></div>

    ${GAMES.filter(g=>g.max&&(K.mode==='little'?(g.little||g.both):!g.little)).map(g=>`<div class="prow"><span>${g.em} ${g.name}</span><span class="ctl"><button class="pm" data-d="-1" data-id="${g.id}" aria-label="Easier">−</button>Level ${K.lv[g.id]} <small style="font-size:14px;color:var(--muted)">${g.play?'':'/ '+g.max}</small><button class="pm" data-d="1" data-id="${g.id}" aria-label="Harder">+</button></span></div>`).join('')}
    <div class="row" style="justify-content:flex-start">
      <button class="pbtn" id="snd">Sound: ${K.sound?'On':'Off'}</button>
      <button class="pbtn" id="fs">Full screen: ${K.full===false?'Off':'On'}</button></div>
    <div class="prow" id="vrow" style="flex-wrap:wrap"><span>Voice</span><span class="ctl" style="flex-wrap:wrap"><button class="pbtn" id="vonoff" style="${voiceOn()?'background:var(--ink);color:#fff':''}">${voiceOn()?'On':'Off'}</button><select id="vsel" style="font:inherit;font-size:17px;padding:8px;border-radius:12px;border:2px solid var(--sky-2);max-width:16em"></select>
      <button class="pm" id="vslow" aria-label="Slower">🐢</button><button class="pm" id="vfast" aria-label="Faster">🐇</button><button class="pbtn" id="vtest">▶ Test</button></span></div>
    ${K.mode!=='little'?`<div class="prow" style="flex-wrap:wrap"><span>Play games cost stars <small style="color:var(--muted)">(Fruit Pop, Bubble Pop, Dino Dash, Tower Builder, Brick Builder, Fishing Trip, Fruit Slice, Ninja Portal, Movies & Shows)</small></span><span class="ctl"><button class="pbtn" id="gateT">${K.gate===false?'Off':'On'}</button></span></div>
    ${K.gate!==false?`<div class="prow" style="flex-wrap:wrap"><span>Each star buys</span><span class="ctl">${[1,2,3,5].map(m=>`<button class="pbtn" data-mps="${m}" style="${minsPerStar()===m?'background:var(--ink);color:#fff':''}">${m} min</button>`).join('')}</span></div>
    <div class="prow" style="flex-wrap:wrap"><span>Stars to spend: <b>${K.wallet}</b> · Play time left: <b>${fmtSec(K.playSec||0)}</b></span><span class="ctl"><button class="pbtn" id="give5">+5 stars</button><button class="pbtn" id="time5">+5 min</button><button class="pbtn" id="time0">Clear time</button></span></div>`:''}`:''}
    ${famGrownups()}
    ${tvGrownups()}
    ${logGrownups()}
    <div class="row" style="justify-content:flex-start"><button class="pbtn ${resetArm?'warn':''}" id="rst">${resetArm?'Tap again to erase everything':'Reset stars and stickers'}</button></div>
    <p class="note">Levels go up by themselves after ${PER_LEVEL} right answers. Use − and + if a game feels too hard or too easy.</p>`;
  view.querySelectorAll('.pm').forEach(b=>b.onclick=()=>{const g=GAMES.find(x=>x.id===b.dataset.id);K.lv[g.id]=Math.max(1,Math.min(g.max,K.lv[g.id]+ +b.dataset.d));K.got[g.id]=0;save();grownups()});
  $('#snd').onclick=()=>{K.sound=!K.sound;save();grownups()};
  $('#modeB').onclick=()=>{K.mode='big';save();applyMode();grownups()};$('#modeL').onclick=()=>{K.mode='little';save();applyMode();grownups()};
  $('#kidName').onchange=e=>{K.name=e.target.value.trim().replace(/[^A-Za-z \-']/g,'');K.traceIdx=0;save()};
  (function voicePicker(){const sel=$('#vsel');if(!sel)return;let list=[];
    if(window.SQAndroid&&SQAndroid.voices){try{list=JSON.parse(SQAndroid.voices()).map(v=>({id:v.name,label:v.name.replace(/[-_]/g,' ')+(v.q>=400?' ★':'')+(v.net?' (needs internet)':''),on:v.on}))}catch(e){}}
    else list=webVoices().map(v=>({id:v.name,label:v.name+(v.localService?'':' (needs internet)'),on:v.name===K.voiceName}));
    list.sort((a,b)=>(b.label.includes('★')-a.label.includes('★'))||a.label.localeCompare(b.label));
    if(!list.length){$('#vrow').querySelector('span').textContent='Voice (this tablet has no voices to choose from)';sel.hidden=true}
    sel.innerHTML=list.map(v=>`<option value="${v.id.replace(/"/g,'')}" ${v.on||v.id===K.voiceName?'selected':''}>${v.label}</option>`).join('');
    $('#vonoff').onclick=()=>{K.voiceOn=!voiceOn();save();grownups();if(K.voiceOn)speakNow('Voice is on!')};
    const test=()=>speakNow(K.name?`Hi ${K.name}! Let's catch some butterflies!`:`Hi! Let's play Star Quest!`,true);
    sel.onchange=()=>{K.voiceName=sel.value;save();if(window.SQAndroid&&SQAndroid.setVoice)SQAndroid.setVoice(sel.value);test()};
    const pace=d=>{K.vrate=Math.max(0.6,Math.min(1.4,(K.vrate||0.95)+d));save();if(window.SQAndroid&&SQAndroid.setPace)SQAndroid.setPace(K.vrate,K.vpitch||1);test()};
    $('#vslow').onclick=()=>pace(-0.1);$('#vfast').onclick=()=>pace(0.1);$('#vtest').onclick=test;
    if(!window.SQAndroid&&'speechSynthesis' in window&&!list.length)speechSynthesis.onvoiceschanged=()=>{if(location.hash==='#grownups')grownups()}})();
  if($('#gateT')){$('#gateT').onclick=()=>{K.gate=K.gate===false;save();grownups()};
    view.querySelectorAll('[data-mps]').forEach(b=>b.onclick=()=>{K.minsPerStar=+b.dataset.mps;save();grownups()});
    if($('#give5')){$('#give5').onclick=()=>{K.wallet=(K.wallet||0)+5;save();grownups()};$('#time5').onclick=()=>{K.playSec=(K.playSec||0)+300;save();grownups()};$('#time0').onclick=()=>{K.playSec=0;save();grownups()}}}
  tvGrownupsWire(grownups);logWire(grownups);famGrownupsWire(grownups);
  $('#fs').onclick=()=>{K.full=K.full===false;save();if(K.full===false&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});grownups()};
  $('#rst').onclick=()=>{if(!resetArm){resetArm=true;return grownups()}resetArm=false;const keep={pin:K.pin,rate:K.rate,jf:K.jf,jfDev:K.jfDev,jfLast:K.jfLast,mode:K.mode,name:K.name,voiceName:K.voiceName,voiceOn:K.voiceOn,gate:K.gate,minsPerStar:K.minsPerStar};K=Object.assign(blank(),keep,{wallet:0,playSec:0});save();updateStars();grownups()};
}

/* ---------- navigation (plain #names so the back button works) ---------- */
const ROUTES={story:()=>{playStory.cur=null;playStory()},playground:playPlayground,puzzle:playPuzzle,piano:playPiano,robot:playRobot,boss:playBoss,times:playTimes,money:playMoney,bank:playBank,chat:playChat,spelling:playSpelling,ninjaread:playRead,daily:playDaily,butterfly:playButterfly,dressup:playDressup,color:playColoring,sort:playSort,trace:playTrace,fruit:gated('fruit',()=>playFruit()),bubble:gated('bubble',()=>playBubble()),runner:gated('runner',playRunner),tower:gated('tower',playTower),brick:gated('brick',playBrick),fish:gated('fish',playFish),slice:gated('slice',playSlice),ninja:gated('ninja',playNinja),tv:gated('tv',()=>{TV.stack=[];playTv()}),mix:playMix,adventure:()=>{ADV.step=null;playAdventure()},math:playMath,clock:playClock,words:playWords,rhyme:playRhyme,memory:playMemory,pattern:playPattern,doodle:playDoodle,stickers,grownups};
function go(name){if(location.hash.slice(1)!==name)location.hash=name;else show()}
function show(){if(window.__tvKill)window.__tvKill();loopToken++;let r=location.hash.slice(1);if(wdLocked()&&!WD_FREE.includes(r)){history.replaceState(null,'','#home');r='home'}resetArm=false;$('#timeChip').hidden=true;updateStars();$('#overlay').hidden=true;popQ.length=0;try{if(window.SQAndroid)SQAndroid.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  view.scrollTop=0;(ROUTES[r]||home)()}
window.addEventListener('hashchange',show);
$('#homeBtn').onclick=()=>{sfx.tap();go('home')};
window.addEventListener('resize',()=>{if(location.hash==='#doodle'&&playDoodle.resize)playDoodle.resize();if(location.hash==='#fruit'&&playFruit.fit)playFruit.fit();if(location.hash==='#trace'&&playTrace.fit)playTrace.fit();if(location.hash==='#brick'&&playBrick.fit)playBrick.fit();const S=canvasGame.cur;if(S&&S.alive())S.fit()});
// In a browser, go full screen on the first tap so it feels like an app (not needed inside the installed app)
const inApp=/\bwv\b|; wv\)/.test(navigator.userAgent)||matchMedia('(display-mode: standalone)').matches;
function goFull(){if(inApp||K.full===false||document.fullscreenElement)return;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
  if(f)try{const r=f.call(el);r&&r.catch&&r.catch(()=>{})}catch(e){}}
document.addEventListener('pointerup',goFull,{passive:true});
applyMode();updateStars();show();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
// Hands-off updates: the tablet keeps the app open for days, so look for a new version when it wakes up and every 30 minutes,
// then reload only on the home screen (never in the middle of a game, a story or a movie).
(function(){let base=null,want=false;
  const atHome=()=>!location.hash||location.hash==='#home';
  const ver=()=>fetch('sw.js?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(t=>{const m=t&&t.match(/VERSION='([^']+)'/);return m&&m[1]}).catch(()=>null);
  const tryReload=()=>{const o=document.getElementById('overlay');if(want&&atHome()&&!document.hidden&&!document.querySelector('.tf')&&(!o||o.hidden))location.reload()};
  const check=()=>{if(document.hidden)return;ver().then(v=>{if(!v)return;if(!base){base=v;return}if(v!==base){want=true;tryReload()}})};
  window.addEventListener('load',()=>setTimeout(check,3000));document.addEventListener('visibilitychange',check);
  setInterval(check,30*60*1000);window.addEventListener('hashchange',()=>setTimeout(tryReload,600));
})();
</script>
